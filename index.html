<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Пошук</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, Arial, sans-serif;
    background: #fff;
    touch-action: none;
}
#pages {
    display: flex;
    width: 300%; /* Початкове розташування без очікування JavaScript */
    height: 100%;
    transform: translateX(-33.333333%); /* Одразу показуємо сторінку пошуку */
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.page {
    width: 33.333333%; /* Геометрія сторінок доступна ще до запуску JS */
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
}
/* ==================== SEARCH PAGE ==================== */
.search-header {
    padding: 16px 16px 8px;
    padding-top: calc(30px + env(safe-area-inset-top));
    flex-shrink: 0;
}
#page-articles .scroll-area {
    padding-top: calc(30px + env(safe-area-inset-top));
}
input#input {
    width: 100%;
    padding: 16px 18px;
    font-size: 22px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    text-align: center;
    outline: none;
    background: #f9fafb;
    color: #111;
    caret-color: transparent;
    height: 60px;
}
.scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 16px 16px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}
/* ==================== КРАПОЧКИ ГЛИБИНИ АРТИКУЛІВ ==================== */
.articles-dots {
    position: fixed;
    bottom: calc(8px + env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    height: 18px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 7px;
    z-index: 30;
    pointer-events: none;
}
.articles-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d1d5db;
    transition: all 0.2s ease;
}
.articles-dots .dot.past {
    background: #9ca3af;
}
.articles-dots .dot.active {
    width: 9px;
    height: 9px;
    background: #111827;
}
/* ==================== СВАЙП ВНУТРІШНІХ РІВНІВ ==================== */
.articles-drag-wrapper {
    display: flex;
    align-items: flex-start;
    width: 200%;
    will-change: transform;
}
.articles-drag-pane {
    width: 50%;
    flex: 0 0 50%;
    box-sizing: border-box;
    min-width: 0;
    padding: 0;
}
#page-articles.articles-swiping .scroll-area {
    overflow-y: hidden;
    touch-action: none;
}
#page-articles,
#page-articles * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
#page-articles table,
#page-articles td,
#page-articles th,
#page-articles .result-card,
#page-articles .premontage-title {
    touch-action: pan-y;
}
/* Заборона системного виділення / "Копіювати" на пошуку, обраних і панелях */
#page0,
#page0 *,
#page-waitlist,
#page-waitlist *,
#pm-qty-panel,
#pm-qty-panel * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
/* Поля коментаря лишаються редагованими */
#page0 textarea,
#page-waitlist textarea,
#pm-qty-panel textarea,
#page-articles textarea {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
}
/* ==================== RESULT CARDS ==================== */
.result-card {
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    padding: 24px;
    margin-bottom: 16px;
}
.result-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}
.result-material-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #111111;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.1;
    white-space: nowrap;
}
.result-address-new {
    font-weight: 600;
    font-size: 14px;
    color: #059669;
    white-space: nowrap;
    text-align: right;
}
/* Іконки та зірочка: лише у класичному режимі / лише в читабельному */
body.interface-readable .ico {
    display: none;
}
body.interface-readable .star-right {
    display: none;
}
body.interface-classic .star-left {
    display: none;
}
/* Адреса на сторінці пошуку (читабельний режим): чорний шрифт у рамці */
body.interface-readable #result .result-address-new,
body.interface-readable #waitlist-result .result-address-new {
    color: #111111;
    font-size: 15px;
    font-weight: 700;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 14px;
    padding: 8px 14px;
}
.article-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid #ECECEC;
}
.article-row:first-child {
    border-top: none;
    padding-top: 0;
}
/* Обраний артикул у результатах пошуку: смужка зліва без заливки рядка */
/* Обраний артикул у результатах пошуку: лівий край рамки кольорового відтінку */
.art-r.art-r-fav {
    border-left: 4px solid #003366;
    padding-left: 11px;
}
.article-number {
    font-size: 15px;
    font-weight: 700;
    color: #111111;
    white-space: nowrap;
}
.article-number .art-g1 {
    margin-right: 3px;
}
.article-number .art-g2 {
    font-size: 1.2em;
    margin-right: 3px;
}
.article-stations {
    font-size: 20px;
    font-weight: 800;
    color: #111111;
    text-align: right;
    line-height: 1.3;
}
.article-row .article-stations {
    flex: 1;
    min-width: 0;
}
.station-list-classic {
    display: none;
}
.station-list-readable {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 4px;
}
.station-chip {
    display: inline-flex;
    min-width: 34px;
    min-height: 30px;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #f3f4f6;
    color: #111;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
}
body.interface-classic .station-list-classic {
    display: block;
}
body.interface-classic .station-list-readable {
    display: none;
}
body.interface-readable .station-list-classic {
    display: none;
}
body.interface-readable .station-list-readable {
    display: flex;
}
/* Читабельний вигляд артикулу: проєкт (сірий) · НАЗВА (акцент) · стан (сірий) */
.art-classic {
    display: inline;
}
.art-readable {
    display: none;
}
body.interface-classic .art-classic {
    display: inline;
}
body.interface-classic .art-readable {
    display: none;
}
body.interface-readable .art-classic {
    display: none;
}
body.interface-readable .art-readable {
    display: inline-flex;
}
.art-r {
    align-items: baseline;
    gap: 2px;
    white-space: nowrap;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 14px;
    padding: 8px 14px;
}
.art-r-base {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.15;
    color: #111;
}
.art-r-stack {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
}
.art-r-stan {
    font-size: 14px;
    font-weight: 700;
    color: #6b7280;
    margin-left: 1px;
}
/* ==================== СПИСОК ОЧІКУВАННЯ ==================== */
.wl-menu-btn {
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #111;
    font-size: 20px;
    line-height: 1;
    border-radius: 10px;
    padding: 6px 10px;
    margin-left: 12px;
    cursor: pointer;
    touch-action: manipulation;
}
.wl-menu-btn.open {
    background: #eef2ff;
    border-color: #c7d2fe;
    color: #4338ca;
}
.wl-history {
    position: absolute;
    left: 16px;
    right: 16px;
    top: calc(88px + env(safe-area-inset-top));
    z-index: 40;
    max-height: 60%;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    padding: 6px 0;
    touch-action: pan-y;
}
.wl-history-title {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 800;
    color: #6b7280;
}
.wl-history-row {
    display: flex;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid #f0f0f0;
    font-size: 14px;
    color: #111;
}
.wl-history-time {
    flex-shrink: 0;
    min-width: 78px;
    font-size: 12px;
    font-weight: 700;
    color: #6b7280;
}
.wl-history-text {
    word-break: break-word;
}
.wl-history-empty {
    padding: 12px 14px;
    font-size: 14px;
    color: #9ca3af;
}
.waitlist-title {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #111111;
    text-align: center;
    padding: 8px 0;
}
.select-btn {
    border: none;
    background: transparent;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    color: #d1d5db;
    flex-shrink: 0;
}
.select-btn.selected {
    color: #FFC400;
}
.select-btn:active {
    transform: scale(.9);
}
.article-choice-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
}
.article-choice-main {
    flex: 1;
    min-width: 0;
}
.article-favorite-btn {
    width: 54px;
    min-width: 54px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #9ca3af;
    border-radius: 14px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
}
.article-favorite-btn.selected {
    color: #FFC400;
    background: #fffaf0;
    border-color: #f3d37a;
}
.article-favorite-btn:active {
    transform: scale(.96);
}
.waitlist-actions-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
}
.waitlist-remove-btn {
    border: none;
    background: #fff7e0;
    color: #b45309;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    flex: 1;
    text-align: center;
    cursor: pointer;
}
.waitlist-remove-btn:active {
    background: #fdeeca;
}
.comment-toggle-btn {
    border: none;
    background: #eef2ff;
    color: #4338ca;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    flex: 1;
    text-align: center;
    cursor: pointer;
}
.comment-toggle-btn:active {
    background: #e0e7ff;
}
.comment-edit-area {
    margin-top: 12px;
}
.comment-textarea {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 64px;
    outline: none;
    color: #111;
    background: #f9fafb;
}
.comment-save-btn {
    display: block;
    margin-top: 8px;
    border: none;
    background: #4338ca;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    width: 100%;
    text-align: center;
    cursor: pointer;
}
.comment-save-btn:active {
    background: #372ea8;
}
.waitlist-comment-text {
    margin-top: 12px;
    padding: 10px 12px;
    background: #f3f4f6;
    border-radius: 10px;
    font-size: 14px;
    color: #374151;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
/* ==================== ПАНЕЛЬ ПЕРЕДМОНТАЖУ ==================== */
.premontage-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
}
.premontage-nav-btn {
    border: none;
    background: #eef2ff;
    color: #4338ca;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
}
.premontage-nav-btn:active {
    background: #e0e7ff;
}
.premontage-nav-btn.active {
    background: #4338ca;
    color: #fff;
}
.premontage-close-btn {
    background: #fff7e0;
    color: #b45309;
    margin-left: auto;
}
.premontage-close-btn:active {
    background: #fdeeca;
}
.premontage-title {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    margin-bottom: 14px;
}
.level-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}
.level-head-left {
    font-size: 20px;
    font-weight: 800;
    color: #111;
}
.level-head-main {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.level-head-tail {
    font-size: 0.7em;
    font-weight: 700;
    color: #6b7280;
    margin-left: 1px;
}
.level-head-right {
    font-size: 20px;
    font-weight: 800;
    color: #111;
    text-align: right;
}
.premontage-btn-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}
.premontage-item-btn {
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #111;
    font-weight: 700;
    font-size: 15px;
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    white-space: normal;
    word-break: break-word;
}
.premontage-item-btn:active {
    background: #eef2ff;
}
.premontage-item-btn.favorite {
    background: #fffaf0;
    border-color: #f3d37a;
}
.wire-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.wire-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px 14px;
}
.wire-name {
    font-weight: 800;
    font-size: 16px;
    color: #111;
    flex-shrink: 0;
}
.wire-code {
    font-size: 13px;
    color: #6b7280;
    flex: 1;
    text-align: center;
}
.wr-slot {
    display: flex;
    align-items: center;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
}
.wr-name {
    flex: none;
    white-space: nowrap;
}
.wr-slot .pm-qty-badge {
    flex: none;
}
.result-card.pm-flat {
    background: transparent;
    box-shadow: none;
    border-radius: 0;
    padding: 0;
}
.result-card.pm-flat .pm-group-article {
    padding: 0 2px;
}
.list-station-box {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    background: #fff;
    padding: 2px 12px 4px;
    margin-bottom: 10px;
}
.list-station-box .wire-row {
    border: none;
    background: transparent;
    border-radius: 0;
    padding: 12px 0;
    border-top: 1px solid #ECECEC;
}
.list-station-box > :first-child,
.list-station-box > :first-child.wire-row,
.list-group-head + .wire-row {
    border-top: none;
}
.list-group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0 2px;
    border-top: 1px solid #ECECEC;
}
/* Клікабельні заголовки груп передмонтажу: велика зона натискання */
.list-group-head[data-anav] {
    min-height: 48px;
    padding: 12px 0;
    margin: 2px 0;
    cursor: pointer;
}
.list-group-head[data-anav] > span:last-child {
    font-size: 20px !important;
    min-width: 44px;
    text-align: center;
    padding: 8px 0;
}
.list-group-head[data-anav]:active {
    background: #eef2ff;
    border-radius: 10px;
}
/* Заголовок групи передмонтажу: назва (клавіатура кількості) + стрілка (згорнути) */
.list-group-head.lg-group {
    min-height: 48px;
    padding: 0;
    margin: 2px 0;
}
.lg-name {
    font-size: 14px;
    font-weight: 800;
    color: #4338ca;
    white-space: nowrap;
    padding: 14px 10px 14px 0;
    cursor: pointer;
    border-radius: 10px;
}
.lg-name:active {
    background: #eef2ff;
}
.lg-name.qty-target {
    outline: 2px solid #4338ca;
    background: #eef2ff;
}
.lg-arrow {
    font-size: 20px;
    font-weight: 800;
    color: #4338ca;
    min-width: 56px;
    text-align: center;
    padding: 14px 0;
    cursor: pointer;
    border-radius: 10px;
}
.lg-arrow:active {
    background: #eef2ff;
}
.list-station-box > .list-group-head:first-child {
    border-top: none;
}
.wire-location {
    font-weight: 600;
    font-size: 14px;
    color: #059669;
    text-align: right;
    white-space: nowrap;
}
#pull-indicator {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    width: 38px;
    height: 38px;
    margin-left: 0;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #4338ca;
    opacity: 0;
    transform: translate(-50%, -30px) scale(0.6);
    pointer-events: none;
    z-index: 50;
}
#pull-indicator.ready {
    background: #eef2ff;
}
#pull-indicator .pull-arrow {
    display: inline-block;
    line-height: 1;
}
/* ==================== КІЛЬКІСТЬ → ОБРАНЕ ==================== */
.mat-pick {
    border: none;
    background: transparent;
    font: inherit;
    color: inherit;
    padding: 4px 6px;
    margin: -4px -6px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    touch-action: manipulation;
}
.mat-pick:active {
    background: #eef2ff;
}
.mat-pick.qty-target {
    outline: 2px solid #4338ca;
    background: #eef2ff;
}
input#input.qty-mode {
    background: #eef2ff;
    border-color: #4338ca;
}
.qty-bar {
    margin-bottom: 10px;
}
.qty-title {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    text-align: center;
    margin-bottom: 8px;
    word-break: break-word;
}
.qty-bar .comment-textarea {
    min-height: 48px;
    margin-bottom: 8px;
}
.qty-actions {
    display: flex;
    gap: 8px;
}
.qty-btn {
    flex: 1;
    border: 1px solid #222;
    background: #fff;
    color: #222;
    font-weight: 700;
    font-size: 14px;
    border-radius: 8px;
    padding: 12px 0;
    touch-action: manipulation;
    user-select: none;
}
.qty-btn:active {
    transform: scale(.97);
}
.qty-btn.qty-comment {
    background: #fff;
    border-color: #222;
    color: #222;
}
.qty-btn.qty-cancel {
    flex: 0 0 52px;
    background: #fff;
    border-color: #dc2626;
    color: #dc2626;
}
.qty-btn.qty-ok {
    background: #f1f5f9;
    border-color: #222;
    color: #222;
}
#pm-qty-title {
    display: none;
}
.pm-presets {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    margin-bottom: 10px;
}
.pm-preset {
    flex: 1 1 0;
    min-width: 0;
