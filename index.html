<script>
const versions = ["<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#ffffff\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<title>Пошук</title>\n<style>\n*, *::before, *::after {\n    box-sizing: border-box;\n    -webkit-tap-highlight-color: transparent;\n    margin: 0;\n    padding: 0;\n}\nhtml, body {\n    width: 100%;\n    height: 100%;\n    overflow: hidden;\n    font-family: -apple-system, Arial, sans-serif;\n    background: #fff;\n    touch-action: none;\n}\n#pages {\n    display: flex;\n    height: 100%;\n    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);\n}\n.page {\n    height: 100%;\n    display: flex;\n    flex-direction: column;\n    overflow: hidden;\n    position: relative;\n    flex-shrink: 0;\n}\n/* ==================== SEARCH PAGE ==================== */\n.search-header {\n    padding: 16px 16px 8px;\n    padding-top: calc(30px + env(safe-area-inset-top));\n    flex-shrink: 0;\n}\n#page-articles .scroll-area {\n    padding-top: calc(30px + env(safe-area-inset-top));\n}\ninput#input {\n    width: 100%;\n    padding: 16px 18px;\n    font-size: 22px;\n    border-radius: 14px;\n    border: 1px solid #e5e7eb;\n    text-align: center;\n    outline: none;\n    background: #f9fafb;\n    color: #111;\n    caret-color: transparent;\n    height: 60px;\n}\n.scroll-area {\n    flex: 1;\n    overflow-y: auto;\n    overflow-x: hidden;\n    padding: 8px 16px 16px;\n    -webkit-overflow-scrolling: touch;\n    overscroll-behavior: contain;\n    touch-action: pan-y;\n}\n/* ==================== КРАПОЧКИ ГЛИБИНИ АРТИКУЛІВ ==================== */\n.articles-dots {\n    position: fixed;\n    bottom: calc(8px + env(safe-area-inset-bottom));\n    left: 0;\n    right: 0;\n    height: 18px;\n    display: none;\n    align-items: center;\n    justify-content: center;\n    gap: 7px;\n    z-index: 30;\n    pointer-events: none;\n}\n.articles-dots .dot {\n    width: 7px;\n    height: 7px;\n    border-radius: 50%;\n    background: #d1d5db;\n    transition: all 0.2s ease;\n}\n.articles-dots .dot.past {\n    background: #9ca3af;\n}\n.articles-dots .dot.active {\n    width: 9px;\n    height: 9px;\n    background: #111827;\n}\n/* ==================== СВАЙП ВНУТРІШНІХ РІВНІВ ==================== */\n.articles-drag-wrapper {\n    display: flex;\n    align-items: flex-start;\n    width: 200%;\n    will-change: transform;\n}\n.articles-drag-pane {\n    width: 50%;\n    flex: 0 0 50%;\n    box-sizing: border-box;\n    min-width: 0;\n    padding: 0;\n}\n#page-articles.articles-swiping .scroll-area {\n    overflow-y: hidden;\n    touch-action: none;\n}\n#page-articles,\n#page-articles * {\n    -webkit-user-select: none;\n    user-select: none;\n    -webkit-touch-callout: none;\n}\n#page-articles table,\n#page-articles td,\n#page-articles th,\n#page-articles .result-card,\n#page-articles .premontage-title {\n    touch-action: pan-y;\n}\n/* ==================== RESULT CARDS ==================== */\n.result-card {\n    background: #ffffff;\n    border-radius: 22px;\n    box-shadow: 0 2px 14px rgba(0,0,0,0.08);\n    padding: 24px;\n    margin-bottom: 16px;\n}\n.result-top {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    gap: 12px;\n    margin-bottom: 20px;\n}\n.result-material-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    color: #111111;\n    font-weight: 700;\n    font-size: 20px;\n    line-height: 1.1;\n    white-space: nowrap;\n}\n.result-material-badge .box-icon {\n    font-size: 0.85em;\n}\n.result-address-new {\n    font-weight: 600;\n    font-size: 14px;\n    color: #059669;\n    white-space: nowrap;\n    text-align: right;\n}\n.article-row {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    gap: 16px;\n    padding: 14px 0;\n    border-top: 1px solid #ECECEC;\n}\n.article-row:first-child {\n    border-top: none;\n    padding-top: 0;\n}\n.article-number {\n    font-size: 15px;\n    font-weight: 700;\n    color: #111111;\n    white-space: nowrap;\n}\n.article-number .art-g1 {\n    margin-right: 3px;\n}\n.article-number .art-g2 {\n    font-size: 1.2em;\n    margin-right: 3px;\n}\n.article-stations {\n    font-size: 20px;\n    font-weight: 800;\n    color: #111111;\n    text-align: right;\n    line-height: 1.3;\n}\n/* ==================== СПИСОК ОЧІКУВАННЯ ==================== */\n.waitlist-title {\n    font-size: 18px;\n    font-weight: 700;\n    color: #111111;\n    text-align: center;\n    padding: 8px 0;\n}\n.select-btn {\n    border: none;\n    background: transparent;\n    font-size: 24px;\n    line-height: 1;\n    cursor: pointer;\n    padding: 2px 4px;\n    color: #d1d5db;\n    flex-shrink: 0;\n}\n.select-btn.selected {\n    color: #FFC400;\n}\n.select-btn:active {\n    transform: scale(.9);\n}\n.article-choice-row {\n    display: flex;\n    align-items: stretch;\n    gap: 8px;\n}\n.article-choice-main {\n    flex: 1;\n    min-width: 0;\n}\n.article-favorite-btn {\n    width: 54px;\n    min-width: 54px;\n    border: 1px solid #e5e7eb;\n    background: #f9fafb;\n    color: #9ca3af;\n    border-radius: 14px;\n    font-size: 22px;\n    font-weight: 700;\n    cursor: pointer;\n}\n.article-favorite-btn.selected {\n    color: #FFC400;\n    background: #fffaf0;\n    border-color: #f3d37a;\n}\n.article-favorite-btn:active {\n    transform: scale(.96);\n}\n.waitlist-actions-row {\n    display: flex;\n    gap: 8px;\n    margin-top: 16px;\n}\n.waitlist-remove-btn {\n    border: none;\n    background: #fff7e0;\n    color: #b45309;\n    font-weight: 700;\n    font-size: 14px;\n    border-radius: 10px;\n    padding: 10px 0;\n    flex: 1;\n    text-align: center;\n    cursor: pointer;\n}\n.waitlist-remove-btn:active {\n    background: #fdeeca;\n}\n.comment-toggle-btn {\n    border: none;\n    background: #eef2ff;\n    color: #4338ca;\n    font-weight: 700;\n    font-size: 14px;\n    border-radius: 10px;\n    padding: 10px 0;\n    flex: 1;\n    text-align: center;\n    cursor: pointer;\n}\n.comment-toggle-btn:active {\n    background: #e0e7ff;\n}\n.comment-edit-area {\n    margin-top: 12px;\n}\n.comment-textarea {\n    width: 100%;\n    border: 1px solid #e5e7eb;\n    border-radius: 10px;\n    padding: 10px 12px;\n    font-size: 14px;\n    font-family: inherit;\n    resize: vertical;\n    min-height: 64px;\n    outline: none;\n    color: #111;\n    background: #f9fafb;\n}\n.comment-save-btn {\n    display: block;\n    margin-top: 8px;\n    border: none;\n    background: #4338ca;\n    color: #fff;\n    font-weight: 700;\n    font-size: 14px;\n    border-radius: 10px;\n    padding: 10px 0;\n    width: 100%;\n    text-align: center;\n    cursor: pointer;\n}\n.comment-save-btn:active {\n    background: #372ea8;\n}\n.waitlist-comment-text {\n    margin-top: 12px;\n    padding: 10px 12px;\n    background: #f3f4f6;\n    border-radius: 10px;\n    font-size: 14px;\n    color: #374151;\n    white-space: pre-wrap;\n    word-break: break-word;\n}\n/* ==================== ПАНЕЛЬ ПЕРЕДМОНТАЖУ ==================== */\n.premontage-toolbar {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    margin-bottom: 14px;\n}\n.premontage-nav-btn {\n    border: none;\n    background: #eef2ff;\n    color: #4338ca;\n    font-weight: 700;\n    font-size: 14px;\n    border-radius: 10px;\n    padding: 10px 14px;\n    cursor: pointer;\n}\n.premontage-nav-btn:active {\n    background: #e0e7ff;\n}\n.premontage-nav-btn.active {\n    background: #4338ca;\n    color: #fff;\n}\n.premontage-close-btn {\n    background: #fff7e0;\n    color: #b45309;\n    margin-left: auto;\n}\n.premontage-close-btn:active {\n    background: #fdeeca;\n}\n.premontage-title {\n    font-size: 16px;\n    font-weight: 700;\n    color: #111;\n    margin-bottom: 14px;\n}\n.level-head {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px;\n}\n.level-head-left {\n    font-size: 20px;\n    font-weight: 800;\n    color: #111;\n}\n.level-head-main {\n    display: inline-flex;\n    align-items: center;\n    gap: 4px;\n}\n.level-head-tail {\n    font-size: 0.7em;\n    font-weight: 700;\n    color: #6b7280;\n    margin-left: 1px;\n}\n.level-head-right {\n    font-size: 20px;\n    font-weight: 800;\n    color: #111;\n    text-align: right;\n}\n.premontage-btn-grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 8px;\n}\n.premontage-item-btn {\n    border: 1px solid #e5e7eb;\n    background: #f9fafb;\n    color: #111;\n    font-weight: 700;\n    font-size: 15px;\n    border-radius: 14px;\n    padding: 12px 8px;\n    text-align: center;\n    cursor: pointer;\n    white-space: normal;\n    word-break: break-word;\n}\n.premontage-item-btn:active {\n    background: #eef2ff;\n}\n.premontage-item-btn.favorite {\n    background: #fffaf0;\n    border-color: #f3d37a;\n}\n.wire-list {\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n}\n.wire-row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 10px;\n    background: #f9fafb;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n    padding: 12px 14px;\n}\n.wire-name {\n    font-weight: 800;\n    font-size: 16px;\n    color: #111;\n    flex-shrink: 0;\n}\n.wire-code {\n    font-size: 13px;\n    color: #6b7280;\n    flex: 1;\n    text-align: center;\n}\n.wire-location {\n    font-weight: 600;\n    font-size: 14px;\n    color: #059669;\n    text-align: right;\n    white-space: nowrap;\n}\n/* ==================== HIGHLIGHT ==================== */\nmark.hl {\n    background: #fde047;\n    color: #111;\n    border-radius: 3px;\n    padding: 0 2px;\n    font-weight: inherit;\n}\n/* ==================== KEYBOARDS ==================== */\n.kb-container {\n    flex-shrink: 0;\n    background: #fff;\n    border-top: 1px solid #e5e7eb;\n    padding: 12px;\n    /* Extra space below 0-key for depth dots */\n    padding-bottom: calc(28px + env(safe-area-inset-bottom));\n}\n.kb-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 10px;\n}\n.hidden {\n    display: none !important;\n}\n.btn {\n    background: #fff;\n    border: 1px solid #222;\n    border-radius: 8px;\n    color: #222;\n    font-size: 18px;\n    font-weight: 600;\n    padding: 15px 0;\n    text-align: center;\n    touch-action: manipulation;\n    user-select: none;\n}\n.btn:active {\n    background: #F7F7F7;\n    transform: scale(.96);\n}\n.btn-special {\n    background: #f1f5f9;\n}\n.btn-version {\n    background: #f1f5f9;\n    color: #9ca3af;\n    font-size: 13px;\n    font-weight: 600;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    user-select: none;\n}\n/* ==================== TABLE PAGES ==================== */\n.table-page {\n    background: #fff;\n}\n.table-header {\n    padding: 16px;\n    padding-top: calc(16px + env(safe-area-inset-top));\n    border-bottom: 1px solid #e5e7eb;\n    flex-shrink: 0;\n    display: flex;\n    justify-content: space-between;\n    align-items: baseline;\n}\n.table-title {\n    font-weight: 700;\n    font-size: 16px;\n    color: #111;\n}\n.table-updated {\n    font-size: 11px;\n    color: #9ca3af;\n}\n.table-scroll {\n    flex: 1;\n    overflow: auto;\n    -webkit-overflow-scrolling: touch;\n}\ntable {\n    border-collapse: collapse;\n    font-size: 13px;\n    min-width: 100%;\n}\nth {\n    background: #f1f5f9;\n    border: 1px solid #e2e8f0;\n    padding: 12px 8px;\n    text-align: left;\n    font-weight: 700;\n    color: #333;\n}\ntd {\n    border: 1px solid #e2e8f0;\n    padding: 8px;\n    white-space: nowrap;\n    color: #444;\n}\ntr:nth-child(even) td {\n    background: #f9fafb;\n}\n</style>\n</head>\n<body>\n<div id=\"pages\">\n    <!-- PAGE (waitlist): свайп управо від пошуку -->\n    <div class=\"page\" id=\"page-waitlist\">\n        <div class=\"search-header\">\n            <div class=\"waitlist-title\">⭐ Обрані матеріали</div>\n        </div>\n        <div class=\"scroll-area\">\n            <div id=\"waitlist-result\"></div>\n        </div>\n    </div>\n    <!-- PAGE (search) -->\n    <div class=\"page\" id=\"page0\">\n        <div class=\"search-header\">\n            <input id=\"input\" readonly>\n        </div>\n        <div class=\"scroll-area\">\n            <div id=\"result\"></div>\n        </div>\n        <div id=\"kb-wrapper\" class=\"kb-container\">\n            <div id=\"kb1\" class=\"kb-grid\">\n                <button class=\"btn\" data-v=\"1\">1</button>\n                <button class=\"btn\" data-v=\"2\">2</button>\n                <button class=\"btn\" data-v=\"3\">3</button>\n                <button class=\"btn\" data-v=\"4\">4</button>\n                <button class=\"btn\" data-v=\"5\">5</button>\n                <button class=\"btn\" data-v=\"6\">6</button>\n                <button class=\"btn\" data-v=\"7\">7</button>\n                <button class=\"btn\" data-v=\"8\">8</button>\n                <button class=\"btn\" data-v=\"9\">9</button>\n                <div class=\"btn btn-version\" id=\"kb-version\"></div>\n                <button class=\"btn\" data-v=\"0\">0</button>\n                <button class=\"btn btn-special\" data-del=\"all\">⌫</button>\n            </div>\n        </div>\n    </div>\n    <!-- PAGE (артикули): свайп ліворуч від пошуку -->\n    <div class=\"page\" id=\"page-articles\">\n        <div class=\"scroll-area\">\n            <div id=\"articles-page-content\"></div>\n        </div>\n    </div>\n</div>\n<!-- КРАПОЧКИ ГЛИБИНИ (глобально: пошук + артикули) -->\n<div class=\"articles-dots\" id=\"articles-dots\"></div>\n<script>\n/* ==================== ДЖЕРЕЛО ДАНИХ ==================== */\n/* ==================== ВЕРСІЯ КОДУ ==================== */\nconst CODE_VERSION = 44;\nconst SPREADSHEET_ID = \"1ii4oiQvbayKKN1tffS4X7WxH0NPZ0oiooaHPP6Ku6W8\";\nconst SEARCH_GID = \"1679964111\";\n/* ================================================================ */\n/* Кеші для швидкодії */\nconst _expandCache = new Map();\nlet _actionsCache = {};\nlet _fullCodeMap = null;\nlet TOTAL_PAGES = 3;\nconst SEARCH_PAGE_INDEX = 1;\nconst ARTICLES_PAGE_INDEX = 2;\nlet currentPage = SEARCH_PAGE_INDEX;\nlet searchData = [];\nlet pageWidthPercent = 100 / TOTAL_PAGES;\nlet articleGroups = [];\n/* ==================== СТЕК РІВНІВ АРТИКУЛІВ ==================== */\nlet articlesPageStack = [\n    { level: 'articles' }\n];\nconst ARTICLE_ACTION_KEYS = [\n    \"розміщення\",\n    \"sp\",\n    \"ts\",\n    \"ізострічка\",\n    \"мм\",\n    \"передмонтаж\",\n    \"проводи\"\n];\nconst ACTION_LABELS = {\n    \"розміщення\": \"📍 Розміщення\",\n    \"sp\": \"🔩 SP\",\n    \"ts\": \"🧷 TS\",\n    \"ізострічка\": \"📏 Ізострічка\",\n    \"мм\": \"📐 ММ\",\n    \"передмонтаж\": \"🧵 Передмонтаж\",\n    \"проводи\": \"⚡ Проводи\"\n};\nfunction actionLabel(key) {\n    return ACTION_LABELS[key] || escapeHtml(key);\n}\n/* ==================== ELEMENTS ==================== */\nconst input = document.getElementById('input');\nconst resultBox = document.getElementById('result');\nconst waitlistBox = document.getElementById('waitlist-result');\nconst kbWrapper = document.getElementById('kb-wrapper');\nconst pagesEl = document.getElementById('pages');\nconst articlesPageContent =\n    document.getElementById('articles-page-content');\nconst articlesDots =\n    document.getElementById('articles-dots');\nconst CACHE_KEY_SEARCH = \"searchDataCSV\";\nconst CACHE_KEY_SEARCH_TIME = \"searchDataCSVTime\";\n/* ==================== КРАПОЧКИ ГЛИБИНИ ==================== */\nfunction renderArticlesDots(overridePage, overrideDepth) {\n    if (!articlesDots) return;\n    /*\n        overridePage / overrideDepth дозволяють показати крапочки\n        \"наперед\" — просто щоб ПІД ЧАС самого свайпу (ще до того, як\n        currentPage чи articlesPageStack реально зміняться) крапочки\n        вже відображали стан, в який ми прямуємо. Так вони йдуть\n        синхронно з переходом, а не з запізненням після нього.\n    */\n    const page =\n        overridePage !== undefined\n            ? overridePage\n            : currentPage;\n    /*\n        Крапочки показуємо на сторінках \"Пошук\" і \"Артикули\".\n        На \"Обрані матеріали\" їх немає.\n    */\n    if (\n        page !== ARTICLES_PAGE_INDEX &&\n        page !== SEARCH_PAGE_INDEX\n    ) {\n        articlesDots.style.display = 'none';\n        articlesDots.innerHTML = '';\n        return;\n    }\n    /*\n        Кількість крапочок = кількість рівнів у стеку.\n        1:\n        Артикули\n        2:\n        Артикули → Артикул\n        3:\n        Артикули → Артикул → Дія\n        4:\n        Артикули → Артикул → Передмонтаж → Категорія\n        і т.д.\n    */\n    /*\n        Пошук завжди 1-а крапочка (перша сторінка).\n        Панель артикулів = 2-а крапочка, кожен рівень углиб додає ще одну.\n        Тому на сторінці артикулів: глибина стеку + 1.\n    */\n    let depth;\n    if (page === SEARCH_PAGE_INDEX) {\n        depth = 1;\n    } else {\n        depth =\n            (\n                overrideDepth !== undefined\n                    ? overrideDepth\n                    : articlesPageStack.length\n            ) + 1;\n    }\n    if (depth <= 0) {\n        articlesDots.style.display = 'none';\n        articlesDots.innerHTML = '';\n        return;\n    }\n    articlesDots.style.display = 'flex';\n    let html = '';\n    for (let i = 0; i < depth; i++) {\n        let className = 'dot';\n        /*\n            Остання крапочка = поточний рівень.\n        */\n        if (i === depth - 1) {\n            className += ' active';\n        } else {\n            className += ' past';\n        }\n        html += `<span class=\"${className}\"></span>`;\n    }\n    articlesDots.innerHTML = html;\n}\n/* ==================== РОЗМІР СТОРІНОК ==================== */\nconst kbVersionEl = document.getElementById('kb-version');\nif (kbVersionEl) {\n    kbVersionEl.textContent = 'v' + CODE_VERSION;\n}\ndocument.querySelectorAll('.page').forEach(p => {\n    p.style.width = pageWidthPercent + '%';\n});\npagesEl.style.width = (TOTAL_PAGES * 100) + '%';\npagesEl.style.transform =\n    `translateX(-${currentPage * pageWidthPercent}%)`;\n/* ==================== АРТИКУЛИ ==================== */\nfunction normalizeArticlePart(part) {\n    return String(part || \"\")\n        .trim()\n        .replace(/\\s+/g, \"\");\n}\nfunction getArticleBase(code) {\n    if (/^\\d{7}/.test(code) && code.length > 7) {\n        return code.slice(0, 7);\n    }\n    return code;\n}\nfunction expandArticleValue(raw) {\n    const k = String(raw || \"\");\n    let r = _expandCache.get(k);\n    if (r === undefined) {\n        r = expandArticleValueRaw(k);\n        _expandCache.set(k, r);\n    }\n    return r;\n}\nfunction expandArticleValueRaw(raw) {\n    raw = String(raw || \"\").trim();\n    if (!raw) return [];\n    const parts = raw\n        .split(\"/\")\n        .map(normalizeArticlePart)\n        .filter(Boolean);\n    if (!parts.length) return [];\n    if (parts.length === 1) {\n        return [getArticleBase(parts[0])];\n    }\n    const first = getArticleBase(parts[0]);\n    const result = [first];\n    let prefix = \"\";\n    if (/^\\d+$/.test(first) && first.length >= 3) {\n        prefix = first.slice(0, -3);\n    }\n    for (let i = 1; i < parts.length; i++) {\n        const part = parts[i];\n        if (/^\\d{1,3}$/.test(part) && prefix) {\n            result.push(\n                prefix + part.padStart(3, \"0\")\n            );\n        } else {\n            result.push(\n                getArticleBase(part)\n            );\n        }\n    }\n    return [...new Set(result)];\n}\n/* ==================== ГРУПУВАННЯ ==================== */\nfunction computeArticleGroups() {\n    const groups = {};\n    searchData.forEach(row => {\n        const articles =\n            expandArticleValue(row.article);\n        articles.forEach(article => {\n            if (!article) return;\n            if (!groups[article]) {\n                groups[article] = [];\n            }\n            groups[article].push(row);\n        });\n    });\n    Object.keys(groups).forEach(article => {\n        const seen = new Set();\n        groups[article] =\n            groups[article].filter(row => {\n                const key = [\n                    row.station,\n                    row.material,\n                    row.article,\n                    row.colD,\n                    row.address\n                ].join(\"|||\");\n                if (seen.has(key)) {\n                    return false;\n                }\n                seen.add(key);\n                return true;\n            });\n    });\n    const keys =\n        Object.keys(groups).sort((a, b) =>\n            a.localeCompare(\n                b,\n                \"uk\",\n                {\n                    numeric: true,\n                    sensitivity: \"base\"\n                }\n            )\n        );\n    return keys.map(article => ({\n        article,\n        rows: groups[article]\n    }));\n}\n/* ==================== ОБРАНІ АРТИКУЛИ ==================== */\nconst CACHE_KEY_ARTICLE_FAVORITES =\n    \"articleFavorites\";\nfunction loadArticleFavorites() {\n    try {\n        const value =\n            JSON.parse(\n                localStorage.getItem(\n                    CACHE_KEY_ARTICLE_FAVORITES\n                ) || \"[]\"\n            );\n        return Array.isArray(value)\n            ? value.map(String)\n            : [];\n    } catch (e) {\n        return [];\n    }\n}\nfunction saveArticleFavorites(list) {\n    localStorage.setItem(\n        CACHE_KEY_ARTICLE_FAVORITES,\n        JSON.stringify(\n            [...new Set(list.map(String))]\n        )\n    );\n}\nfunction isArticleFavorite(article) {\n    return loadArticleFavorites()\n        .includes(String(article));\n}\nfunction toggleArticleFavorite(article) {\n    const art = String(article || \"\");\n    if (!art) return false;\n    const list = loadArticleFavorites();\n    const idx = list.indexOf(art);\n    if (idx >= 0) {\n        list.splice(idx, 1);\n        saveArticleFavorites(list);\n        return false;\n    }\n    list.push(art);\n    saveArticleFavorites(list);\n    return true;\n}\nfunction sortArticlesWithFavorites(articles) {\n    const favorites =\n        new Set(loadArticleFavorites());\n    return [...articles].sort((a, b) => {\n        const aFav =\n            favorites.has(String(a));\n        const bFav =\n            favorites.has(String(b));\n        if (aFav !== bFav) {\n            return aFav ? -1 : 1;\n        }\n        return String(a).localeCompare(\n            String(b),\n            \"uk\",\n            {\n                numeric: true,\n                sensitivity: \"base\"\n            }\n        );\n    });\n}\nfunction refreshArticleGroups() {\n    articleGroups =\n        computeArticleGroups();\n    articlesPageStack.forEach(s => {\n        delete s.cachedHtml;\n    });\n    renderArticlesPage(true);\n}\n/* ==================== КЛАВІАТУРА ==================== */\ndocument\n    .getElementById('kb-wrapper')\n    .addEventListener('click', (e) => {\n        const btn =\n            e.target.closest('.btn');\n        if (!btn) return;\n        e.stopPropagation();\n        if (btn.dataset.del) {\n            input.value = \"\";\n        } else if (\n            btn.dataset.v !== undefined\n        ) {\n            input.value += btn.dataset.v;\n        }\n        search();\n    });\n/* ==================== CSV ==================== */\nfunction parseSearchCSV(t) {\n    _actionsCache = {};\n    _fullCodeMap = null;\n    searchData =\n        t.trim().split(\"\\n\").map(r => {\n            const c = r.split(\",\");\n            return {\n                station: c[0] || \"\",\n                material: c[1] || \"\",\n                article: c[2] || \"\",\n                colD: c[3] || \"\",\n                address: c[4] || \"\"\n            };\n        });\n}\n/* ==================== CACHE ==================== */\nconst cachedSearch =\n    localStorage.getItem(CACHE_KEY_SEARCH);\nif (cachedSearch) {\n    parseSearchCSV(cachedSearch);\n    if (input.value) {\n        search();\n    }\n}\nrefreshArticleGroups();\n/* ==================== СВІЖІ ДАНІ ==================== */\nfunction fetchSearchData() {\n    const url1 =\n        `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${SEARCH_GID}&t=` +\n        Date.now();\n    fetch(url1)\n        .then(r => r.text())\n        .then(t => {\n            const previous =\n                localStorage.getItem(\n                    CACHE_KEY_SEARCH\n                );\n            if (previous === t) {\n                /* Дані не змінились — нічого не перебудовуємо */\n                localStorage.setItem(\n                    CACHE_KEY_SEARCH_TIME,\n                    Date.now().toString()\n                );\n                return;\n            }\n            localStorage.setItem(\n                CACHE_KEY_SEARCH,\n                t\n            );\n            localStorage.setItem(\n                CACHE_KEY_SEARCH_TIME,\n                Date.now().toString()\n            );\n            parseSearchCSV(t);\n            refreshArticleGroups();\n            if (input.value) {\n                search();\n            }\n        })\n        .catch(() => {});\n}\nfetchSearchData();\n/* ==================== HTML ESCAPE ==================== */\nfunction escapeHtml(str) {\n    return String(str)\n        .replace(/&/g, \"&amp;\")\n        .replace(/</g, \"&lt;\")\n        .replace(/>/g, \"&gt;\");\n}\nfunction highlight(text, v, fromEnd) {\n    const safe = escapeHtml(text);\n    if (!v) return safe;\n    const lower =\n        text.toLowerCase();\n    if (fromEnd) {\n        if (!lower.endsWith(v)) {\n            return safe;\n        }\n        const idx =\n            text.length - v.length;\n        return escapeHtml(\n            text.slice(0, idx)\n        )\n        +\n        '<mark class=\"hl\">' +\n        escapeHtml(text.slice(idx)) +\n        '</mark>';\n    } else {\n        if (!lower.startsWith(v)) {\n            return safe;\n        }\n        return '<mark class=\"hl\">' +\n            escapeHtml(text.slice(0, v.length)) +\n            '</mark>' +\n            escapeHtml(text.slice(v.length));\n    }\n}\n/* ==================== СТАНЦІЇ ==================== */\nconst STATIONS_PER_LINE = 5;\nfunction buildStationsHtml(stationHtmlArr) {\n    const lines = [];\n    for (\n        let i = 0;\n        i < stationHtmlArr.length;\n        i += STATIONS_PER_LINE\n    ) {\n        lines.push(\n            stationHtmlArr\n                .slice(i, i + STATIONS_PER_LINE)\n                .join(\" | \")\n        );\n    }\n    return lines.join(\"<br>\");\n}\n/* ==================== НОМЕР АРТИКУЛУ ==================== */\nfunction renderArticleNumber(\n    art,\n    v,\n    isNumOnly,\n    isSpecialSearch\n) {\n    let matchStart = -1;\n    let matchEnd = -1;\n    if (!isSpecialSearch && v) {\n        const lower =\n            art.toLowerCase();\n        if (isNumOnly) {\n            if (lower.endsWith(v)) {\n                matchStart =\n                    art.length - v.length;\n                matchEnd =\n                    art.length;\n            }\n        } else {\n            if (lower.startsWith(v)) {\n                matchStart = 0;\n                matchEnd = v.length;\n            }\n        }\n    }\n    function part(s, e) {\n        const str = art.slice(s, e);\n        if (matchStart === -1) {\n            return escapeHtml(str);\n        }\n        const overlapStart =\n            Math.max(s, matchStart);\n        const overlapEnd =\n            Math.min(e, matchEnd);\n        if (overlapStart >= overlapEnd) {\n            return escapeHtml(str);\n        }\n        let out = '';\n        if (overlapStart > s) {\n            out += escapeHtml(\n                art.slice(s, overlapStart)\n            );\n        }\n        out +=\n            '<mark class=\"hl\">' +\n            escapeHtml(\n                art.slice(\n                    overlapStart,\n                    overlapEnd\n                )\n            ) +\n            '</mark>';\n        if (overlapEnd < e) {\n            out += escapeHtml(\n                art.slice(overlapEnd, e)\n            );\n        }\n        return out;\n    }\n    const len = art.length;\n    if (len <= 4) {\n        return `<span class=\"art-g1\">${part(0, len)}</span>`;\n    }\n    const g1end =\n        Math.min(4, len);\n    const g2end =\n        Math.min(7, len);\n    let html =\n        `<span class=\"art-g1\">${part(0, g1end)}</span>`;\n    if (len > 4) {\n        html +=\n            `<span class=\"art-g2\">${part(g1end, g2end)}</span>`;\n    }\n    if (len > 7) {\n        html +=\n            `<span class=\"art-g3\">${part(g2end, len)}</span>`;\n    }\n    return html;\n}\n/* ==================== СПИСОК ОЧІКУВАННЯ ==================== */\nconst CACHE_KEY_WAITLIST =\n    \"materialWaitlist\";\nfunction loadWaitlist() {\n    try {\n        return JSON.parse(\n            localStorage.getItem(\n                CACHE_KEY_WAITLIST\n            ) || \"[]\"\n        );\n    } catch (e) {\n        return [];\n    }\n}\nfunction saveWaitlist(list) {\n    localStorage.setItem(\n        CACHE_KEY_WAITLIST,\n        JSON.stringify(list)\n    );\n}\nfunction isInWaitlist(key) {\n    return loadWaitlist()\n        .some(item => item.key === key);\n}\nfunction toggleWaitlistItem(\n    key,\n    material,\n    address,\n    articlesPlain\n) {\n    const list = loadWaitlist();\n    const idx =\n        list.findIndex(\n            item => item.key === key\n        );\n    if (idx >= 0) {\n        list.splice(idx, 1);\n    } else {\n        list.push({\n            key,\n            material,\n            address,\n            articles: articlesPlain,\n            comment: \"\"\n        });\n    }\n    saveWaitlist(list);\n    return idx < 0;\n}\nfunction toSearchAttr(material) {\n    return `data-anav=\"to-search\" data-material=\"${encodeURIComponent(material)}\"`;\n}\nfunction setWaitlistComment(key, text) {\n    const list = loadWaitlist();\n    const idx =\n        list.findIndex(\n            item => item.key === key\n        );\n    if (idx >= 0) {\n        list[idx].comment = text;\n        saveWaitlist(list);\n    }\n}\nlet waitlistCardKeys = [];\nfunction renderWaitlistPage() {\n    const list = loadWaitlist();\n    if (!list.length) {\n        waitlistBox.innerHTML =\n            '<div style=\"text-align:center; padding:40px; color:#aaa;\">Список порожній</div>';\n        waitlistCardKeys = [];\n        return;\n    }\n    waitlistCardKeys = [];\n    let html = \"\";\n    list.forEach(item => {\n        const idx =\n            waitlistCardKeys.push(item.key) - 1;\n        const hasComment =\n            !!(\n                item.comment &&\n                item.comment.trim()\n            );\n        html += `\n            <div class=\"result-card\">\n                <div class=\"result-top\">\n                    <span class=\"result-material-badge\">\n                        <span class=\"box-icon\">📦</span>\n                        ${escapeHtml(item.material)}\n                    </span>\n                    <div style=\"display:flex; align-items:center; gap:8px;\">\n                        <span class=\"result-address-new\">\n                            ${escapeHtml(item.address)}\n                        </span>\n                    </div>\n                </div>\n        `;\n        for (let art in item.articles) {\n            const stationHtmlArr =\n                uniqueDisplayStations(\n                    item.articles[art]\n                )\n                    .map(st => escapeHtml(st));\n            const stationsHtml =\n                buildStationsHtml(\n                    stationHtmlArr\n                );\n            html += `\n                <div class=\"article-row\">\n                    <span class=\"article-number\">\n                        ${renderArticleNumber(\n                            art,\n                            \"\",\n                            false,\n                            true\n                        )}\n                    </span>\n                    <span class=\"article-stations\">\n                        ${stationsHtml}\n                    </span>\n                </div>\n            `;\n        }\n        html += `\n            <div class=\"waitlist-actions-row\">\n                <button\n                    class=\"waitlist-remove-btn\"\n                    data-idx=\"${idx}\">\n                    ★ Прибрати зі списку\n                </button>\n                <button\n                    class=\"comment-toggle-btn\"\n                    data-idx=\"${idx}\">\n                    ${hasComment ? '✎ Коментар' : '💬 Коментар'}\n                </button>\n            </div>\n            <div\n                class=\"comment-edit-area hidden\"\n                data-idx=\"${idx}\">\n                <textarea\n                    class=\"comment-textarea\"\n                    data-idx=\"${idx}\"\n                    placeholder=\"Ваш коментар...\">${escapeHtml(item.comment || \"\")}</textarea>\n                <button\n                    class=\"comment-save-btn\"\n                    data-idx=\"${idx}\">\n                    Зберегти\n                </button>\n            </div>\n        `;\n        if (hasComment) {\n            html += `\n                <div\n                    class=\"waitlist-comment-text\"\n                    data-idx=\"${idx}\">\n                    ${escapeHtml(item.comment)}\n                </div>\n            `;\n        }\n        html += `</div>`;\n    });\n    waitlistBox.innerHTML = html;\n}\nwaitlistBox.addEventListener('click', (e) => {\n    const removeBtn =\n        e.target.closest(\n            '.waitlist-remove-btn'\n        );\n    if (removeBtn) {\n        const key =\n            waitlistCardKeys[\n                parseInt(\n                    removeBtn.dataset.idx,\n                    10\n                )\n            ];\n        if (key === undefined) return;\n        const list =\n            loadWaitlist()\n                .filter(\n                    item => item.key !== key\n                );\n        saveWaitlist(list);\n        renderWaitlistPage();\n        return;\n    }\n    const toggleBtn =\n        e.target.closest(\n            '.comment-toggle-btn'\n        );\n    if (toggleBtn) {\n        const idx =\n            toggleBtn.dataset.idx;\n        const area =\n            waitlistBox.querySelector(\n                `.comment-edit-area[data-idx=\"${idx}\"]`\n            );\n        if (area) {\n            area.classList.toggle(\n                'hidden'\n            );\n            if (\n                !area.classList.contains(\n                    'hidden'\n                )\n            ) {\n                const ta =\n                    area.querySelector(\n                        '.comment-textarea'\n                    );\n                if (ta) ta.focus();\n            }\n        }\n        return;\n    }\n    const saveBtn =\n        e.target.closest(\n            '.comment-save-btn'\n        );\n    if (saveBtn) {\n        const idx =\n            parseInt(\n                saveBtn.dataset.idx,\n                10\n            );\n        const key =\n            waitlistCardKeys[idx];\n        if (key === undefined) return;\n        const textarea =\n            waitlistBox.querySelector(\n                `.comment-textarea[data-idx=\"${idx}\"]`\n            );\n        const text =\n            textarea\n                ? textarea.value\n                : \"\";\n        setWaitlistComment(\n            key,\n            text\n        );\n        renderWaitlistPage();\n        return;\n    }\n});\n/* ==================== ПОШУКОВІ ЗІРОЧКИ ==================== */\nlet searchCardKeys = [];\nlet searchResultLookup = {};\nresultBox.addEventListener('click', (e) => {\n    const btn =\n        e.target.closest('.select-btn');\n    if (!btn) return;\n    const key =\n        searchCardKeys[\n            parseInt(\n                btn.dataset.idx,\n                10\n            )\n        ];\n    if (key === undefined) return;\n    const data =\n        searchResultLookup[key];\n    if (!data) return;\n    const nowSelected =\n        toggleWaitlistItem(\n            key,\n            data.material,\n            data.address,\n            data.articles\n        );\n    btn.classList.toggle(\n        'selected',\n        nowSelected\n    );\n    btn.textContent =\n        nowSelected ? '★' : '☆';\n});\n/* ==================== MERGE ARTICLE ==================== */\nfunction mergeAbbreviatedArticles(articleMap) {\n    const arts =\n        Object.keys(articleMap);\n    const fullArts =\n        arts.filter(\n            a => a.length > 3\n        );\n    const shortArts =\n        arts.filter(\n            a => a.length <= 3\n        );\n    if (!shortArts.length) {\n        return articleMap;\n    }\n    const fullByLast3 = {};\n    fullArts.forEach(a => {\n        const last3 =\n            a.slice(-3);\n        if (!fullByLast3[last3]) {\n            fullByLast3[last3] = a;\n        }\n    });\n    const merged = {};\n    fullArts.forEach(a => {\n        merged[a] =\n            new Set(articleMap[a]);\n    });\n    shortArts.forEach(shortArt => {\n        const target =\n            fullByLast3[shortArt];\n        if (target) {\n            articleMap[shortArt]\n                .forEach(st =>\n                    merged[target].add(st)\n                );\n        } else {\n            if (!merged[shortArt]) {\n                merged[shortArt] =\n                    new Set();\n            }\n            articleMap[shortArt]\n                .forEach(st =>\n                    merged[shortArt].add(st)\n                );\n        }\n    });\n    return merged;\n}\n/* ==================== ПЕРЕДМОНТАЖ ==================== */\nfunction isPremontageName(value) {\n    const raw =\n        String(value || \"\").trim();\n    if (!raw) return false;\n    /*\n        Назва передмонтажу: починається з літери, може містити\n        цифри, _ - * і далі через пробіл ще частини\n        (наприклад \"KNDS 15825134\", \"lds1 15812345\").\n    */\n    return /^[A-Za-zА-Яа-яІіЇїЄєҐґ][A-Za-zА-Яа-яІіЇїЄєҐґ0-9_*-]*(?:\\s+[A-Za-zА-Яа-яІіЇїЄєҐґ0-9_*-]+)*$/\n        .test(raw);\n}\nfunction getPremontageRows() {\n    return searchData.filter(\n        row =>\n            isPremontageName(row.station) &&\n            row.article\n    );\n}\nfunction premontageArticleMatches(\n    row,\n    article\n) {\n    if (!row || !article) {\n        return false;\n    }\n    return expandArticleValue(\n        row.article\n    ).includes(\n        String(article).trim()\n    );\n}\nfunction computePremontageCategoriesForArticle(\n    article\n) {\n    const categories = new Set();\n    getPremontageRows().forEach(row => {\n        if (\n            !premontageArticleMatches(\n                row,\n                article\n            )\n        ) return;\n        const name =\n            String(\n                row.station || \"\"\n            ).trim();\n        if (name) {\n            categories.add(name);\n        }\n    });\n    return [...categories].sort(\n        (a, b) =>\n            a.localeCompare(\n                b,\n                'uk',\n                {\n                    numeric: true,\n                    sensitivity: 'base'\n                }\n            )\n    );\n}\nfunction computeWiresForCategory(\n    article,\n    category\n) {\n    const wantedCategory =\n        String(\n            category || \"\"\n        ).trim()\n        .toLowerCase();\n    return getPremontageRows()\n        .filter(row =>\n            premontageArticleMatches(\n                row,\n                article\n            ) &&\n            String(\n                row.station || \"\"\n            ).trim().toLowerCase()\n            === wantedCategory\n        )\n        .sort((a, b) =>\n            String(a.material || \"\")\n                .localeCompare(\n                    String(b.material || \"\"),\n                    'uk',\n                    {\n                        numeric: true,\n                        sensitivity: 'base'\n                    }\n                )\n        );\n}\n/* ==================== ACTION RESULTS ==================== */\n/* Адреса зони \"А 5\" (А / A, потім 5 або 05): \"A 05 05 06\" */\nfunction isIsotapeAddress(address) {\n    return /^[AА]\\s*0?5(?:\\s|$)/i.test(\n        String(address || \"\").trim()\n    );\n}\n/* У примітці є слово \"стр\" (на початку слова): СТР, стр 3, ... */\nfunction hasStrNote(note) {\n    return /(^|[^\\p{L}])стр/iu.test(\n        String(note || \"\")\n    );\n}\nfunction computeArticleActionResults(\n    article,\n    key\n) {\n    const v =\n        String(key || \"\")\n            .toLowerCase();\n    if (v === 'ізострічка') {\n        return searchData.filter(x =>\n            expandArticleValue(\n                x.article\n            ).includes(article) &&\n            (\n                isIsotapeAddress(x.address) ||\n                hasStrNote(x.colD)\n            )\n        );\n    }\n    return searchData.filter(x => {\n        if (\n            !expandArticleValue(\n                x.article\n            ).includes(article)\n        ) {\n            return false;\n        }\n        return x.colD\n            .toLowerCase()\n            .startsWith(v);\n    });\n}\n/* ==================== ПРОВОДИ ==================== */\nfunction isWireMaterial(material) {\n    return /^15[237]/.test(\n        String(material || \"\").trim()\n    );\n}\nfunction getWireRowsForArticle(article) {\n    return searchData.filter(row => {\n        if (\n            !expandArticleValue(\n                row.article\n            ).includes(\n                String(article).trim()\n            )\n        ) {\n            return false;\n        }\n        if (\n            isPremontageName(\n                row.station\n            )\n        ) {\n            return false;\n        }\n        if (\n            String(\n                row.colD || \"\"\n            ).trim()\n        ) {\n            return false;\n        }\n        return isWireMaterial(\n            row.material\n        );\n    });\n}\nfunction computeWireStationsForArticle(\n    article\n) {\n    const stations = new Set();\n    getWireRowsForArticle(article)\n        .forEach(row => {\n            const st =\n                String(\n                    row.station || \"\"\n                ).trim();\n            if (st) {\n                stations.add(st);\n            }\n        });\n    return [...stations].sort(\n        (a, b) =>\n            a.localeCompare(\n                b,\n                'uk',\n                {\n                    numeric: true,\n                    sensitivity: 'base'\n                }\n            )\n    );\n}\nfunction computeWiresForStation(\n    article,\n    station\n) {\n    const wanted =\n        String(\n            station || \"\"\n        ).trim()\n        .toLowerCase();\n    return getWireRowsForArticle(article)\n        .filter(row =>\n            String(\n                row.station || \"\"\n            ).trim().toLowerCase()\n            === wanted\n        )\n        .sort((a, b) =>\n            String(a.material || \"\")\n                .localeCompare(\n                    String(b.material || \"\"),\n                    'uk',\n                    {\n                        numeric: true,\n                        sensitivity: 'base'\n                    }\n                )\n        );\n}\n/* ==================== ВСІ МАТЕРІАЛИ ==================== */\nfunction getAllMaterialsForArticle(article) {\n    return searchData.filter(row =>\n        expandArticleValue(\n            row.article\n        ).includes(\n            String(article).trim()\n        )\n    );\n}\n/* ==================== СПІЛЬНІ МАТЕРІАЛИ ==================== */\nfunction buildMaterialArticleMap() {\n    const map = {};\n    searchData.forEach(row => {\n        const mat =\n            String(row.material || \"\").trim();\n        if (!mat) return;\n        if (!map[mat]) {\n            map[mat] = new Set();\n        }\n        expandArticleValue(row.article)\n            .forEach(a => map[mat].add(a));\n    });\n    return map;\n}\nfunction getOtherArticles(\n    map,\n    material,\n    article\n) {\n    const set =\n        map[String(material || \"\").trim()];\n    if (!set) return [];\n    const current =\n        String(article || \"\").trim();\n    return [...set]\n        .filter(a => a !== current)\n        .sort((a, b) =>\n            a.localeCompare(\n                b,\n                'uk',\n                {\n                    numeric: true,\n                    sensitivity: 'base'\n                }\n            )\n        );\n}\n/* ==================== ДІЇ ==================== */\nfunction articleHasAction(\n    article,\n    action\n) {\n    if (action === 'розміщення') {\n        return getAllMaterialsForArticle(\n            article\n        ).length > 0;\n    }\n    if (action === 'передмонтаж') {\n        return computePremontageCategoriesForArticle(\n            article\n        ).length > 0;\n    }\n    if (action === 'проводи') {\n        return computeWireStationsForArticle(\n            article\n        ).length > 0;\n    }\n    return computeArticleActionResults(\n        article,\n        action\n    ).length > 0;\n}\nfunction getAvailableActionsForArticle(\n    article\n) {\n    const cacheKey = String(article);\n    if (_actionsCache[cacheKey]) {\n        return _actionsCache[cacheKey];\n    }\n    const result =\n        ARTICLE_ACTION_KEYS.filter(\n            k => articleHasAction(\n                article,\n                k\n            )\n        );\n    _actionsCache[cacheKey] = result;\n    return result;\n}\n/* ==================== НАЗАД ==================== */\nfunction popArticlesPageLevel() {\n    if (\n        articlesPageStack.length > 1\n    ) {\n        articlesPageStack.pop();\n        renderArticlesPage();\n    }\n}\n/* ==================== ПОБУДОВА СТОРІНКИ ==================== */\nfunction buildArticlesLevelHtml(\n    stateIndex\n) {\n    const state =\n        articlesPageStack[stateIndex];\n    if (!state) return '';\n    let html = '';\n    /* ---------- АРТИКУЛИ ---------- */\n    if (state.level === 'articles') {\n        html +=\n            '<div class=\"premontage-title\"></div>';\n        const articles =\n            sortArticlesWithFavorites(\n                articleGroups.map(\n                    g => g.article\n                )\n            );\n        if (!articles.length) {\n            html +=\n                '<div style=\"text-align:center; padding:40px; color:#aaa;\">Немає даних</div>';\n        } else {\n            html +=\n                '<div class=\"premontage-btn-grid\">';\n            articles.forEach(a => {\n                const favorite =\n                    isArticleFavorite(a);\n                html += `\n                    <button\n                        class=\"premontage-item-btn${favorite ? ' favorite' : ''}\"\n                        data-anav=\"article\"\n                        data-article=\"${escapeHtml(a)}\">\n                        ${renderArticleNumber(\n                            a,\n                            \"\",\n                            false,\n                            true\n                        )}\n                    </button>\n                `;\n            });\n            html +=\n                '</div>';\n        }\n    /* ---------- ДІЇ ---------- */\n    } else if (state.level === 'actions') {\n        html += buildLevelHeadHtml(\n            state.article,\n            ''\n        );\n        const available =\n            getAvailableActionsForArticle(\n                state.article\n            );\n        if (!available.length) {\n            html +=\n                '<div style=\"text-align:center; padding:40px; color:#aaa;\">Немає даних для цього артикулу</div>';\n        } else {\n            html +=\n                '<div class=\"premontage-btn-grid\">';\n            available.forEach(k => {\n                html += `\n                    <button\n                        class=\"premontage-item-btn\"\n                        data-anav=\"action\"\n                        data-action=\"${escapeHtml(k)}\">\n                        ${actionLabel(k)}\n                    </button>\n                `;\n            });\n            html +=\n                '</div>';\n        }\n    /* ---------- РЕЗУЛЬТАТИ ---------- */\n    } else if (state.level === 'results') {\n        const rows =\n            state.action === 'розміщення'\n                ? getAllMaterialsForArticle(\n                    state.article\n                )\n                : computeArticleActionResults(\n                    state.article,\n                    state.action\n                );\n        html +=\n            '<div class=\"premontage-title\"></div>';\n        if (!rows.length) {\n            html +=\n                '<div style=\"text-align:center; padding:40px; color:#aaa;\">Не знайдено</div>';\n        } else if (\n            state.action === 'розміщення'\n        ) {\n            /*\n                Спільні матеріали (152 / 153 / 157): в яких ще\n                артикулах вони використовуються.\n            */\n            const matArticleMap =\n                buildMaterialArticleMap();\n            /*\n                Кількість = у скількох станціях матеріал\n                зустрічається на цьому артикулі.\n            */\n            const qtySets = {};\n            rows.forEach(r => {\n                const m =\n                    String(r.material || \"\").trim();\n                if (!qtySets[m]) {\n                    qtySets[m] = new Set();\n                }\n                qtySets[m].add(\n                    String(r.station || \"\").trim()\n                );\n            });\n            const qtyOf = (r) => {\n                const set =\n                    qtySets[\n                        String(r.material || \"\").trim()\n                    ];\n                return set ? set.size : 0;\n            };\n            let placementRows = [...rows];\n            if (state.shared) {\n                placementRows =\n                    placementRows.filter(r =>\n                        isWireMaterial(r.material) &&\n                        getOtherArticles(\n                            matArticleMap,\n                            r.material,\n                            state.article\n                        ).length > 0\n                    );\n            }\n            const sorted =\n                placementRows.sort((a, b) => {\n                    if (state.sortQty) {\n                        const byQty =\n                            qtyOf(b) - qtyOf(a);\n                        if (byQty !== 0) {\n                            return byQty;\n                        }\n                        const byMat =\n                            String(a.material || \"\")\n                                .localeCompare(\n                                    String(b.material || \"\"),\n                                    'uk',\n                                    {\n                                        numeric: true,\n                                        sensitivity: 'base'\n                                    }\n                                );\n                        if (byMat !== 0) {\n                            return byMat;\n                        }\n                    }\n                    const byStation =\n                        String(a.station || \"\")\n                            .localeCompare(\n                                String(b.station || \"\"),\n                                'uk',\n                                {\n                                    numeric: true,\n                                    sensitivity: 'base'\n                                }\n                            );\n                    if (byStation !== 0) {\n                        return byStation;\n                    }\n                    return String(a.material || \"\")\n                        .localeCompare(\n                            String(b.material || \"\"),\n                            'uk',\n                            {\n                                numeric: true,\n                                sensitivity: 'base'\n                            }\n                        );\n                });\n            /*\n                Режим \"Кількість\": однакові матеріали йдуть підряд,\n                групи розрізняються відтінком фону (світліше / темніше).\n            */\n            const displayRows =\n                sorted.map(r => ({\n                    station: r.station,\n                    material: r.material,\n                    address: r.address,\n                    shade: 0\n                }));\n            let shadeIdx = -1;\n            let prevMat = null;\n            displayRows.forEach(r => {\n                const m =\n                    String(r.material || \"\").trim();\n                if (m !== prevMat) {\n                    shadeIdx++;\n                    prevMat = m;\n                }\n                r.shade = shadeIdx % 2;\n            });\n            html += `\n                <div class=\"premontage-toolbar\">\n                    <button\n                        class=\"premontage-nav-btn${state.shared ? ' active' : ''}\"\n                        data-anav=\"toggle-shared\">\n                        🔗 Спільні\n                    </button>\n                    <button\n                        class=\"premontage-nav-btn${state.sortQty ? ' active' : ''}\"\n                        data-anav=\"toggle-qty\">\n                        🔢 Кількість\n                    </button>\n                </div>\n            `;\n            if (!displayRows.length) {\n                html +=\n                    '<div style=\"text-align:center; padding:40px; color:#aaa;\">Спільних матеріалів не знайдено</div>';\n            } else {\n                html +=\n                    '<table><thead><tr><th>Станція</th><th>Матеріал</th><th>Адреса</th>' +\n                    (state.shared ? '<th>Також в артикулах</th>' : '') +\n                    '</tr></thead><tbody>';\n                displayRows.forEach(r => {\n                    const others =\n                        (\n                            state.shared &&\n                            isWireMaterial(r.material)\n                        )\n                            ? getOtherArticles(\n                                matArticleMap,\n                                r.material,\n                                state.article\n                            )\n                            : [];\n                    const bg =\n                        state.sortQty\n                            ? (r.shade\n                                ? ' background:#eceff4; border-color:#b6c0cf;'\n                                : ' background:#ffffff; border-color:#b6c0cf;')\n                            : '';\n                    const tdStyle =\n                        bg ? ` style=\"${bg.trim()}\"` : '';\n                    const addrStyle =\n                        ` style=\"${bg.trim()} color:#059669; font-weight:600; font-size:14px;\"`;\n                    html += `\n                        <tr\n                            ${toSearchAttr(r.material)}\n                            style=\"cursor:pointer;\">\n                            <td${tdStyle}>${escapeHtml(r.station)}</td>\n                            <td${tdStyle}>${escapeHtml(r.material)}</td>\n                            <td${addrStyle}>${escapeHtml(r.address)}</td>\n                            ${state.shared\n                                ? `<td style=\"white-space:normal; word-break:break-word; min-width:90px;${bg}\">${escapeHtml(others.join(\", \"))}</td>`\n                                : ''}\n                        </tr>\n                    `;\n                });\n                html +=\n                    '</tbody></table>';\n            }\n        } else if (\n            state.action === 'sp' ||\n            state.action === 'ts'\n        ) {\n            /*\n                SP і TS показуємо однаково: картка на кожну станцію,\n                у ній рядки \"номер матеріалу — адреса\".\n                SP: тільки номери 158…; TS: тільки цифри з назви.\n            */\n            const isSp = state.action === 'sp';\n            const byStation = {};\n            rows.forEach(x => {\n                const mat =\n                    String(\n                        x.material || \"\"\n                    ).trim();\n                /* SP і TS: потрібна лише частина, що починається на 158 */\n                const m =\n                    mat.match(/158\\d+/);\n                if (!m) return;\n                const shown = m[0];\n                const st =\n                    String(\n                        x.station || \"\"\n                    ).trim() || \"—\";\n                const addr =\n                    String(\n                        x.address || \"\"\n                    ).trim();\n                if (!byStation[st]) {\n                    byStation[st] = [];\n                }\n                const key =\n                    shown + \"|\" + addr;\n                if (\n                    !byStation[st]\n                        .some(\n                            item =>\n                                item.key === key\n                        )\n                ) {\n                    byStation[st].push({\n                        key,\n                        shown,\n                        search: shown,\n                        addr\n                    });\n                }\n            });\n            const stationKeys =\n                Object.keys(byStation)\n                    .sort((a, b) =>\n                        a.localeCompare(\n                            b,\n                            'uk',\n                            {\n                                numeric: true,\n                                sensitivity: 'base'\n                            }\n                        )\n                    );\n            if (!stationKeys.length) {\n                html +=\n                    '<div style=\"text-align:center; padding:40px; color:#aaa;\">Не знайдено</div>';\n            }\n            if (stationKeys.length) {\n                /*\n                    SP: плоский список у стилі проводів:\n                    номер станції — матеріал — адреса складу.\n                    Спочатку матеріали без адреси.\n                */\n                const flat = [];\n                stationKeys.forEach(st => {\n                    byStation[st].forEach(item => {\n                        flat.push({\n                            station: st,\n                            shown: item.shown,\n                            search: item.search,\n                            addr: item.addr\n                        });\n                    });\n                });\n                flat.sort((a, b) => {\n                    const aNo = a.addr ? 1 : 0;\n                    const bNo = b.addr ? 1 : 0;\n                    if (isSp && aNo !== bNo) {\n                        return aNo - bNo;\n                    }\n                    const byStationCmp =\n                        a.station.localeCompare(\n                            b.station,\n                            'uk',\n                            {\n                                numeric: true,\n                                sensitivity: 'base'\n                            }\n                        );\n                    if (byStationCmp !== 0) {\n                        return byStationCmp;\n                    }\n                    return a.shown.localeCompare(\n                        b.shown,\n                        'uk',\n                        {\n                            numeric: true\n                        }\n                    );\n                });\n                html +=\n                    '<div class=\"wire-list\">';\n                flat.forEach(item => {\n                    html += `\n                        <div\n                            class=\"wire-row\"\n                            ${toSearchAttr(item.search)}\n                            style=\"cursor:pointer;\">\n                            <span class=\"wire-name\" style=\"min-width:34px;\">\n                                ${escapeHtml(item.station)}\n                            </span>\n                            <span class=\"wire-code\" style=\"font-size:16px; font-weight:800; color:#111; text-align:left;\">\n                                ${escapeHtml(item.shown)}\n                            </span>\n                            <span class=\"wire-location\">\n                                ${escapeHtml(item.addr)}\n                            </span>\n                        </div>\n                    `;\n                });\n                html +=\n                    '</div>';\n            } else\n            stationKeys.forEach(st => {\n                const list = byStation[st];\n                if (isSp) {\n                    /* Спочатку матеріали без адреси */\n                    list.sort((a, b) => {\n                        const aNo = a.addr ? 1 : 0;\n                        const bNo = b.addr ? 1 : 0;\n                        if (aNo !== bNo) {\n                            return aNo - bNo;\n                        }\n                        return a.shown.localeCompare(\n                            b.shown,\n                            'uk',\n                            {\n                                numeric: true\n                            }\n                        );\n                    });\n                }\n                html += `\n                    <div class=\"result-card\">\n                        <div class=\"result-top\">\n                            <span class=\"result-material-badge\" style=\"font-size:15px;\">\n                                <span class=\"box-icon\">📍</span>\n                                Станція ${escapeHtml(st)}\n                            </span>\n                        </div>\n                `;\n                list.forEach((item, i) => {\n                    html += `\n                        <div\n                            class=\"article-row\"\n                            ${toSearchAttr(item.search)}\n                            style=\"cursor:pointer;${i === 0 ? ' border-top:none; padding-top:0;' : ''}\">\n                            <span class=\"article-number\" style=\"font-size:20px; font-weight:800;\">\n                                ${escapeHtml(item.shown)}\n                            </span>\n                            <span class=\"result-address-new\">\n                                ${escapeHtml(item.addr)}\n                            </span>\n                        </div>\n                    `;\n                });\n                html +=\n                    `</div>`;\n            });\n        } else if (state.action === 'ізострічка') {\n            const grouped = {};\n            rows.forEach(x => {\n                const matKey =\n                    x.material +\n                    \"|\" +\n                    x.address;\n                if (!grouped[matKey]) {\n                    grouped[matKey] =\n                        new Set();\n                }\n                grouped[matKey]\n                    .add(x.station);\n            });\n            for (\n                let matKey in grouped\n            ) {\n                const [\n                    matName,\n                    matAddr\n                ] =\n                    matKey.split(\"|\");\n                const stationHtmlArr =\n                    [...grouped[matKey]]\n                        .sort((a, b) =>\n                            String(a).localeCompare(\n                                String(b),\n                                'uk',\n                                {\n                                    numeric: true\n                                }\n                            )\n                        )\n                        .map(st =>\n                            escapeHtml(st)\n                        );\n                const stationsHtml =\n                    buildStationsHtml(\n                        stationHtmlArr\n                    );\n                html += `\n                    <div\n                        class=\"result-card\"\n                        ${toSearchAttr(matName)}\n                        style=\"cursor:pointer;\">\n                        <div class=\"result-top\">\n                            <span class=\"result-material-badge\">\n                                <span class=\"box-icon\">📦</span>\n                                ${escapeHtml(matName)}\n                            </span>\n                            <span class=\"result-address-new\">\n                                ${escapeHtml(matAddr)}\n                            </span>\n                        </div>\n                        <div\n                            class=\"article-row\"\n                            style=\"border-top:none; padding-top:0; justify-content:flex-end;\">\n                            <span class=\"article-stations\">\n                                ${stationsHtml}\n                            </span>\n                        </div>\n                    </div>\n                `;\n            }\n        } else {\n            const grouped = {};\n            rows.forEach(x => {\n                const matKey =\n                    x.material +\n                    \"|\" +\n                    x.address;\n                if (!grouped[matKey]) {\n                    grouped[matKey] =\n                        new Set();\n                }\n                grouped[matKey]\n                    .add(x.station);\n            });\n            for (\n                let matKey in grouped\n            ) {\n                const [\n                    matName,\n                    matAddr\n                ] =\n                    matKey.split(\"|\");\n                const stationHtmlArr =\n                    [...grouped[matKey]]\n                        .map(st =>\n                            escapeHtml(st)\n                        );\n                const stationsHtml =\n                    buildStationsHtml(\n                        stationHtmlArr\n                    );\n                html += `\n                    <div\n                        class=\"result-card\"\n                        ${toSearchAttr(matName)}\n                        style=\"cursor:pointer;\">\n                        <div class=\"result-top\">\n                            <span class=\"result-material-badge\">\n                                <span class=\"box-icon\">📦</span>\n                                ${escapeHtml(matName)}\n                            </span>\n                            <span class=\"result-address-new\">\n                                ${escapeHtml(matAddr)}\n                            </span>\n                        </div>\n                        <div\n                            class=\"article-row\"\n                            style=\"border-top:none; padding-top:0; justify-content:flex-end;\">\n                            <span class=\"article-stations\">\n                                ${stationsHtml}\n                            </span>\n                        </div>\n                    </div>\n                `;\n            }\n        }\n    /* ---------- КАТЕГОРІЇ ПЕРЕДМОНТАЖУ ---------- */\n    } else if (\n        state.level === 'premontage-categories'\n    ) {\n        const categories =\n            computePremontageCategoriesForArticle(\n                state.article\n            );\n        html +=\n            '<div class=\"premontage-title\"></div>';\n        if (!categories.length) {\n            html +=\n                '<div style=\"text-align:center; padding:40px; color:#aaa;\">Немає передмонтажів для цього артикулу</div>';\n        } else {\n            const shortCount = {};\n            categories.forEach(c => {\n                const k = premontageShortName(c);\n                shortCount[k] =\n                    (shortCount[k] || 0) + 1;\n            });\n            html +=\n                '<div class=\"premontage-btn-grid\">';\n            categories.forEach(c => {\n                html += `\n                    <button\n                        class=\"premontage-item-btn\"\n                        data-anav=\"category\"\n                        data-category=\"${escapeHtml(c)}\">\n                        ${escapeHtml(\n                            shortCount[premontageShortName(c)] > 1\n                                ? c\n                                : premontageShortName(c)\n                        )}\n                    </button>\n                `;\n            });\n            html +=\n                '</div>';\n        }\n    /* ---------- ПРОВОДИ ПЕРЕДМОНТАЖУ ---------- */\n    } else if (\n        state.level === 'premontage-wires'\n    ) {\n        const wires =\n            computeWiresForCategory(\n                state.article,\n                state.category\n            );\n        html +=\n            '<div class=\"premontage-title\"></div>';\n        if (!wires.length) {\n            html +=\n                '<div style=\"text-align:center; padding:40px; color:#aaa;\">Проводів не знайдено</div>';\n        } else {\n            html +=\n                '<div class=\"wire-list\">';\n            /* Спочатку матеріали з примітками (за алфавітом приміток) */\n            const noteOf = w =>\n                String(w.colD || \"\").trim();\n            const sortedWires =\n                [...wires].sort((a, b) => {\n                    const an = noteOf(a);\n                    const bn = noteOf(b);\n                    if (!an !== !bn) {\n                        return an ? -1 : 1;\n                    }\n                    if (an && bn) {\n                        const byNote =\n                            an.localeCompare(\n                                bn,\n                                'uk',\n                                {\n                                    numeric: true,\n                                    sensitivity: 'base'\n                                }\n                            );\n                        if (byNote !== 0) {\n                            return byNote;\n                        }\n                    }\n                    return String(a.material || \"\")\n                        .localeCompare(\n                            String(b.material || \"\"),\n                            'uk',\n                            {\n                                numeric: true,\n                                sensitivity: 'base'\n                            }\n                        );\n                });\n            sortedWires.forEach(w => {\n                const wireName =\n                    String(\n                        w.material || \"\"\n                    ).trim();\n                const address =\n                    String(\n                        w.address || \"\"\n                    ).trim();\n                /* Примітка (4-й стовпець): назва, примітка, адреса */\n                const note =\n                    String(\n                        w.colD || \"\"\n                    ).trim();\n                html += `\n                    <div\n                        class=\"wire-row\"\n                        ${toSearchAttr(wireName)}\n                        style=\"cursor:pointer; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;\">\n                        <span class=\"wire-name\" style=\"justify-self:start;\">\n                            ${escapeHtml(wireName)}\n                        </span>\n                        <span class=\"wire-code level-head-tail\" style=\"margin-left:0; font-size:11px; font-weight:700; color:#6b7280; text-align:center; flex:none;\">\n                            ${escapeHtml(note)}\n                        </span>\n                        <span class=\"wire-location\" style=\"justify-self:end;\">\n                            ${escapeHtml(address)}\n                        </span>\n                    </div>\n                `;\n            });\n            html +=\n                '</div>';\n        }\n    /* ---------- СТАНЦІЇ ПРОВОДІВ ---------- */\n    } else if (\n        state.level === 'wire-stations'\n    ) {\n        const stations =\n            computeWireStationsForArticle(\n                state.article\n            );\n        html +=\n            '<div class=\"premontage-title\"></div>';\n        if (!stations.length) {\n            html +=\n                '<div style=\"text-align:center; padding:40px; color:#aaa;\">Немає станцій з проводами для цього артикулу</div>';\n        } else {\n            html +=\n                '<div class=\"premontage-btn-grid\">';\n            stations.forEach(st => {\n                html += `\n                    <button\n                        class=\"premontage-item-btn\"\n                        data-anav=\"wire-station\"\n                        data-station=\"${escapeHtml(st)}\">\n                        Станція ${escapeHtml(st)}\n                    </button>\n                `;\n            });\n            html +=\n                '</div>';\n        }\n    /* ---------- РЕЗУЛЬТАТИ ПРОВОДІВ ---------- */\n    } else if (\n        state.level === 'wire-results'\n    ) {\n        const wires =\n            computeWiresForStation(\n                state.article,\n                state.station\n            );\n        html +=\n            '<div class=\"premontage-title\"></div>';\n        if (!wires.length) {\n            html +=\n                '<div style=\"text-align:center; padding:40px; color:#aaa;\">Проводів не знайдено</div>';\n        } else {\n            const seen = new Set();\n            html +=\n                '<div class=\"wire-list\">';\n            wires.forEach(x => {\n                const matName =\n                    String(\n                        x.material || \"\"\n                    ).trim();\n                const matAddr =\n                    String(\n                        x.address || \"\"\n                    ).trim();\n                const key =\n                    matName +\n                    \"|\" +\n                    matAddr;\n                if (seen.has(key)) {\n                    return;\n                }\n                seen.add(key);\n                html += `\n                    <div\n                        class=\"wire-row\"\n                        ${toSearchAttr(matName)}\n                        style=\"cursor:pointer;\">\n                        <span class=\"wire-name\">\n                            ${escapeHtml(matName)}\n                        </span>\n                        <span class=\"wire-location\">\n                            ${escapeHtml(matAddr)}\n                        </span>\n                    </div>\n                `;\n            });\n            html +=\n                '</div>';\n        }\n    }\n    /* ---------- ШАПКА: ліворуч артикул, праворуч назва кнопки ---------- */\n    if (\n        state.level !== 'articles' &&\n        state.level !== 'actions'\n    ) {\n        let right = '';\n        if (state.level === 'results') {\n            right = plainActionName(state.action);\n        } else if (\n            state.level === 'premontage-categories'\n        ) {\n            right = plainActionName('передмонтаж');\n        } else if (\n            state.level === 'premontage-wires'\n        ) {\n            right = state.category || '';\n        } else if (\n            state.level === 'wire-stations'\n        ) {\n            right = plainActionName('проводи');\n        } else if (\n            state.level === 'wire-results'\n        ) {\n            right = state.station ? 'Станція ' + state.station : '';\n        }\n        html =\n            html.replace(\n                '<div class=\"premontage-title\"></div>',\n                ''\n            );\n        html =\n            buildLevelHeadHtml(\n                state.article,\n                right\n            ) + html;\n    }\n    return html;\n}\nfunction buildLevelHeadHtml(article, right) {\n    const fav = isArticleFavorite(article);\n    return `\n        <div class=\"premontage-title level-head\">\n            <span class=\"level-head-main\">\n                <button\n                    class=\"select-btn${fav ? ' selected' : ''}\"\n                    data-anav=\"article-favorite\"\n                    data-article=\"${escapeHtml(article)}\"\n                    aria-label=\"${fav ? 'Прибрати з обраних' : 'Додати до обраних'}\">\n                    ${fav ? '★' : '☆'}\n                </button>\n                <span class=\"level-head-left\">${articleHeadHtml(article)}</span>\n            </span>\n            <span class=\"level-head-right\">${escapeHtml(right)}</span>\n        </div>\n    `;\n}\nfunction getArticleFullCode(base) {\n    if (!_fullCodeMap) {\n        _fullCodeMap =
