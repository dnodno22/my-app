<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Пошук</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, Arial, sans-serif;
    background: #fff;
    touch-action: none;
}
#pages {
    display: flex;
    width: 300%;
    height: 100%;
    transform: translateX(-33.333333%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.page {
    width: 33.333333%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
}
.search-header {
    padding: 16px 16px 8px;
    padding-top: calc(30px + env(safe-area-inset-top));
    flex-shrink: 0;
}
#page-articles .scroll-area {
    padding-top: calc(30px + env(safe-area-inset-top));
}
input#input {
    width: 100%;
    padding: 16px 18px;
    font-size: 22px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    text-align: center;
    outline: none;
    background: #f9fafb;
    color: #111;
    caret-color: transparent;
    height: 60px;
}
.scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 16px 16px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}
.articles-dots {
    position: fixed;
    bottom: calc(8px + env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    height: 18px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 7px;
    z-index: 30;
    pointer-events: none;
}
.articles-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d1d5db;
    transition: all 0.2s ease;
}
.articles-dots .dot.past { background: #9ca3af; }
.articles-dots .dot.active { width: 9px; height: 9px; background: #111827; }
.articles-drag-wrapper {
    display: flex;
    align-items: flex-start;
    width: 200%;
    will-change: transform;
}
.articles-drag-pane {
    width: 50%;
    flex: 0 0 50%;
    box-sizing: border-box;
    min-width: 0;
    padding: 0;
}
#page-articles.articles-swiping .scroll-area {
    overflow-y: hidden;
    touch-action: none;
}
#page-articles, #page-articles * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
#page-articles table, #page-articles td, #page-articles th, #page-articles .result-card, #page-articles .premontage-title {
    touch-action: pan-y;
}
#page0, #page0 *, #page-waitlist, #page-waitlist *, #pm-qty-panel, #pm-qty-panel * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
#page0 textarea, #page-waitlist textarea, #pm-qty-panel textarea, #page-articles textarea {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
}
.result-card {
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    padding: 24px;
    margin-bottom: 16px;
}
.result-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}
.result-material-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #111111;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.1;
    white-space: nowrap;
}
.result-address-new {
    font-weight: 600;
    font-size: 14px;
    color: #059669;
    white-space: nowrap;
    text-align: right;
}
body.interface-readable .ico { display: none; }
body.interface-readable .star-right { display: none; }
body.interface-classic .star-left { display: none; }
body.interface-readable #result .result-address-new,
body.interface-readable #waitlist-result .result-address-new {
    color: #111111;
    font-size: 15px;
    font-weight: 700;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 14px;
    padding: 8px 14px;
}
.article-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid #ECECEC;
}
.article-row:first-child { border-top: none; padding-top: 0; }
.art-r.art-r-fav { border-left: 4px solid #003366; padding-left: 11px; }
.article-number { font-size: 15px; font-weight: 700; color: #111111; white-space: nowrap; }
.article-number .art-g1 { margin-right: 3px; }
.article-number .art-g2 { font-size: 1.2em; margin-right: 3px; }
.article-stations {
    font-size: 20px;
    font-weight: 800;
    color: #111111;
    text-align: right;
    line-height: 1.3;
}
.article-row .article-stations { flex: 1; min-width: 0; }
.station-list-classic { display: none; }
.station-list-readable {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 4px;
}
.station-chip {
    display: inline-flex;
    min-width: 34px;
    min-height: 30px;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #f3f4f6;
    color: #111;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
}
body.interface-classic .station-list-classic { display: block; }
body.interface-classic .station-list-readable { display: none; }
body.interface-readable .station-list-classic { display: none; }
body.interface-readable .station-list-readable { display: flex; }
.art-classic { display: inline; }
.art-readable { display: none; }
body.interface-classic .art-classic { display: inline; }
body.interface-classic .art-readable { display: none; }
body.interface-readable .art-classic { display: none; }
body.interface-readable .art-readable { display: inline-flex; }
.art-r {
    align-items: baseline;
    gap: 2px;
    white-space: nowrap;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 14px;
    padding: 8px 14px;
}
.art-r-base { font-size: 20px; font-weight: 800; line-height: 1.15; color: #111; }
.art-r-stack { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.art-r-stan { font-size: 14px; font-weight: 700; color: #6b7280; margin-left: 1px; }

.wl-menu-btn {
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #111;
    font-size: 20px;
    line-height: 1;
    border-radius: 10px;
    padding: 6px 10px;
    margin-left: 12px;
    cursor: pointer;
    touch-action: manipulation;
}
.wl-menu-btn.open { background: #eef2ff; border-color: #c7d2fe; color: #4338ca; }
.wl-history {
    position: absolute;
    left: 16px; right: 16px; top: calc(88px + env(safe-area-inset-top));
    z-index: 40; max-height: 60%; overflow-y: auto; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,0.14); padding: 6px 0; touch-action: pan-y;
}
.wl-history-title { padding: 8px 14px; font-size: 13px; font-weight: 800; color: #6b7280; }
.wl-history-row { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid #f0f0f0; font-size: 14px; color: #111; }
.wl-history-time { flex-shrink: 0; min-width: 78px; font-size: 12px; font-weight: 700; color: #6b7280; }
.wl-history-text { word-break: break-word; }
.wl-history-empty { padding: 12px 14px; font-size: 14px; color: #9ca3af; }
.waitlist-title {
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #111111; text-align: center; padding: 8px 0;
}
.select-btn {
    border: none; background: transparent; font-size: 24px; line-height: 1; cursor: pointer; padding: 2px 4px; color: #d1d5db; flex-shrink: 0;
}
.select-btn.selected { color: #FFC400; }
.select-btn:active { transform: scale(.9); }
.article-choice-row { display: flex; align-items: stretch; gap: 8px; }
.article-choice-main { flex: 1; min-width: 0; }
.article-favorite-btn {
    width: 54px; min-width: 54px; border: 1px solid #e5e7eb; background: #f9fafb; color: #9ca3af;
    border-radius: 14px; font-size: 22px; font-weight: 700; cursor: pointer;
}
.article-favorite-btn.selected { color: #FFC400; background: #fffaf0; border-color: #f3d37a; }
.article-favorite-btn:active { transform: scale(.96); }
.waitlist-actions-row { display: flex; gap: 8px; margin-top: 16px; }
.waitlist-remove-btn {
    border: none; background: #fff7e0; color: #b45309; font-weight: 700; font-size: 14px;
    border-radius: 10px; padding: 10px 0; flex: 1; text-align: center; cursor: pointer;
}
.waitlist-remove-btn:active { background: #fdeeca; }
.comment-toggle-btn {
    border: none; background: #eef2ff; color: #4338ca; font-weight: 700; font-size: 14px;
    border-radius: 10px; padding: 10px 0; flex: 1; text-align: center; cursor: pointer;
}
.comment-toggle-btn:active { background: #e0e7ff; }
.comment-edit-area { margin-top: 12px; }
.comment-textarea {
    width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; resize: vertical; min-height: 64px; outline: none; color: #111; background: #f9fafb;
}
.comment-save-btn {
    display: block; margin-top: 8px; border: none; background: #4338ca; color: #fff;
    font-weight: 700; font-size: 14px; border-radius: 10px; padding: 10px 0; width: 100%; text-align: center; cursor: pointer;
}
.comment-save-btn:active { background: #372ea8; }
.waitlist-comment-text {
    margin-top: 12px; padding: 10px 12px; background: #f3f4f6; border-radius: 10px;
    font-size: 14px; color: #374151; white-space: pre-wrap; word-break: break-word;
}
.premontage-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.premontage-nav-btn {
    border: none; background: #eef2ff; color: #4338ca; font-weight: 700; font-size: 14px;
    border-radius: 10px; padding: 10px 14px; cursor: pointer;
}
.premontage-nav-btn:active { background: #e0e7ff; }
.premontage-nav-btn.active { background: #4338ca; color: #fff; }
.premontage-close-btn { background: #fff7e0; color: #b45309; margin-left: auto; }
.premontage-close-btn:active { background: #fdeeca; }
.premontage-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 14px; }
.level-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.level-head-left { font-size: 20px; font-weight: 800; color: #111; }
.level-head-main { display: inline-flex; align-items: center; gap: 4px; }
.level-head-tail { font-size: 0.7em; font-weight: 700; color: #6b7280; margin-left: 1px; }
.level-head-right { font-size: 20px; font-weight: 800; color: #111; text-align: right; }
.premontage-btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.premontage-item-btn {
    border: 1px solid #e5e7eb; background: #f9fafb; color: #111; font-weight: 700; font-size: 15px;
    border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; white-space: normal; word-break: break-word;
}
.premontage-item-btn:active { background: #eef2ff; }
.premontage-item-btn.favorite { background: #fffaf0; border-color: #f3d37a; }
.wire-list { display: flex; flex-direction: column; gap: 8px; }
.wire-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px 14px;
}
.wire-name { font-weight: 800; font-size: 16px; color: #111; flex-shrink: 0; }
.wire-code { font-size: 13px; color: #6b7280; flex: 1; text-align: center; }
.wire-location { font-weight: 600; font-size: 14px; color: #059669; text-align: right; white-space: nowrap; }
#pull-indicator {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; width: 38px; height: 38px;
    margin-left: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800;
    color: #4338ca; opacity: 0; transform: translate(-50%, -30px) scale(0.6); pointer-events: none; z-index: 50;
}
#pull-indicator.ready { background: #eef2ff; }
#pull-indicator .pull-arrow { display: inline-block; line-height: 1; }
.mat-pick {
    border: none; background: transparent; font: inherit; color: inherit; padding: 4px 6px;
    margin: -4px -6px; border-radius: 8px; cursor: pointer; text-align: left; white-space: nowrap; touch-action: manipulation;
}
.mat-pick:active { background: #eef2ff; }
.mat-pick.qty-target { outline: 2px solid #4338ca; background: #eef2ff; }
input#input.qty-mode { background: #eef2ff; border-color: #4338ca; }
.qty-bar { margin-bottom: 10px; }
.qty-title { font-size: 14px; font-weight: 700; color: #111; text-align: center; margin-bottom: 8px; word-break: break-word; }
.qty-bar .comment-textarea { min-height: 48px; margin-bottom: 8px; }
.qty-actions { display: flex; gap: 8px; }
.qty-btn {
    flex: 1; border: 1px solid #222; background: #fff; color: #222; font-weight: 700; font-size: 14px;
    border-radius: 8px; padding: 12px 0; touch-action: manipulation; user-select: none;
}
.qty-btn:active { transform: scale(.97); }
.qty-btn.qty-comment { background: #eef2ff; border-color: #c7d2fe; color: #4338ca; }
.qty-btn.qty-cancel { flex: 0 0 52px; background: #fff7e0; border-color: #f3d37a; color: #b45309; }
.qty-btn.qty-ok { background: #4338ca; border-color: #4338ca; color: #fff; }
.waitlist-qty {
    font-weight: 800; font-size: 20px; color: #111; margin-left: 12px; padding-left: 12px;
    border-left: 2px solid #d1d5db; white-space: nowrap;
}
.waitlist-divider { height: 1px; background: #e5e7eb; margin-top: 14px; }
.pm-group-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pm-group-article { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 22px; font-weight: 800; color: #111; margin-bottom: 10px; }
.pm-group-clear-btn {
    border: none; background: #fff7e0; color: #b45309; font-weight: 700; font-size: 14px;
    border-radius: 10px; padding: 9px 14px; cursor: pointer;
}
.pm-group-clear-btn:active { background: #fdeeca; }
.pm-group-article-frame.art-r-fav { border-left: 4px solid #003366; padding-left: 11px; }
.pm-group-article-frame {
    display: inline-flex; align-items: baseline; gap: 2px; white-space: nowrap;
    border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 14px; padding: 8px 14px;
}
.pm-group-item { padding: 10px 12px; border-radius: 12px; cursor: pointer; }
.pm-group-item.qty-target { outline: 2px solid #4338ca; background: #eef2ff; }
.pm-group-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.waitlist-qty-right, .pm-group-right .waitlist-qty { margin-left: 0; padding-left: 0; border-left: none; }
.pm-group-addr { font-size: 14px; font-weight: 700; color: #059669; white-space: nowrap; }
.pm-group-kind { margin-left: 8px; font-size: 13px; font-weight: 700; color: #6b7280; }
.pm-group-chips { display: inline-flex; margin-left: 8px; vertical-align: middle; }
.pm-group-chips .station-list-readable { justify-content: flex-start; }
.pm-group-stations-small { margin-left: 0; margin-top: 4px; }
.pm-group-stations { margin-top: 8px; font-size: 15px; }
.result-card.qty-target, .wire-row.qty-target { outline: 2px solid #4338ca; background: #eef2ff; }
.pm-group-name { font-size: 20px; font-weight: 800; color: #111; word-break: break-word; }
.pm-group-sep { margin-top: 6px; border-top: 1px solid #ECECEC; border-top-left-radius: 0; border-top-right-radius: 0; }
.premontage-item-btn.qty-target { outline: 2px solid #4338ca; background: #eef2ff; }
.pm-qty-badge { margin-left: 8px; padding-left: 8px; border-left: 2px solid #d1d5db; font-weight: 800; color: #4338ca; white-space: nowrap; }
.pm-qty-panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: #fff;
    border-top: 1px solid #e5e7eb; padding: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 18px rgba(0,0,0,0.10);
}
.pm-qty-display {
    height: 52px; line-height: 50px; margin-bottom: 10px; border: 1px solid #4338ca;
    border-radius: 14px; background: #eef2ff; text-align: center; font-size: 22px; font-weight: 800; color: #111;
}
.pm-qty-display:empty::before { content: 'Кількість'; color: #9ca3af; font-weight: 500; }
.pm-qty-panel .qty-actions { margin-bottom: 10px; }
mark.hl { background: #fde047; color: #111; border-radius: 3px; padding: 0 2px; font-weight: inherit; }
.kb-container { position: relative; flex-shrink: 0; background: #fff; border-top: 1px solid #e5e7eb; padding: 12px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
.kb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.filter-menu {
    position: absolute; left: 12px; right: 12px; top: 12px; bottom: calc(28px + env(safe-area-inset-bottom));
    z-index: 45; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 0; background: transparent;
}
.filter-option {
    min-width: 0; min-height: 0; height: 100%; padding: 4px 6px; border: 1px solid #222;
    border-radius: 8px; background: #fff; color: #000; font: 600 14px -apple-system, Arial, sans-serif; text-align: center; cursor: pointer; touch-action: manipulation;
}
.filter-option.active { border-color: #9ca3af; background: #e5e7eb; color: #000; }
.filter-menu:not(.filter-options-open) .filter-choice { display: none; }
.filter-menu:not(.interface-options-open) .interface-choice { display: none; }
.filter-menu.filter-options-open [data-filter-expand],
.filter-menu.filter-options-open [data-interface-expand],
.filter-menu.interface-options-open [data-filter-expand],
.filter-menu.interface-options-open [data-interface-expand] { display: none; }
.filter-menu-heading { background: #f1f5f9; color: #000; }
.filter-empty { border: 0; background: transparent; pointer-events: none; }
.filter-panel-open #kb1 { visibility: hidden; }
.hidden { display: none !important; }
.btn {
    background: #fff; border: 1px solid #222; border-radius: 8px; color: #222;
    font-size: 18px; font-weight: 600; padding: 15px 0; text-align: center; touch-action: manipulation; user-select: none;
}
.btn:active { background: #F7F7F7; transform: scale(.96); }
.btn-special { background: #f1f5f9; }
.btn-version {
    background: #f1f5f9; color: #000; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; user-select: none; cursor: pointer;
}
.table-page { background: #fff; }
.table-header { padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); border-bottom: 1px solid #e5e7eb; flex-shrink: 0; display: flex; justify-content: space-between; align-items: baseline; }
.table-title { font-weight: 700; font-size: 16px; color: #111; }
.table-updated { font-size: 11px; color: #9ca3af; }
.table-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
th { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 12px 8px; text-align: left; font-weight: 700; color: #333; }
td { border: 1px solid #e2e8f0; padding: 8px; white-space: nowrap; color: #444; }
tr:nth-child(even) td { background: #f9fafb; }

#instant-start {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; background: #fff; color: #111;
    padding: 0 16px calc(10px + env(safe-area-inset-bottom)); font-family: -apple-system, Arial, sans-serif;
}
#instant-start .instant-head { padding-top: calc(30px + env(safe-area-inset-top)); padding-bottom: 8px; }
#instant-start .instant-input { height: 60px; border: 1px solid #e5e7eb; border-radius: 14px; background: #f9fafb; display:flex; align-items:center; justify-content:center; font-size:22px; color:#6b7280; }
#instant-start .instant-spacer { flex: 1; min-height: 12px; }
#instant-start .instant-kb { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
#instant-start .instant-key { height: clamp(48px, 8.2vh, 68px); border:0; border-radius:14px; background:#f3f4f6; color:#111; font-size:24px; font-weight:500; }

<script>
setTimeout(() => document.getElementById("instant-start")?.remove(), 2200);
requestAnimationFrame(() => setTimeout(() => {
const CODE_VERSION = 124;
const SPREADSHEET_ID = "1ii4oiQvbayKKN1tffS4X7WxH0NPZ0oiooaHPP6Ku6W8";
const SEARCH_GID = "1679964111";
const AUDI_GID = SEARCH_GID;
const BMW_GID = "421001458";
const PREMONTAGE_AUDI_GID = "1146686549";
const SEARCH_GIDS = [AUDI_GID, BMW_GID, PREMONTAGE_AUDI_GID, "2115582321", "994923423"];

const _expandCache = new Map();
let _actionsCache = {};
let _fullCodeMap = null;
let _isotapeSet = null;
let TOTAL_PAGES = 3;
const SEARCH_PAGE_INDEX = 1;
const ARTICLES_PAGE_INDEX = 2;
let currentPage = SEARCH_PAGE_INDEX;
let searchData = [];
let selectedSearchFilters = [];
let filterOptionsOpen = false;
let interfaceOptionsOpen = false;
let pageWidthPercent = 100 / TOTAL_PAGES;
let articleGroups = [];

let qtyMode = false;
let qtyKey = null;
let qtySavedInput = "";
let qtyCardEl = null;

let pmQtyMode = false;
let pmQtyArticle = "";
let pmQtyCategory = "";
let pmQtyLabel = "";
let pmQtyValue = "";
let pmQtySource = "articles";
let pmQtyKey = "";
let pmQtyHad = false;
let pmKbWasHidden = false;
let pmSptsData = null;

let articlesPageStack = [
    { level: 'articles' }
];
const ARTICLE_ACTION_KEYS = [
    "розміщення",
    "sp",
    "ts",
    "ізострічка",
    "мм",
    "передмонтаж",
    "проводи",
    "список"
];
const ACTION_LABELS = {
    "розміщення": '<span class="ico">📍 </span>Розміщення',
    "sp": '<span class="ico">🔩 </span>SP',
    "ts": '<span class="ico">🧷 </span>TS',
    "ізострічка": '<span class="ico">📏 </span>Ізострічка',
    "мм": '<span class="ico">📐 </span>ММ',
    "передмонтаж": '<span class="ico">🧵 </span>Передмонтаж',
    "проводи": '<span class="ico">⚡ </span>Проводи'
};
function actionLabel(key) {
    return ACTION_LABELS[key] || escapeHtml(key);
}

const input = document.getElementById('input');
const resultBox = document.getElementById('result');
const waitlistBox = document.getElementById('waitlist-result');
const kbWrapper = document.getElementById('kb-wrapper');
const pagesEl = document.getElementById('pages');
const articlesPageContent = document.getElementById('articles-page-content');
const articlesDots = document.getElementById('articles-dots');
const CACHE_KEY_SEARCH = "searchDataCSV";
const CACHE_KEY_SEARCH_TIME = "searchDataCSVTime";
const CACHE_KEY_SEARCH_FILTERS = "searchActiveFilters";
const SEARCH_FILTER_KEYS = ['wires', 'materials', 'premontage', 'audi', 'bmw'];
const SEARCH_SOURCE_FILTERS = ['audi', 'bmw', 'premontage'];
const CACHE_KEY_INTERFACE_MODE = "searchInterfaceMode";
const INTERFACE_MODE_KEYS = ['classic', 'readable'];

function loadInterfaceMode() {
    try {
        const saved = localStorage.getItem(CACHE_KEY_INTERFACE_MODE);
        return INTERFACE_MODE_KEYS.includes(saved) ? saved : 'readable';
    } catch (e) { return 'readable'; }
}
let interfaceMode = loadInterfaceMode();

function loadSearchFilters() {
    try {
        const saved = JSON.parse(localStorage.getItem(CACHE_KEY_SEARCH_FILTERS) || "null");
        if (saved && saved.version === 3 && Array.isArray(saved.filters)) {
            return [...new Set(saved.filters.map(String).filter(filter => SEARCH_FILTER_KEYS.includes(filter)))];
        }
        const previousFilters = saved && Array.isArray(saved.filters) ? saved.filters : Array.isArray(saved) ? saved : [];
        return [...new Set(previousFilters.map(String).filter(filter => ['wires', 'materials', 'premontage'].includes(filter)))];
    } catch (e) { return []; }
}
function saveSearchFilters() {
    try {
        localStorage.setItem(CACHE_KEY_SEARCH_FILTERS, JSON.stringify({ version: 3, filters: selectedSearchFilters }));
    } catch (e) {}
}
selectedSearchFilters = loadSearchFilters();

function renderArticlesDots(overridePage, overrideDepth) {
    if (!articlesDots) return;
    const page = overridePage !== undefined ? overridePage : currentPage;
    if (page !== ARTICLES_PAGE_INDEX && page !== SEARCH_PAGE_INDEX) {
        articlesDots.style.display = 'none';
        articlesDots.innerHTML = '';
        return;
    }
    let depth = page === SEARCH_PAGE_INDEX ? 1 : (overrideDepth !== undefined ? overrideDepth : articlesPageStack.length) + 1;
    if (depth <= 0) {
        articlesDots.style.display = 'none';
        articlesDots.innerHTML = '';
        return;
    }
    articlesDots.style.display = 'flex';
    let html = '';
    for (let i = 0; i < depth; i++) {
        let className = 'dot' + (i === depth - 1 ? ' active' : ' past');
        html += `<span class="${className}"></span>`;
    }
    articlesDots.innerHTML = html;
}

const kbVersionEl = document.getElementById('kb-version');
const filterMenu = document.getElementById('filter-menu');
const SEARCH_FILTER_LABELS = { all: 'Усі дані', wires: 'Проводи', materials: 'Матеріал', premontage: 'Передмонт.', audi: 'Audi', bmw: 'BMW' };

function updateSearchFilterButton() {
    if (kbVersionEl) {
        const selectedLabels = selectedSearchFilters.map(filter => SEARCH_FILTER_LABELS[filter]).filter(Boolean);
        kbVersionEl.textContent = 'v' + CODE_VERSION;
        kbVersionEl.title = `Фільтр: ${selectedLabels.length ? selectedLabels.join(', ') : SEARCH_FILTER_LABELS.all}`;
    }
    if (filterMenu) {
        filterMenu.querySelectorAll('[data-search-filter]').forEach(option => {
            const filter = option.dataset.searchFilter;
            const selected = filter === 'all' ? selectedSearchFilters.length === 0 : selectedSearchFilters.includes(filter);
            option.classList.toggle('active', selected);
        });
    }
}
updateSearchFilterButton();

function setFilterPanelOpen(open) {
    if (!filterMenu) return;
    if (!open) { setFilterOptionsOpen(false); setInterfaceOptionsOpen(false); }
    filterMenu.classList.toggle('hidden', !open);
    kbWrapper.classList.toggle('filter-panel-open', open);
}

function setFilterOptionsOpen(open) {
    if (!filterMenu) return;
    filterOptionsOpen = open;
    filterMenu.classList.toggle('filter-options-open', open);
}

function setInterfaceOptionsOpen(open) {
    if (!filterMenu) return;
    interfaceOptionsOpen = open;
    filterMenu.classList.toggle('interface-options-open', open);
}

function setInterfaceMode(mode) {
    if (!INTERFACE_MODE_KEYS.includes(mode)) return;
    interfaceMode = mode;
    document.body.classList.toggle('interface-classic', mode === 'classic');
    document.body.classList.toggle('interface-readable', mode === 'readable');
    try { localStorage.setItem(CACHE_KEY_INTERFACE_MODE, mode); } catch (e) {}
}
setInterfaceMode(interfaceMode);

document.querySelectorAll('.page').forEach(p => { p.style.width = pageWidthPercent + '%'; });
pagesEl.style.width = (TOTAL_PAGES * 100) + '%';
pagesEl.style.transform = `translateX(-${currentPage * pageWidthPercent}%)`;

function normalizeArticlePart(part) { return String(part || "").trim().replace(/\s+/g, ""); }
function getArticleBase(code) { return (/^\d{7}/.test(code) && code.length > 7) ? code.slice(0, 7) : code; }

function expandArticleValue(raw) {
    const k = String(raw || "");
    let r = _expandCache.get(k);
    if (r === undefined) {
        r = expandArticleValueRaw(k);
        _expandCache.set(k, r);
    }
    return r;
}

function expandArticleValueRaw(raw) {
    raw = String(raw || "").trim();
    if (!raw) return [];
    const parts = raw.split("/").map(normalizeArticlePart).filter(Boolean);
    if (!parts.length) return [];
    if (parts.length === 1) return [getArticleBase(parts[0])];
    const first = getArticleBase(parts[0]);
    const result = [first];
    let prefix = (/^\d+$/.test(first) && first.length >= 3) ? first.slice(0, -3) : "";
    for (let i = 1; i < parts.length; i++) {
        const part = parts[i];
        if (/^\d{1,3}$/.test(part) && prefix) {
            result.push(prefix + part.padStart(3, "0"));
        } else {
            result.push(getArticleBase(part));
        }
    }
    return [...new Set(result)];
}

function computeArticleGroups() {
    const groups = {};
    searchData.forEach(row => {
        expandArticleValue(row.article).forEach(article => {
            if (!article) return;
            if (!groups[article]) groups[article] = [];
            groups[article].push(row);
        });
    });
    Object.keys(groups).forEach(article => {
        const seen = new Set();
        groups[article] = groups[article].filter(row => {
            const key = [row.station, row.material, row.article, row.colD, row.address].join("|||");
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });
    });
    const keys = Object.keys(groups).sort((a, b) => a.localeCompare(b, "uk", { numeric: true, sensitivity: "base" }));
    return keys.map(article => ({ article, rows: groups[article] }));
}

const CACHE_KEY_ARTICLE_FAVORITES = "articleFavorites";
function loadArticleFavorites() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY_ARTICLE_FAVORITES) || "[]").map(String); } catch (e) { return []; }
}
function saveArticleFavorites(list) {
    localStorage.setItem(CACHE_KEY_ARTICLE_FAVORITES, JSON.stringify([...new Set(list.map(String))]));
}
function isArticleFavorite(article) { return loadArticleFavorites().includes(String(article)); }
function toggleArticleFavorite(article) {
    const art = String(article || "");
    if (!art) return false;
    const list = loadArticleFavorites();
    const idx = list.indexOf(art);
    if (idx >= 0) { list.splice(idx, 1); saveArticleFavorites(list); return false; }
    list.push(art); saveArticleFavorites(list); return true;
}
function sortArticlesWithFavorites(articles) {
    const favorites = new Set(loadArticleFavorites());
    return [...articles].sort((a, b) => {
        const aFav = favorites.has(String(a)), bFav = favorites.has(String(b));
        if (aFav !== bFav) return aFav ? -1 : 1;
        return String(b).localeCompare(String(a), "uk", { numeric: true, sensitivity: "base" });
    });
}
function refreshArticleGroups() {
    articleGroups = computeArticleGroups();
    articlesPageStack.forEach(s => { delete s.cachedHtml; });
    renderArticlesPage(true);
}

document.getElementById('kb-wrapper').addEventListener('click', (e) => {
    const qtyBtn = e.target.closest('[data-qty]');
    if (qtyBtn) {
        e.preventDefault(); e.stopPropagation();
        const act = qtyBtn.dataset.qty;
        if (act === 'comment') {
            qtyComment.classList.toggle('hidden');
            if (!qtyComment.classList.contains('hidden')) qtyComment.focus();
        } else if (act === 'cancel') { exitQtyMode(); }
        else if (act === 'ok') { confirmQty(); }
        return;
    }
    const btn = e.target.closest('.btn');
    if (!btn) return;
    e.stopPropagation();
    if (btn.id === 'kb-version') {
        if (qtyMode) return;
        setFilterPanelOpen(filterMenu.classList.contains('hidden'));
        return;
    }
    if (btn.dataset.del) { input.value = ""; }
    else if (btn.dataset.v !== undefined) { input.value += btn.dataset.v; }
    if (qtyMode) return;
    search();
});

document.addEventListener('click', e => {
    if (!filterMenu || filterMenu.classList.contains('hidden') || e.target.closest('#filter-menu .filter-option') || e.target.closest('#kb-version')) return;
    setFilterPanelOpen(false);
});

function parseSearchCSV(parts) {
    _actionsCache = {}; _fullCodeMap = null; _isotapeSet = null;
    searchData = (Array.isArray(parts) ? parts : [{ gid: SEARCH_GID, text: parts }]).flatMap(part => {
        const csv = String(part.text || "").trim();
        if (!csv) return [];
        return csv.split(/\r?\n/).map(r => {
            const c = r.split(",");
            return { station: c[0] || "", material: c[1] || "", article: c[2] || "", colD: c[3] || "", address: c[4] || "", sourceGid: String(part.gid || "") };
        });
    });
}

function gidCacheKey(gid) { return String(gid) === String(SEARCH_GID) ? CACHE_KEY_SEARCH : CACHE_KEY_SEARCH + "_" + gid; }

function initializeCachedSearch() {
    let cachedSearch = [];
    try {
        cachedSearch = SEARCH_GIDS.map(g => ({ gid: g, text: localStorage.getItem(gidCacheKey(g)) || "" })).filter(part => part.text.trim());
    } catch (_) {}
    if (cachedSearch.length) { parseSearchCSV(cachedSearch); if (input.value) search(); }
    refreshArticleGroups();
}

function fetchSearchData() {
    const stamp = Date.now();
    Promise.all(SEARCH_GIDS.map(gid => fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}&t=` + stamp).then(r => r.ok ? r.text() : null).catch(() => null))).then(texts => {
        let changed = false;
        texts.forEach((t, i) => {
            if (t === null || /^\s*</.test(t)) return;
            const key = gidCacheKey(SEARCH_GIDS[i]);
            if (localStorage.getItem(key) !== t) { localStorage.setItem(key, t); changed = true; }
        });
        if (!changed) return;
        parseSearchCSV(SEARCH_GIDS.map(g => ({ gid: g, text: localStorage.getItem(gidCacheKey(g)) || "" })));
        refreshArticleGroups();
        if (input.value) search();
    });
}

function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function highlight(text, v, fromEnd) {
    const safe = escapeHtml(text);
    if (!v) return safe;
    const lower = text.toLowerCase();
    if (fromEnd) {
        const endLen = lower.replace(/\s+$/, "").length;
        if (!lower.slice(0, endLen).endsWith(v)) return safe;
        return escapeHtml(text.slice(0, endLen - v.length)) + '<mark class="hl">' + escapeHtml(text.slice(endLen - v.length, endLen)) + '</mark>' + escapeHtml(text.slice(endLen));
    } else {
        if (!lower.startsWith(v)) return safe;
        return '<mark class="hl">' + escapeHtml(text.slice(0, v.length)) + '</mark>' + escapeHtml(text.slice(v.length));
    }
}

const STATIONS_PER_LINE = 5;
function buildStationsHtml(stationHtmlArr) {

function readableMultiArticleHtml(art, v, isNumOnly, isSpecialSearch) {
    const parts = String(art).split("/").map(p => normalizeArticlePart(p)).filter(Boolean);
    const first = parts[0] || "";
    const firstBase = /^\d{7}/.test(first) ? first.slice(0, 7) : first;
    const firstTail = first.slice(firstBase.length);
    const prefix = /^\d{4,}$/.test(firstBase) ? firstBase.slice(0, -3) : "";
    const items = parts.map((p, i) => {
        if (i === 0) return { base: firstBase, tail: firstTail };
        const m = p.match(/^(\d{1,3})(\D.*)?$/);
        if (m && prefix) return { base: prefix + m[1].padStart(3, "0"), tail: m[2] || firstTail };
        const b = /^\d{7}/.test(p) ? p.slice(0, 7) : p;
        return { base: b, tail: p.slice(b.length) };
    });
    const baseHtmlOf = base => {
        if (!isSpecialSearch && v && isNumOnly && base.toLowerCase().endsWith(v)) {
            const idx = base.length - v.length;
            return escapeHtml(base.slice(0, idx)) + '<mark class="hl">' + escapeHtml(base.slice(idx)) + '</mark>';
        }
        if (!isSpecialSearch && v && !isNumOnly && base.toLowerCase().startsWith(v)) {
            return '<mark class="hl">' + escapeHtml(base.slice(0, v.length)) + '</mark>' + escapeHtml(base.slice(v.length));
        }
        return escapeHtml(base);
    };
    const favs = new Set(loadArticleFavorites());
    return '<span class="art-r-stack">' + items.map(it => '<span class="art-r' + (favs.has(it.base) ? ' art-r-fav' : '') + '"><span class="art-r-base">' + baseHtmlOf(it.base) + '</span>' + (it.tail ? '<span class="art-r-stan">' + escapeHtml(it.tail) + '</span>' : '') + '</span>').join('') + '</span>';
}

function renderArticleNumber(art, v, isNumOnly, isSpecialSearch, fancy) {
    let matchStart = -1, matchEnd = -1;
    if (!isSpecialSearch && v) {
        const lower = art.toLowerCase();
        if (isNumOnly) { if (lower.endsWith(v)) { matchStart = art.length - v.length; matchEnd = art.length; } }
        else { if (lower.startsWith(v)) { matchStart = 0; matchEnd = v.length; } }
    }
    function part(s, e) {
        const str = art.slice(s, e);
        if (matchStart === -1) return escapeHtml(str);
        const overlapStart = Math.max(s, matchStart);
        const overlapEnd = Math.min(e, matchEnd);
        if (overlapStart >= overlapEnd) return escapeHtml(str);
        let out = '';
        if (overlapStart > s) out += escapeHtml(art.slice(s, overlapStart));
        out += '<mark class="hl">' + escapeHtml(art.slice(overlapStart, overlapEnd)) + '</mark>';
        if (overlapEnd < e) out += escapeHtml(art.slice(overlapEnd, e));
        return out;
    }
    const len = art.length, g1end = Math.min(4, len), g2end = Math.min(7, len);
    let html = (len <= 4) ? `<span class="art-g1">${part(0, len)}</span>` : `<span class="art-g1">${part(0, g1end)}</span><span class="art-g2">${part(g1end, g2end)}</span>` + (len > 7 ? `<span class="art-g3">${part(g2end, len)}</span>` : '');
    if (!fancy) return html;
    if (String(art).includes("/")) return `<span class="art-classic">${html}</span><span class="art-readable">${readableMultiArticleHtml(art, v, isNumOnly, isSpecialSearch)}</span>`;
    const favBase = expandArticleValue(art)[0], isFav = Boolean(favBase) && loadArticleFavorites().includes(favBase);
    let readable = '<span class="art-r' + (isFav ? ' art-r-fav' : '') + '"><span class="art-r-base">' + part(0, g2end) + '</span>' + (len > 7 ? '<span class="art-r-stan">' + part(g2end, len) + '</span>' : '') + '</span>';
    return `<span class="art-classic">${html}</span><span class="art-readable">${readable}</span>`;
}

function mergeAbbreviatedArticles(articleMap) {
    const arts = Object.keys(articleMap);
    const fullArts = arts.filter(a => a.length > 3);
    const shortArts = arts.filter(a => a.length <= 3);
    if (!shortArts.length) return articleMap;
    const fullByLast3 = {};
    fullArts.forEach(a => { fullByLast3[a.slice(-3)] = a; });
    const merged = {};
    fullArts.forEach(a => { merged[a] = new Set(articleMap[a]); });
    shortArts.forEach(shortArt => {
        const target = fullByLast3[shortArt];
        if (target) articleMap[shortArt].forEach(st => merged[target].add(st));
        else {
            if (!merged[shortArt]) merged[shortArt] = new Set();
            articleMap[shortArt].forEach(st => merged[shortArt].add(st));
        }
    });
    return merged;
}

function isPremontageName(value) {
    const raw = String(value || "").trim();
    if (!raw) return false;
    return /^[A-Za-zА-Яа-яІіЇїЄєҐґ][A-Za-zА-Яа-яІіЇїЄєҐґ0-9_*-]*(?:\s+[A-Za-zА-Яа-яІіЇїЄєҐґ0-9_*-]+)*$/.test(raw);
}
function getPremontageRows() { return searchData.filter(row => isPremontageName(row.station) && row.article); }
function getSearchRowsForFilters() {
    const materialFilters = selectedSearchFilters.filter(filter => ['wires', 'materials'].includes(filter));
    const sourceFilters = selectedSearchFilters.filter(filter => SEARCH_SOURCE_FILTERS.includes(filter));
    return searchData.filter(row => {
        const matchesMaterial = !materialFilters.length || materialFilters.some(filter => {
            if (filter === 'wires') return isWireMaterial(row.material);
            if (filter === 'materials') {
                const material = String(row.material || "").trim();
                const hasNote = String(row.colD || "").trim();
                return material && !/^158/.test(material) && ((/^152/.test(material) && Boolean(hasNote)) || !isWireMaterial(material));
            }
            return false;
        });
        const matchesSource = !sourceFilters.length || sourceFilters.some(filter => {
            if (filter === 'audi') return row.sourceGid === AUDI_GID;
            if (filter === 'bmw') return row.sourceGid === BMW_GID;
            return row.sourceGid === PREMONTAGE_AUDI_GID;
        });
        return matchesMaterial && matchesSource;
    });
}
function premontageArticleMatches(row, article) {
    if (!row || !article) return false;
    return expandArticleValue(row.article).includes(String(article).trim());
}
function computePremontageCategoriesForArticle(article) {
    const categories = new Set();
    getPremontageRows().forEach(row => {
        if (!premontageArticleMatches(row, article)) return;
        const name = String(row.station || "").trim();
        if (name) categories.add(name);
    });
    return [...categories].sort((a, b) => a.localeCompare(b, 'uk', { numeric: true, sensitivity: 'base' }));
}
function computeWiresForCategory(article, category) {
    const wantedCategory = String(category || "").trim().toLowerCase();
    return getPremontageRows().filter(row => premontageArticleMatches(row, article) && String(row.station || "").trim().toLowerCase() === wantedCategory);
}
function isWireMaterial(material) { return /^15[237]/.test(String(material || "").trim()); }
function getWireRowsForArticle(article) {
    return searchData.filter(row => {
        if (!expandArticleValue(row.article).includes(String(article).trim())) return false;
        if (isPremontageName(row.station)) return false;
        if (String(row.colD || "").trim()) return false;
        return isWireMaterial(row.material);
    });
}
function computeWireStationsForArticle(article) {
    const stations = new Set();
    getWireRowsForArticle(article).forEach(row => {
        const st = String(row.station || "").trim();
        if (st) stations.add(st);
    });
    return [...stations].sort((a, b) => a.localeCompare(b, 'uk', { numeric: true, sensitivity: 'base' }));
}
function computeWiresForStation(article, station) {
    const wanted = String(station || "").trim().toLowerCase();
    return getWireRowsForArticle(article).filter(row => String(row.station || "").trim().toLowerCase() === wanted);
}
function getAllMaterialsForArticle(article) { return searchData.filter(row => expandArticleValue(row.article).includes(String(article).trim())); }
function computeArticleActionResults(article, key) {
    const v = String(key || "").toLowerCase();
    return searchData.filter(x => {
        if (!expandArticleValue(x.article).includes(article)) return false;
        return x.colD.toLowerCase().startsWith(v);
    });
}

function articleHasAction(article, action) {
    if (action === 'список') return true;
    if (action === 'розміщення') return getAllMaterialsForArticle(article).length > 0;
    if (action === 'передмонтаж') return computePremontageCategoriesForArticle(article).length > 0;
    if (action === 'проводи') return computeWireStationsForArticle(article).length > 0;
    return computeArticleActionResults(article, action).length > 0;
}

function getAvailableActionsForArticle(article) {
    const cacheKey = String(article);
    if (_actionsCache[cacheKey]) return _actionsCache[cacheKey];
    const result = ARTICLE_ACTION_KEYS.filter(k => articleHasAction(article, k));
    _actionsCache[cacheKey] = result;
    return result;
}

function buildArticlesLevelHtml(stateIndex) {
    const state = articlesPageStack[stateIndex];
    if (!state) return '';
    let html = '';
    if (state.level === 'articles') {

        const articles = sortArticlesWithFavorites(articleGroups.map(g => g.article));
        if (!articles.length) { html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає даних</div>'; }

            });
            html += '</div>';
        }
    } else if (state.level === 'actions') {
        html += buildLevelHeadHtml(state.article, '');
        const available = getAvailableActionsForArticle(state.article);
        if (!available.length) { html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає даних для цього артикулу</div>'; }
        else {
            html += '<div class="premontage-btn-grid">';

            html += '</div>';
        }
    } else if (state.level === 'station-list') {
        const article = state.article;
        const cmpSt = (a, b) => String(a).localeCompare(String(b), 'uk', { numeric: true, sensitivity: 'base' });
        const rows = [];
        const seen = new Set();
        const add = (sortSt, kindLabel) => {
            const st = String(sortSt || '').trim();
            const id = [kindLabel, st].join('|');
            if (seen.has(id)) return;
            seen.add(id);
            rows.push({ station: st, kind: kindLabel });
        };
        getWireRowsForArticle(article).forEach(r => {
            const mat = String(r.material || '').trim();
            if (/^15[2378]/.test(mat)) {
                const st = String(r.station || '').trim();
                add(st, st ? 'ст. ' + st : 'Без станції');
            }
        });
        ['sp', 'ts'].forEach(action => {
            computeArticleActionResults(article, action).forEach(r => {
                const mat = String(r.material || '').trim();
                if (/^15[2378]/.test(mat)) {
                    const st = String(r.station || '').trim();
                    add(st, action.toUpperCase() + (st ? ' ст. ' + st : ''));
                }
            });
        });
        const allRows = getAllMaterialsForArticle(article);
        computePremontageCategoriesForArticle(article).forEach(category => {
            const shortName = premontageShortName(category).toLowerCase();
            const found = [];
            allRows.forEach(r => {
                if (isPremontageName(r.station)) return;
                const mat = String(r.material || '').toLowerCase();
                if (shortName && mat.includes(shortName) && /^15[2378]/.test(mat)) {
                    const st = String(r.station || '').trim();
                    if (st) found.push(st);
                }
            });
            const st = found.sort(cmpSt)[0] || '';
            add(st, 'Передмонтаж' + (st ? ' ст. ' + st : ''));
        });
        
        rows.sort((a, b) => {
            if (!a.station !== !b.station) return a.station ? -1 : 1;
            return a.station && b.station ? cmpSt(a.station, b.station) : 0;
        });

        if (!rows.length) {
            html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає матеріалів для цього артикулу</div>';
        } else {
            rows.forEach(r => {
                const key = [article, r.kind, r.station].join('|');
                const ek = escapeHtml(key);
                const saved = stationListValues[key] || { qty: '' };
                html += `
                    <div class="sl-station-card${saved.qty ? ' qty-target' : ''}" data-list-open="${ek}" data-list-key="${ek}">
                        <div class="sl-station-info">
                            <span class="sl-station-name">${escapeHtml(r.station ? 'Станція ' + r.station : 'Без станції')}</span>
                            <span class="sl-station-type">${escapeHtml(r.kind)}</span>
                        </div>
                        <div class="sl-station-right">
                            ${saved.qty ? `<span class="waitlist-qty">${escapeHtml(saved.qty)}</span>` : ''}
                        </div>
                    </div>
                `;
            });
        }
    } else if (state.level === 'results') {
        const rows = state.action === 'розміщення' ? getAllMaterialsForArticle(state.article) : computeArticleActionResults(state.article, state.action);
        html += '<div class="premontage-title"></div>';
        if (!rows.length) html += '<div style="text-align:center; padding:40px; color:#aaa;">Не знайдено</div>';
        else {
            html += '<div class="wire-list">';
            rows.forEach(x => {
                html += `<div class="wire-row"><span class="wire-name">${escapeHtml(x.material)}</span><span class="wire-code">${escapeHtml(x.station)}</span><span class="wire-location">${escapeHtml(x.address)}</span></div>`;
            });
            html += '</div>';
        }
    } else if (state.level === 'premontage-categories') {
        const categories = computePremontageCategoriesForArticle(state.article);
        html += '<div class="premontage-title"></div>';
        if (!categories.length) html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає передмонтажів</div>';
        else {
            html += '<div class="premontage-btn-grid">';
            categories.forEach(c => {
                html += `<button class="premontage-item-btn" data-anav="category" data-category="${escapeHtml(c)}" data-label="${escapeHtml(premontageShortName(c))}">${escapeHtml(premontageShortName(c))}</button>`;
            });
            html += '</div>';
        }
    } else if (state.level === 'premontage-wires') {
        const wires = computeWiresForCategory(state.article, state.category);
        html += '<div class="premontage-title"></div>';
        if (!wires.length) html += '<div style="text-align:center; padding:40px; color:#aaa;">Проводів не знайдено</div>';
        else {
            html += '<div class="wire-list">';
            wires.forEach(w => {
                html += `<div class="wire-row"><span class="wire-name">${escapeHtml(w.material)}</span><span class="wire-location">${escapeHtml(w.address)}</span></div>`;
            });
            html += '</div>';
        }
    } else if (state.level === 'wire-stations') {
        const stations = computeWireStationsForArticle(state.article);
        html += '<div class="premontage-title"></div>';
        if (!stations.length) html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає станцій</div>';
        else {
            html += '<div class="premontage-btn-grid">';
            stations.forEach(st => { html += `<button class="premontage-item-btn" data-anav="wire-station" data-station="${escapeHtml(st)}">Станція ${escapeHtml(st)}</button>`; });
            html += '</div>';
        }
    } else if (state.level === 'wire-results') {
        const wires = computeWiresForStation(state.article, state.station);
        html += '<div class="premontage-title"></div>';
        if (!wires.length) html += '<div style="text-align:center; padding:40px; color:#aaa;">Проводів не знайдено</div>';
        else {
            html += '<div class="wire-list">';
            wires.forEach(x => { html += `<div class="wire-row"><span class="wire-name">${escapeHtml(x.material)}</span><span class="wire-location">${escapeHtml(x.address)}</span></div>`; });
            html += '</div>';
        }
    }

    if (state.level !== 'articles' && state.level !== 'actions' && state.level !== 'station-list') {
        let right = '';
        if (state.level === 'results') right = plainActionName(state.action);
        else if (state.level === 'premontage-categories') right = plainActionName('передмонтаж');
        else if (state.level === 'premontage-wires') right = state.category || '';
        else if (state.level === 'wire-stations') right = plainActionName('проводи');
        else if (state.level === 'wire-results') right = state.station ? 'Станція ' + state.station : '';
        html = html.replace('<div class="premontage-title"></div>', '');
        html = buildLevelHeadHtml(state.article, right) + html;
    }
    return html;
}

function buildLevelHeadHtml(article, right) {
    const fav = isArticleFavorite(article);
    return `<div class="premontage-title level-head"><span class="level-head-main"><button class="select-btn${fav ? ' selected' : ''}" data-anav="article-favorite" data-article="${escapeHtml(article)}">${fav ? '★' : '☆'}</button><span class="level-head-left">${articleHeadHtml(article)}</span></span><span class="level-head-right">${escapeHtml(right)}</span></div>`;
}

function getArticleFullCode(base) {
    if (!_fullCodeMap) {
        _fullCodeMap = {};
        searchData.forEach(row => {
            String(row.article || "").split("/").map(normalizeArticlePart).forEach(p => {
                if (/^\d{7}/.test(p) && p.length > 7) {
                    const b = p.slice(0, 7);
                    if (!_fullCodeMap[b]) _fullCodeMap[b] = p;
                }
            });
        });
    }
    return _fullCodeMap[String(base)] || String(base);
}

function articleHeadHtml(article) {
    const full = getArticleFullCode(article), base = String(article);
    if (full.length > base.length && full.startsWith(base)) {
        return escapeHtml(base) + '<span class="level-head-tail">' + escapeHtml(full.slice(base.length)) + '</span>';
    }
    return escapeHtml(full);
}

function premontageShortName(full) {
    const f = String(full || "").trim();
    return f.replace(/\s*158\d+/g, "").trim() || f;
}
function uniqueDisplayStations(list) { return [...new Set([...list].map(st => isPremontageName(String(st)) ? premontageShortName(String(st)) : String(st)))] }
function plainActionName(key) {
    const k = String(key || "");
    if (k === 'sp' || k === 'ts' || k === 'стр' || k === 'мм') return k.toUpperCase();
    return k.charAt(0).toUpperCase() + k.slice(1);
}

function renderArticlesPage(forceRebuild) {
    renderArticlesDots();
    const container = document.getElementById('articles-page-content');
    if (!container) return;
    const idx = articlesPageStack.length - 1;
    const state = articlesPageStack[idx];
    let html = (!forceRebuild && state && state.cachedHtml) ? state.cachedHtml : buildArticlesLevelHtml(idx);
    if (state) state.cachedHtml = html;
    container.innerHTML = html;
}

articlesPageContent.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-anav]');
    if (!btn || pmQtyMode) return;
    const nav = btn.dataset.anav;
    const current = articlesPageStack[articlesPageStack.length - 1];
    
    if (nav === 'to-search') {
        const material = decodeURIComponent(btn.dataset.material || "");
        input.value = material; goToPage(SEARCH_PAGE_INDEX); search(); return;
    }
    if (nav === 'article-favorite') {
        toggleArticleFavorite(btn.dataset.article);
        articlesPageStack.forEach(st => { delete st.cachedHtml; });
        renderArticlesPage(true); return;
    }
    if (nav === 'article') {
        articlesPageStack.push({ level: 'actions', article: btn.dataset.article });
        renderArticlesPage(); return;
    }
    if (nav === 'action') {
        const action = btn.dataset.action;
        if (action === 'список') articlesPageStack.push({ level: 'station-list', article: current.article });
        else if (action === 'передмонтаж') articlesPageStack.push({ level: 'premontage-categories', article: current.article });
        else if (action === 'проводи') articlesPageStack.push({ level: 'wire-stations', article: current.article });
        else articlesPageStack.push({ level: 'results', article: current.article, action });
        renderArticlesPage(); return;
    }
    if (nav === 'category') {
        articlesPageStack.push({ level: 'premontage-wires', article: current.article, category: btn.dataset.category });
        renderArticlesPage(); return;
    }
    if (nav === 'wire-station') {
        articlesPageStack.push({ level: 'wire-results', article: current.article, station: btn.dataset.station });
        renderArticlesPage(); return;
    }
});

function search() {
    if (qtyMode) return;
    const v = input.value.toLowerCase();
    if (!v) { resultBox.innerHTML = ""; return; }
    const isNumOnly = /^\d+$/.test(v);
    const filtered = getSearchRowsForFilters().filter(x => {
        const material = String(x.material || "").toLowerCase();
        if (isNumOnly) return material.trimEnd().endsWith(v) || material.replace(/\D/g, "") === v;
        return material.startsWith(v);
    });
    if (!filtered.length) { resultBox.innerHTML = '<div style="text-align:center; padding:40px; color:#aaa;">Не знайдено</div>'; return; }
    let html = ""; searchCardKeys = []; searchResultLookup = {};
    const grouped = {};
    filtered.forEach(x => {
        const matKey = x.material + "|" + x.address;
        if (!grouped[matKey]) grouped[matKey] = {};
        if (!grouped[matKey][x.article]) grouped[matKey][x.article] = new Set();
        grouped[matKey][x.article].add(x.station);
    });
    for (let matKey in grouped) {
        const [matName, matAddr] = matKey.split("|");
        const matHtml = highlight(matName, v, isNumOnly);
        const mergedArticles = mergeAbbreviatedArticles(grouped[matKey]);
        const articlesPlain = {};
        for (let art in mergedArticles) articlesPlain[art] = [...mergedArticles[art]];
        searchResultLookup[matKey] = { material: matName, address: matAddr, articles: articlesPlain };
        const cardIdx = searchCardKeys.push(matKey) - 1;
        const selected = isInWaitlist(matKey);
        html += `<div class="result-card"><div class="result-top"><span class="result-material-badge"><button class="select-btn star-left${selected ? ' selected' : ''}" data-idx="${cardIdx}">${selected ? '★' : '☆'}</button><span class="box-icon ico">📦</span><button type="button" class="mat-pick" data-idx="${cardIdx}">${matHtml}</button></span><div style="display:flex; align-items:center; gap:8px;"><span class="result-address-new">${escapeHtml(matAddr)}</span><button class="select-btn star-right${selected ? ' selected' : ''}" data-idx="${cardIdx}">${selected ? '★' : '☆'}</button></div></div></div>`;
    }
    resultBox.innerHTML = html;
}

function goToPage(n) {
    n = Math.max(0, Math.min(TOTAL_PAGES - 1, n));
    if (n !== SEARCH_PAGE_INDEX) exitQtyMode();
    currentPage = n;
    pagesEl.style.transform = `translateX(-${n * pageWidthPercent}%)`;
    renderArticlesDots();
    if (n === SEARCH_PAGE_INDEX) { kbWrapper.classList.remove('hidden'); if (input.value) search(); }
    else {
        kbWrapper.classList.add('hidden');
        if (n === 0) renderWaitlistPage();
        else if (n === ARTICLES_PAGE_INDEX) renderArticlesPage();
    }
}

let pageDragStartX = 0, pageDragStartY = 0, pageDragBasePage = 0, pageDragging = false, pageMoved = false, pageDragPxWidth = 0, pageSwipeCandidate = false;
document.addEventListener('touchstart', e => {
    if (pmQtyMode || !e.touches || e.touches.length !== 1) return;
    const touch = e.touches[0];
    pageDragStartX = touch.clientX; pageDragStartY = touch.clientY; pageDragBasePage = currentPage;
    pageDragPxWidth = (pagesEl.parentElement ? pagesEl.parentElement.clientWidth : window.innerWidth) || window.innerWidth;
    pageDragging = true; pageMoved = false; pageSwipeCandidate = true;
}, { passive: true });

document.addEventListener('touchmove', e => {
    if (!pageDragging || !pageSwipeCandidate || !e.touches || e.touches.length !== 1) return;
    const touch = e.touches[0], dx = touch.clientX - pageDragStartX, dy = touch.clientY - pageDragStartY;
    if (!pageMoved) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (Math.abs(dy) > Math.abs(dx)) { pageDragging = false; pageSwipeCandidate = false; return; }
        pageMoved = true;
    }
    const limitedDx = Math.max(-pageDragPxWidth, Math.min(pageDragPxWidth, dx));
    let livePos = Math.max(0, Math.min(TOTAL_PAGES - 1, pageDragBasePage - limitedDx / pageDragPxWidth));
    pagesEl.style.transition = 'none';
    pagesEl.style.transform = `translateX(-${livePos * pageWidthPercent}%)`;
}, { passive: false });

document.addEventListener('touchend', e => {
    if (!pageDragging) return;
    const wasSwipe = pageMoved;
    pageDragging = false; pageSwipeCandidate = false;
    if (!wasSwipe) return;
    const dx = e.changedTouches && e.changedTouches.length ? e.changedTouches[0].clientX - pageDragStartX : 0;
    const SWIPE_THRESHOLD = Math.max(55, pageDragPxWidth * 0.20);
    let target = pageDragBasePage;
    if (Math.abs(dx) >= SWIPE_THRESHOLD) {
        target = Math.max(0, Math.min(TOTAL_PAGES - 1, pageDragBasePage + (dx > 0 ? -1 : 1)));
    }
    pagesEl.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
    goToPage(target);
}, { passive: true });

renderArticlesDots();
const instantStart = document.getElementById('instant-start');
if (instantStart) instantStart.remove();
}, 0));
</script>
