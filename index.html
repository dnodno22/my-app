<body>
<div id="pages">
    <!-- PAGE (waitlist): свайп управо від пошуку -->
    <div class="page" id="page-waitlist">
        <div class="search-header">

        </div>
        <div class="scroll-area">
            <div id="waitlist-result"></div>
        </div>
    </div>
    <!-- PAGE (search) -->
    <div class="page" id="page0">
        <div class="search-header">
            <input id="input" readonly>
        </div>
        <div class="scroll-area">
            <div id="result"></div>
        </div>
        <div id="kb-wrapper" class="kb-container">
            <div id="kb1" class="kb-grid">
                <button class="btn" data-v="1">1</button>
                <button class="btn" data-v="2">2</button>

                <button class="btn" data-v="5">5</button>
                <button class="btn" data-v="6">6</button>

    <!-- PAGE (артикули): свайп ліворуч від пошуку -->

</div>
<!-- КРАПОЧКИ ГЛИБИНИ (глобально: пошук + артикули) -->
<div class="articles-dots" id="articles-dots"></div>
<script>
/* ==================== ДЖЕРЕЛО ДАНИХ ==================== */
/* ==================== ВЕРСІЯ КОДУ ==================== */
const CODE_VERSION = 33;
const SPREADSHEET_ID = "1ii4oiQvbayKKN1tffS4X7WxH0NPZ0oiooaHPP6Ku6W8";
const SEARCH_GID = "1679964111";
/* ================================================================ */
/* Кеші для швидкодії */
const _expandCache = new Map();
let _actionsCache = {};
let TOTAL_PAGES = 3;
const SEARCH_PAGE_INDEX = 1;
const ARTICLES_PAGE_INDEX = 2;
let currentPage = SEARCH_PAGE_INDEX;
let searchData = [];
let pageWidthPercent = 100 / TOTAL_PAGES;
let articleGroups = [];
/* ==================== СТЕК РІВНІВ АРТИКУЛІВ ==================== */
let articlesPageStack = [
    { level: 'articles' }
];
const ARTICLE_ACTION_KEYS = [
    "розміщення",
    "sp",
    "ts",
    "стр",
    "мм",
    "передмонтаж",
    "проводи"
];
const ACTION_LABELS = {
    "розміщення": "📍 Розміщення",
    "sp": "🔩 SP",
    "ts": "🧷 TS",
    "стр": "📏 СТР",
    "мм": "📐 ММ",
    "передмонтаж": "🧵 Передмонтаж",
    "проводи": "⚡ Проводи"
};
function actionLabel(key) {
    return ACTION_LABELS[key] || escapeHtml(key);
}
/* ==================== ELEMENTS ==================== */
const input = document.getElementById('input');
const resultBox = document.getElementById('result');
const waitlistBox = document.getElementById('waitlist-result');
const kbWrapper = document.getElementById('kb-wrapper');
const pagesEl = document.getElementById('pages');
const articlesPageContent =
    document.getElementById('articles-page-content');
const articlesDots =
    document.getElementById('articles-dots');
const CACHE_KEY_SEARCH = "searchDataCSV";
const CACHE_KEY_SEARCH_TIME = "searchDataCSVTime";
/* ==================== КРАПОЧКИ ГЛИБИНИ ==================== */
function renderArticlesDots(overridePage, overrideDepth) {
    if (!articlesDots) return;
    /*
        overridePage / overrideDepth дозволяють показати крапочки
        "наперед" — просто щоб ПІД ЧАС самого свайпу (ще до того, як
        currentPage чи articlesPageStack реально зміняться) крапочки
        вже відображали стан, в який ми прямуємо. Так вони йдуть
        синхронно з переходом, а не з запізненням після нього.
    */
    const page =
        overridePage !== undefined
            ? overridePage
            : currentPage;
    /*
        Крапочки показуємо на сторінках "Пошук" і "Артикули".
        На "Обрані матеріали" їх немає.
    */
    if (
        page !== ARTICLES_PAGE_INDEX &&
        page !== SEARCH_PAGE_INDEX
    ) {
        articlesDots.style.display = 'none';
        articlesDots.innerHTML = '';
        return;
    }
    /*
        Кількість крапочок = кількість рівнів у стеку.
        1:
        Артикули
        2:
        Артикули → Артикул
        3:
        Артикули → Артикул → Дія
        4:
        Артикули → Артикул → Передмонтаж → Категорія
        і т.д.
    */
    /*
        Пошук завжди 1-а крапочка (перша сторінка).
        Панель артикулів = 2-а крапочка, кожен рівень углиб додає ще одну.
        Тому на сторінці артикулів: глибина стеку + 1.
    */
    let depth;
    if (page === SEARCH_PAGE_INDEX) {
        depth = 1;
    } else {
        depth =
            (
                overrideDepth !== undefined
                    ? overrideDepth
                    : articlesPageStack.length
            ) + 1;
    }
    if (depth <= 0) {
        articlesDots.style.display = 'none';
        articlesDots.innerHTML = '';
        return;
    }
    articlesDots.style.display = 'flex';
    let html = '';
    for (let i = 0; i < depth; i++) {
        let className = 'dot';
        /*
            Остання крапочка = поточний рівень.
        */
        if (i === depth - 1) {
            className += ' active';
        } else {
            className += ' past';
        }
        html += `<span class="${className}"></span>`;
    }
    articlesDots.innerHTML = html;
}
/* ==================== РОЗМІР СТОРІНОК ==================== */
const kbVersionEl = document.getElementById('kb-version');
if (kbVersionEl) {
    kbVersionEl.textContent = 'v' + CODE_VERSION;
}
document.querySelectorAll('.page').forEach(p => {
    p.style.width = pageWidthPercent + '%';
});
pagesEl.style.width = (TOTAL_PAGES * 100) + '%';
pagesEl.style.transform =
    `translateX(-${currentPage * pageWidthPercent}%)`;
/* ==================== АРТИКУЛИ ==================== */
function normalizeArticlePart(part) {
    return String(part || "")
        .trim()
        .replace(/\s+/g, "");
}
function getArticleBase(code) {
    if (/^\d{7}/.test(code) && code.length > 7) {
        return code.slice(0, 7);
    }
    return code;
}
function expandArticleValue(raw) {
    const k = String(raw || "");
    let r = _expandCache.get(k);
    if (r === undefined) {
        r = expandArticleValueRaw(k);
        _expandCache.set(k, r);
    }
    return r;
}
function expandArticleValueRaw(raw) {
    raw = String(raw || "").trim();
    if (!raw) return [];
    const parts = raw
        .split("/")
        .map(normalizeArticlePart)
        .filter(Boolean);
    if (!parts.length) return [];
    if (parts.length === 1) {
        return [getArticleBase(parts[0])];
    }
    const first = getArticleBase(parts[0]);
    const result = [first];
    let prefix = "";
    if (/^\d+$/.test(first) && first.length >= 3) {
        prefix = first.slice(0, -3);
    }
    for (let i = 1; i < parts.length; i++) {
        const part = parts[i];
        if (/^\d{1,3}$/.test(part) && prefix) {
            result.push(
                prefix + part.padStart(3, "0")
            );
        } else {
            result.push(
                getArticleBase(part)
            );
        }
    }
    return [...new Set(result)];
}
/* ==================== ГРУПУВАННЯ ==================== */
function computeArticleGroups() {
    const groups = {};
    searchData.forEach(row => {
        const articles =
            expandArticleValue(row.article);
        articles.forEach(article => {
            if (!article) return;
            if (!groups[article]) {
                groups[article] = [];
            }
            groups[article].push(row);
        });
    });
    Object.keys(groups).forEach(article => {
        const seen = new Set();
        groups[article] =
            groups[article].filter(row => {
                const key = [
                    row.station,
                    row.material,
                    row.article,
                    row.colD,
                    row.address
                ].join("|||");
                if (seen.has(key)) {
                    return false;
                }
                seen.add(key);
                return true;
            });
    });
    const keys =
        Object.keys(groups).sort((a, b) =>
            a.localeCompare(
                b,
                "uk",
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
        );
    return keys.map(article => ({
        article,
        rows: groups[article]
    }));
}
/* ==================== ОБРАНІ АРТИКУЛИ ==================== */

/* ==================== HTML ESCAPE ==================== */
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
function highlight(text, v, fromEnd) {
    const safe = escapeHtml(text);
    if (!v) return safe;
    const lower =
        text.toLowerCase();
    if (fromEnd) {
        if (!lower.endsWith(v)) {
            return safe;
        }
        const idx =
            text.length - v.length;
        return escapeHtml(
            text.slice(0, idx)
        )
        +
        '<mark class="hl">' +
        escapeHtml(text.slice(idx)) +
        '</mark>';
    } else {
        if (!lower.startsWith(v)) {
            return safe;
        }
        return '<mark class="hl">' +
            escapeHtml(text.slice(0, v.length)) +
            '</mark>' +
            escapeHtml(text.slice(v.length));
    }
}

const STATIONS_PER_LINE = 5;
function buildStationsHtml(stationHtmlArr) {
    const lines = [];
    for (
        let i = 0;
        i < stationHtmlArr.length;
        i += STATIONS_PER_LINE
    ) {
        lines.push(
            stationHtmlArr
                .slice(i, i + STATIONS_PER_LINE)
                .join(" | ")
        );
    }
    return lines.join("<br>");
}
/* ==================== НОМЕР АРТИКУЛУ ==================== */
function renderArticleNumber(
    art,
    v,
    isNumOnly,
    isSpecialSearch
) {
    let matchStart = -1;
    let matchEnd = -1;
    if (!isSpecialSearch && v) {
        const lower =
            art.toLowerCase();
        if (isNumOnly) {
            if (lower.endsWith(v)) {
                matchStart =
                    art.length - v.length;
                matchEnd =
                    art.length;
            }
        } else {
            if (lower.startsWith(v)) {
                matchStart = 0;
                matchEnd = v.length;
            }
        }
    }
    function part(s, e) {
        const str = art.slice(s, e);
        if (matchStart === -1) {
            return escapeHtml(str);
        }
        const overlapStart =
            Math.max(s, matchStart);
        const overlapEnd =
            Math.min(e, matchEnd);
        if (overlapStart >= overlapEnd) {
            return escapeHtml(str);
        }
        let out = '';
        if (overlapStart > s) {
            out += escapeHtml(
                art.slice(s, overlapStart)
            );
        }
        out +=
            '<mark class="hl">' +
            escapeHtml(
                art.slice(
                    overlapStart,
                    overlapEnd
                )
            ) +
            '</mark>';
        if (overlapEnd < e) {
            out += escapeHtml(
                art.slice(overlapEnd, e)
            );
        }
        return out;
    }
    const len = art.length;
    if (len <= 4) {
        return `<span class="art-g1">${part(0, len)}</span>`;
    }
    const g1end =
        Math.min(4, len);
    const g2end =
        Math.min(7, len);
    let html =
        `<span class="art-g1">${part(0, g1end)}</span>`;
    if (len > 4) {
        html +=
            `<span class="art-g2">${part(g1end, g2end)}</span>`;
    }
    if (len > 7) {
        html +=
            `<span class="art-g3">${part(g2end, len)}</span>`;
    }
    return html;
}

/* ==================== MERGE ARTICLE ==================== */
function mergeAbbreviatedArticles(articleMap) {
    const arts =
        Object.keys(articleMap);
    const fullArts =
        arts.filter(
            a => a.length > 3
        );
    const shortArts =
        arts.filter(
            a => a.length <= 3
        );
    if (!shortArts.length) {
        return articleMap;
    }
    const fullByLast3 = {};
    fullArts.forEach(a => {
        const last3 =
            a.slice(-3);
        if (!fullByLast3[last3]) {
            fullByLast3[last3] = a;
        }
    });
    const merged = {};
    fullArts.forEach(a => {
        merged[a] =
            new Set(articleMap[a]);
    });
    shortArts.forEach(shortArt => {
        const target =
            fullByLast3[shortArt];
        if (target) {
            articleMap[shortArt]
                .forEach(st =>
                    merged[target].add(st)
                );
        } else {
            if (!merged[shortArt]) {
                merged[shortArt] =
                    new Set();
            }
            articleMap[shortArt]
                .forEach(st =>
                    merged[shortArt].add(st)
                );
        }
    });
    return merged;
}

let _fullCodeMap = null;
function getArticleFullCode(base) {
    if (!_fullCodeMap) {
        _fullCodeMap = {};
        searchData.forEach(row => {
            String(row.article || "")
                .split("/")
                .map(normalizeArticlePart)
                .forEach(p => {
                    if (
                        /^\d{7}/.test(p) &&
                        p.length > 7
                    ) {
                        const b = p.slice(0, 7);
                        if (!_fullCodeMap[b]) {
                            _fullCodeMap[b] = p;
                        }
                    }
                });
        });
    }
    return _fullCodeMap[String(base)] || String(base);
}
function articleHeadHtml(article) {
    const full = getArticleFullCode(article);
    const base = String(article);
    if (
        full.length > base.length &&
        full.startsWith(base)
    ) {
        return escapeHtml(base) +
            '<span class="level-head-tail">' +
            escapeHtml(full.slice(base.length)) +
            '</span>';
    }
    return escapeHtml(full);
}
function plainActionName(key) {
    const k = String(key || "");
    if (k === 'sp' || k === 'ts') {
        return k.toUpperCase();
    }
    if (k === 'стр' || k === 'мм') {
        return k.toUpperCase();
    }
    return k.charAt(0).toUpperCase() + k.slice(1);
}

            renderArticlesPage();
            return;
        }
    }
);
/* ==================== ПОШУК ==================== */
function search() {
    const v =
        input.value.toLowerCase();
    if (!v) {
        resultBox.innerHTML = "";
        return;
    }
    const isNumOnly =
        /^\d+$/.test(v);
    const isSpecialSearch =
        v.includes("стр") ||
        v.includes("мм") ||
        v.includes("ts");
    const filtered =
        searchData.filter(x => {
            if (isSpecialSearch) {
                return x.colD
                    .toLowerCase()
                    .startsWith(v);
            }
            if (isNumOnly) {
                return (
                    x.station
                        .toLowerCase()
                        .endsWith(v)
                    ||
                    x.material
                        .toLowerCase()
                        .endsWith(v)
                    ||
                    String(x.material || "")
                        .replace(/\D/g, "") === v
                    ||
                    x.article
                        .toLowerCase()
                        .endsWith(v)
                    ||
                    x.colD
                        .toLowerCase()
                        .endsWith(v)
                    ||
                    x.address
                        .toLowerCase()
                        .endsWith(v)
                );
            }
            return (
                x.station
                    .toLowerCase()
                    .startsWith(v)
                ||
                x.material
                    .toLowerCase()
                    .startsWith(v)
                ||
                x.article
                    .toLowerCase()
                    .startsWith(v)
                ||
                x.colD
                    .toLowerCase()
                    .startsWith(v)
                ||
                x.address
                    .toLowerCase()
                    .startsWith(v)
            );
        });
    if (!filtered.length) {
        resultBox.innerHTML =
            '<div style="text-align:center; padding:40px; color:#aaa;">Не знайдено</div>';
        return;
    }
    let html = "";
    searchCardKeys = [];
    searchResultLookup = {};
    const grouped = {};
    filtered.forEach(x => {
        const matKey =
            x.material +
            "|" +
            x.address;
        if (!grouped[matKey]) {
            grouped[matKey] = {};
        }
        if (
            !grouped[matKey][x.article]
        ) {
            grouped[matKey][x.article] =
                new Set();
        }
        grouped[matKey][x.article]
            .add(x.station);
    });
    for (
        let matKey in grouped
    ) {
        const [
            matName,
            matAddr
        ] =
            matKey.split("|");
        const matHtml =
            isSpecialSearch
                ? escapeHtml(matName)
                : highlight(
                    matName,
                    v,
                    isNumOnly
                );
        const addrHtml =
            isSpecialSearch
                ? escapeHtml(matAddr)
                : highlight(
                    matAddr,
                    v,
                    isNumOnly
                );
        const mergedArticles =
            mergeAbbreviatedArticles(
                grouped[matKey]
            );
        const articlesPlain = {};
        for (
            let art in mergedArticles
        ) {
            articlesPlain[art] =
                [...mergedArticles[art]];
        }
        searchResultLookup[matKey] = {
            material: matName,
            address: matAddr,
            articles: articlesPlain
        };
        const cardIdx =
            searchCardKeys.push(
                matKey
            ) - 1;
        const selected =
            isInWaitlist(
                matKey
            );
        html += `
            <div class="result-card">
                <div class="result-top">
                    <span class="result-material-badge">
                        <span class="box-icon">📦</span>
                        ${matHtml}
                    </span>
                    <div
                        style="display:flex; align-items:center; gap:8px;">
                        <span class="result-address-new">
                            ${addrHtml}
                        </span>
                        <button
                            class="select-btn${selected ? ' selected' : ''}"
                            data-idx="${cardIdx}">
                            ${selected ? '★' : '☆'}
                        </button>
                    </div>
                </div>
        `;
        for (
            let art in mergedArticles
        ) {
            const artHtml =
                renderArticleNumber(
                    art,
                    v,
                    isNumOnly,
                    isSpecialSearch
                );
            const stationHtmlArr =
                [...mergedArticles[art]]
                    .map(st =>
                        isSpecialSearch
                            ? escapeHtml(st)
                            : highlight(
                                st,
                                v,
                                isNumOnly
                            )
                    );
            const stationsHtml =
                buildStationsHtml(
                    stationHtmlArr
                );
            html += `
                <div class="article-row">
                    <span class="article-number">
                        ${artHtml}
                    </span>
                    <span class="article-stations">
                        ${stationsHtml}
                    </span>
                </div>
            `;
        }
        html +=
            `</div>`;
    }
    resultBox.innerHTML =
        html;
}
/* ==================== ДАТА ==================== */
function formatDate(ts) {
    const d =
        new Date(
            parseInt(
                ts,
                10
            )
        );
    const pad =
        n =>
            String(n)
                .padStart(2, '0');
    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/* ==================== ПЕРЕХІД МІЖ ГОЛОВНИМИ СТОРІНКАМИ ==================== */
function goToPage(n) {
    n =
        Math.max(
            0,
            Math.min(
                TOTAL_PAGES - 1,
                n
            )
        );
    currentPage = n;
    pagesEl.style.transform =
        `translateX(-${n * pageWidthPercent}%)`;
    /*
        Оновлюємо крапочки тут також.
        Це гарантує, що коли залишаємо сторінку
        "Артикули", вони одразу зникають.
    */
    renderArticlesDots();
    if (
        n === SEARCH_PAGE_INDEX
    ) {
        kbWrapper.classList.remove(
            'hidden'
        );
    } else {
        kbWrapper.classList.add(
            'hidden'
        );
        if (n === 0) {
            renderWaitlistPage();
        } else if (
            n === ARTICLES_PAGE_INDEX
        ) {
            renderArticlesPage();
        }
    }
}
/* ==================== ГОРИЗОНТАЛЬНИЙ СВАЙП ==================== */
let pageDragStartX = 0;
let pageDragStartY = 0;
let pageDragBasePage = 0;
let pageDragging = false;
let pageMoved = false;
let pageDragPxWidth = 0;
let pageSwipeCandidate = false;
let suppressNextClick = false;
/*
    ЗБІЛЬШЕНО з 14 до 24: дрейф пальця при звичайному натисканні
    більше не сприймається як початок свайпу.
*/
const PAGE_SWIPE_START_PX = 24;
function finishPageDrag(dx) {
    const SWIPE_THRESHOLD =
        Math.max(
            55,
            pageDragPxWidth * 0.20
        );
    const pageArticlesEl =
        document.getElementById(
            'page-articles'
        );
    /*
        ВНУТРІШНЯ НАВІГАЦІЯ АРТИКУЛІВ
    */
    if (
        pageDragBasePage === ARTICLES_PAGE_INDEX &&
        articlesPageStack.length > 1
    ) {
        const wrapper =
            document.getElementById(
                'articles-drag-wrapper'
            );
        if (!wrapper) {
            if (pageArticlesEl) {
                pageArticlesEl.classList.remove(
                    'articles-swiping'
                );
            }
            renderArticlesPage();
            return;
        }
        let settled = false;
        const settle = (goBack) => {
            if (settled) return;
            settled = true;
            if (pageArticlesEl) {
                pageArticlesEl.classList.remove(
                    'articles-swiping'
                );
            }
            if (goBack) {
                popArticlesPageLevel();
            } else {
                renderArticlesPage();
            }
        };
        wrapper.style.transition =
            'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
        /*
            Крапочки оновлюємо ВІДРАЗУ, в момент прийняття рішення —
            ще до того, як почалась/завершилась сама анімація зсуву.
            Інакше вони чекали б на transitionend (чи й цілих 400мс
            запасного таймауту) і помітно відставали б від переходу.
        */
        const willGoBack =
            dx >= SWIPE_THRESHOLD;
        renderArticlesDots(
            ARTICLES_PAGE_INDEX,
            willGoBack
                ? articlesPageStack.length - 1
                : articlesPageStack.length
        );
        if (
            willGoBack
        ) {
            wrapper.style.transform =
                'translateX(0px)';
            const onDone = (ev) => {
                if (
                    ev &&
                    ev.target !== wrapper
                ) {
                    return;
                }
                wrapper.removeEventListener(
                    'transitionend',
                    onDone
                );
                settle(true);
            };
            wrapper.addEventListener(
                'transitionend',
                onDone
            );
            setTimeout(
                () => settle(true),
                400
            );
        } else {
            wrapper.style.transform =
                `translateX(-${pageDragPxWidth}px)`;
            const onCancel = (ev) => {
                if (
                    ev &&
                    ev.target !== wrapper
                ) {
                    return;
                }
                wrapper.removeEventListener(
                    'transitionend',
                    onCancel
                );
                settle(false);
            };
            wrapper.addEventListener(
                'transitionend',
                onCancel
            );
            setTimeout(
                () => settle(false),
                400
            );
        }
        return;
    }
    let target =
        pageDragBasePage;
    if (
        Math.abs(dx) >=
        SWIPE_THRESHOLD
    ) {
        const dir =
            dx > 0 ? -1 : 1;
        target =
            Math.max(
                0,
                Math.min(
                    TOTAL_PAGES - 1,
                    pageDragBasePage + dir
                )
            );
    }
    pagesEl.style.transition =
        'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
    currentPage = target;
    pagesEl.style.transform =
        `translateX(-${target * pageWidthPercent}%)`;
    /*
        Оновлення крапочок після завершення свайпу.
    */
    renderArticlesDots();
    if (
        target === SEARCH_PAGE_INDEX
    ) {
        kbWrapper.classList.remove(
            'hidden'
        );
    } else {
        kbWrapper.classList.add(
            'hidden'
        );
        if (target === 0) {
            renderWaitlistPage();
        } else if (
            target === ARTICLES_PAGE_INDEX
        ) {
            renderArticlesPage();
        }
    }
}
/* ==================== TOUCH START ==================== */
document.addEventListener(
    'touchstart',
    e => {
        if (
            !e.touches ||
            e.touches.length !== 1
        ) {
            return;
        }
        const touch =
            e.touches[0];
        pageDragStartX =
            touch.clientX;
        pageDragStartY =
            touch.clientY;
        pageDragBasePage =
            currentPage;
        pageDragPxWidth =
            (
                pagesEl.parentElement
                    ? pagesEl.parentElement.clientWidth
                    : window.innerWidth
            ) ||
            window.innerWidth;
        pageDragging = true;
        pageMoved = false;
        pageSwipeCandidate = true;
    },
    {
        passive: true
    }
);
/* ==================== TOUCH MOVE ==================== */
document.addEventListener(
    'touchmove',
    e => {
        if (
            !pageDragging ||
            !pageSwipeCandidate ||
            !e.touches ||
            e.touches.length !== 1
        ) {
            return;
        }
        const touch =
            e.touches[0];
        const dx =
            touch.clientX -
            pageDragStartX;
        const dy =
            touch.clientY -
            pageDragStartY;
        if (!pageMoved) {
            const absX =
                Math.abs(dx);
            const absY =
                Math.abs(dy);
            if (
                Math.max(
                    absX,
                    absY
                ) < PAGE_SWIPE_START_PX
            ) {
                return;
            }
            if (
                absY > absX
            ) {
                pageDragging = false;
                pageSwipeCandidate =
                    false;
                return;
            }
            pageMoved = true;
            try {
                e.preventDefault();
            } catch (_) {}
            if (
                pageDragBasePage !== ARTICLES_PAGE_INDEX ||
                articlesPageStack.length <= 1
            ) {
                pagesEl.style.transition =
                    'none';
            } else {
                const contentW =
                    articlesPageContent.clientWidth ||
                    pageDragPxWidth;
                pageDragPxWidth =
                    contentW;
                const prevState =
                    articlesPageStack[
                        articlesPageStack.length - 2
                    ];
                const prevHtml =
                    (
                        prevState &&
                        prevState.cachedHtml
                    )
                        ? prevState.cachedHtml
                        : buildArticlesLevelHtml(
                            articlesPageStack.length - 2
                        );
                if (
                    prevState &&
                    !prevState.cachedHtml
                ) {
                    prevState.cachedHtml =
                        prevHtml;
                }
                const wrapper =
                    document.createElement(
                        'div'
                    );
                wrapper.className =
                    'articles-drag-wrapper';
                wrapper.id =
                    'articles-drag-wrapper';
                const prevPane =
                    document.createElement(
                        'div'
                    );
                prevPane.className =
                    'articles-drag-pane';
                prevPane.innerHTML =
                    prevHtml;
                const currentPane =
                    document.createElement(
                        'div'
                    );
                currentPane.className =
                    'articles-drag-pane';
                while (
                    articlesPageContent.firstChild
                ) {
                    currentPane.appendChild(
                        articlesPageContent.firstChild
                    );
                }
                wrapper.appendChild(
                    prevPane
                );
                wrapper.appendChild(
                    currentPane
                );
                articlesPageContent.appendChild(
                    wrapper
                );
                const pageArticlesEl =
                    document.getElementById(
                        'page-articles'
                    );
                if (pageArticlesEl) {
                    pageArticlesEl.classList.add(
                        'articles-swiping'
                    );
                }
                wrapper.style.transition =
                    'none';
                wrapper.style.transform =
                    `translateX(-${pageDragPxWidth}px)`;
            }
        } else {
            try {
                e.preventDefault();
            } catch (_) {}
        }
        const maxDelta =
            pageDragPxWidth;
        const limitedDx =
            Math.max(
                -maxDelta,
                Math.min(
                    maxDelta,
                    dx
                )
            );
        if (
            pageDragBasePage === ARTICLES_PAGE_INDEX &&
            articlesPageStack.length > 1
        ) {
            const wrapper =
                document.getElementById(
                    'articles-drag-wrapper'
                );
            if (!wrapper) return;
            const visualDx =
                Math.max(
                    0,
                    Math.min(
                        pageDragPxWidth,
                        limitedDx
                    )
                );
            wrapper.style.transition =
                'none';
            wrapper.style.transform =
                `translateX(${visualDx - pageDragPxWidth}px)`;
            /*
                Крапочки "йдуть за пальцем" ще під час самого свайпу —
                так зміна помітна ще швидше, ніж сам перехід.
            */
            const liveThreshold =
                Math.max(
                    55,
                    pageDragPxWidth * 0.20
                );
            renderArticlesDots(
                ARTICLES_PAGE_INDEX,
                visualDx >= liveThreshold
                    ? articlesPageStack.length - 1
                    : articlesPageStack.length
            );
            return;
        }
        let livePos =
            pageDragBasePage -
            limitedDx /
            pageDragPxWidth;
        livePos =
            Math.max(
                0,
                Math.min(
                    TOTAL_PAGES - 1,
                    livePos
                )
            );
        pagesEl.style.transform =
            `translateX(-${livePos * pageWidthPercent}%)`;
        renderArticlesDots(
            Math.round(livePos)
        );
    },
    {
        passive: false
    }
);
/* ==================== TOUCH END ==================== */
document.addEventListener(
    'touchend',
    e => {
        if (!pageDragging) {
            return;
        }
        const wasSwipe =
            pageMoved;
        pageDragging = false;
        pageSwipeCandidate =
            false;
        if (!wasSwipe) {
            if (
                currentPage === SEARCH_PAGE_INDEX &&
                !kbWrapper.contains(
                    e.target
                ) &&
                !e.target.closest(
                    '.select-btn'
                ) &&
                !e.target.closest(
                    '[data-anav]'
                )
            ) {
                kbWrapper.classList.toggle(
                    'hidden'
                );
            }
            /*
                Швидкий тап: виконуємо клік ОДРАЗУ на touchend,
                не чекаючи окремого синтетичного "click" від браузера
                (той приходить із помітною затримкою). Справжній
                наступний click від цього ж тапу гасимо нижче —
                інакше дія виконалась би двічі.
            */
            const tappable =
                e.target.closest(
                    'button, [data-anav]'
                );
            if (tappable) {
                tappable.click();
                suppressNextClick = true;
                setTimeout(
                    () => {
                        suppressNextClick = false;
                    },
                    400
                );
            }
            return;
        }
        const changedTouch =
            e.changedTouches &&
            e.changedTouches.length
                ? e.changedTouches[0]
                : null;
        const dx =
            changedTouch
                ? changedTouch.clientX -
                  pageDragStartX
                : 0;
        suppressNextClick = true;
        finishPageDrag(dx);
        setTimeout(
            () => {
                suppressNextClick = false;
            },
            400
        );
    },
    {
        passive: true
    }
);
/* ==================== TOUCH CANCEL ==================== */
/*
    Якщо браузер сам скасував жест (наприклад, перехопив скрол),
    скидаємо стан, щоб не лишалось "зависшого" свайпу.
*/
document.addEventListener(
    'touchcancel',
    () => {
        pageDragging = false;
        pageSwipeCandidate = false;
        if (pageMoved) {
            pageMoved = false;
            finishPageDrag(0);
        }
    },
    {
        passive: true
    }
);
/* ==================== БЛОКУВАННЯ CLICK ПІСЛЯ SWIPE ==================== */
document.addEventListener(
    'click',
    e => {
        /*
            Наш власний click() з touchend (isTrusted === false)
            ніколи не гасимо — тільки справжній клік від браузера.
        */
        if (!e.isTrusted) {
            return;
        }
        if (!suppressNextClick) {
            return;
        }
        suppressNextClick = false;
        e.preventDefault();
        e.stopPropagation();
    },
    true
);
/* ==================== ХОВАННЯ КЛАВІАТУРИ ПРИ СКРОЛІ ==================== */
const scrollAreaEl =
    document.querySelector(
        '#page0 .scroll-area'
    );
let resultStartY = 0;
scrollAreaEl.addEventListener(
    'touchstart',
    (e) => {
        resultStartY =
            e.touches[0].clientY;
    },
    {
        passive: true
    }
);
scrollAreaEl.addEventListener(
    'touchmove',
    (e) => {
        if (
            kbWrapper.classList.contains(
                'hidden'
            )
        ) {
            return;
        }
        const dy =
            e.touches[0].clientY -
            resultStartY;
        if (dy < -8) {
            kbWrapper.classList.add(
                'hidden'
            );
        }
    },
    {
        passive: true
    }
);
scrollAreaEl.addEventListener(
    'scroll',
    () => {
        if (
            scrollAreaEl.scrollTop > 4 &&
            !kbWrapper.classList.contains(
                'hidden'
            )
        ) {
            kbWrapper.classList.add(
                'hidden'
            );
        }
    },
    {
        passive: true
    }
);
/* ==================== ПЕРВИННИЙ СТАН КРАПОЧОК ==================== */
renderArticlesDots();
</script>
