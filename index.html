articlesPageContent.addEventListener(
    'click',
    (e) => {
        const btn =
            e.target.closest(
                '[data-anav]'
            );
        if (!btn) return;
        /* Поки відкрита клавіатура кількості — звичайні тапи ігноруємо */
        if (pmQtyMode) return;
        const nav =
            btn.dataset.anav;
        const current =
            articlesPageStack[
                articlesPageStack.length - 1
            ];
        /* ---------- ПЕРЕМИКАЧІ РОЗМІЩЕННЯ ---------- */
        if (
            nav === 'toggle-shared' ||
            nav === 'toggle-qty'
        ) {
            if (
                current &&
                current.level === 'results'
            ) {
                if (nav === 'toggle-shared') {
                    current.shared =
                        !current.shared;
                } else {
                    current.sortQty =
                        !current.sortQty;
                }
                renderArticlesPage(true);
            }
            return;
        }
        /* ---------- ДО ПОШУКУ ---------- */
        if (nav === 'to-search') {
            const material =
                decodeURIComponent(
                    btn.dataset.material || ""
                );
            input.value =
                material;
            goToPage(
                SEARCH_PAGE_INDEX
            );
            search();
            return;
        }
        /* ---------- ОБРАНЕ ---------- */
        if (
            nav === 'article-favorite'
        ) {
            toggleArticleFavorite(
                btn.dataset.article
            );
            articlesPageStack.forEach(st => {
                delete st.cachedHtml;
            });
            renderArticlesPage(
                true
            );
            return;
        }
        /* ---------- АРТИКУЛ ---------- */
        if (nav === 'article') {
            articlesPageStack.push({
                level: 'actions',
                article: btn.dataset.article
            });
            renderArticlesPage();
            return;
        }
        /* ---------- ДІЯ ---------- */
        if (nav === 'action') {
            const action =
                btn.dataset.action;
            if (action === 'список') {
                articlesPageStack.push({
                    level: 'station-list',
                    article: current.article
                });
            } else if (
                action === 'передмонтаж'
            ) {
                articlesPageStack.push({
                    level: 'premontage-categories',
                    article: current.article
                });
            } else if (
                action === 'проводи'
            ) {
                articlesPageStack.push({
                    level: 'wire-stations',
                    article: current.article
                });
            } else {
                articlesPageStack.push({
                    level: 'results',
                    article: current.article,
                    action
                });
            }
            renderArticlesPage();
            return;
        }
        /* ---------- КАТЕГОРІЯ ---------- */
        if (nav === 'category') {
            articlesPageStack.push({
                level: 'premontage-wires',
                article: current.article,
                category: btn.dataset.category
            });
            renderArticlesPage();
            return;
        }
        /* ---------- СТАНЦІЯ ПРОВОДУ ---------- */
        if (nav === 'wire-station') {
            articlesPageStack.push({
                level: 'wire-results',
                article: current.article,
                station: btn.dataset.station
            });
            renderArticlesPage();
            return;
        }
    }
);
/* ==================== ПОШУК (тільки по колонці B — матеріал) ==================== */
function search() {
    if (qtyMode) return;
    if (pmQtyMode && pmQtySource === 'search') return;
    const v =
        input.value.toLowerCase();
    if (!v) {
        resultBox.innerHTML = "";
        return;
    }
    const isNumOnly =
        /^\d+$/.test(v);
    const isSpecialSearch = false;
    const filtered =
        getSearchRowsForFilters().filter(x => {
            const material =
                String(x.material || "")
                    .toLowerCase();
            if (isNumOnly) {
                /* Тільки збіг з кінця; пробіли наприкінці клітинки не рахуються */
                return (
                    material.trimEnd().endsWith(v) ||
                    material.replace(/\D/g, "") === v
                );
            }
            return material.startsWith(v);
        });
    if (!filtered.length) {
        resultBox.innerHTML =
            '<div style="text-align:center; padding:40px; color:#aaa;">Не знайдено</div>';
        return;
    }
    let html = "";
    searchCardKeys = [];
    searchResultLookup = {};
    const grouped = {};
    filtered.forEach(x => {
        const matKey =
            x.material +
            "|" +
            x.address;
        if (!grouped[matKey]) {
            grouped[matKey] = {};
        }
        if (
            !grouped[matKey][x.article]
        ) {
            grouped[matKey][x.article] =
                new Set();
        }
        grouped[matKey][x.article]
            .add(x.station);
    });
    for (
        let matKey in grouped
    ) {
        const [
            matName,
            matAddr
        ] =
            matKey.split("|");

        const matHtml =
            highlight(
                matName,
                v,
                isNumOnly
            );
        const addrHtml =
            escapeHtml(matAddr);
        const mergedArticles =
            mergeAbbreviatedArticles(
                grouped[matKey]
            );
        const articlesPlain = {};
        for (
            let art in mergedArticles
        ) {
            articlesPlain[art] =
                [...mergedArticles[art]];
        }
        searchResultLookup[matKey] = {
            material: matName,
            address: matAddr,
            articles: articlesPlain
        };
        const cardIdx =
            searchCardKeys.push(
                matKey
            ) - 1;
        const selected =
            isInWaitlist(
                matKey
            );
        html += `
            <div class="result-card">
                <div class="result-top">
                    <span class="result-material-badge">
                        <button
                            class="select-btn star-left${selected ? ' selected' : ''}"
                            data-idx="${cardIdx}">
                            ${selected ? '★' : '☆'}
                        </button>
                        <span class="box-icon ico">📦</span>
                        <button
                            type="button"
                            class="mat-pick"
                            data-idx="${cardIdx}">${matHtml}</button>${
                        (() => {
                            const wlQ =
                                (loadWaitlist().find(
                                    i => i.key === matKey
                                ) || {}).qty;
                            return wlQ
                                ? `<span class="pm-qty-badge">${escapeHtml(wlQ)}</span>`
                                : '';
                        })()
                    }
                    </span>
                    <div
                        style="display:flex; align-items:center; gap:8px;">
                        <span class="result-address-new">
                            ${addrHtml}
                        </span>
                        <button
                            class="select-btn star-right${selected ? ' selected' : ''}"
                            data-idx="${cardIdx}">
                            ${selected ? '★' : '☆'}
                        </button>
                    </div>
                </div>
        `;
        for (
            let art in mergedArticles
        ) {
            if (
                !String(art).trim() &&
                Object.keys(mergedArticles).some(a => String(a).trim())
            ) {
                /* Той самий матеріал і адреса вже показані з артикулом */
                continue;
            }
            const artHtml =
                renderArticleNumber(
                    art,
                    v,
                    isNumOnly,
                    true,
                    true
                );
            const stationHtmlArr =
                uniqueDisplayStations(
                    mergedArticles[art]
                )
                    .map(st => escapeHtml(st));
            const stationsHtml =
                buildStationsHtml(
                    stationHtmlArr
                );
            html += `
                <div class="article-row">
                    <span class="article-number">
                        ${artHtml}
                    </span>
                    <span class="article-stations">
                        ${stationsHtml}
                    </span>
                </div>
            `;
        }
        html +=
            `</div>`;
    }
    resultBox.innerHTML =
        html;
}
/* ==================== ДАТА ==================== */
function formatDate(ts) {
    const d =
        new Date(
            parseInt(
                ts,
                10
            )
        );
    const pad =
        n =>
            String(n)
                .padStart(2, '0');
    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/* ==================== ПЕРЕХІД МІЖ ГОЛОВНИМИ СТОРІНКАМИ ==================== */
function goToPage(n) {
    exitPmQtyMode(false);
    setWaitlistLogOpen(false);
    n =
        Math.max(
            0,
            Math.min(
                TOTAL_PAGES - 1,
                n
            )
        );
    if (n !== SEARCH_PAGE_INDEX) {
        exitQtyMode();
    }
    currentPage = n;
    pagesEl.style.transform =
        `translateX(-${n * pageWidthPercent}%)`;
    /*
        Оновлюємо крапочки тут також.
        Це гарантує, що коли залишаємо сторінку
        "Артикули", вони одразу зникають.
    */
    renderArticlesDots();
    if (
        n === SEARCH_PAGE_INDEX
    ) {
        kbWrapper.classList.remove(
            'hidden'
        );
        if (input.value) search();
    } else {
        kbWrapper.classList.add(
            'hidden'
        );
        if (n === 0) {
            renderWaitlistPage();
        } else if (
            n === ARTICLES_PAGE_INDEX
        ) {
            renderArticlesPage();
        }
    }
}
/* ==================== ГОРИЗОНТАЛЬНИЙ СВАЙП ==================== */
let pageDragStartX = 0;
let pageDragStartY = 0;
let pageDragBasePage = 0;
let pageDragging = false;
let pageMoved = false;
let pageDragPxWidth = 0;
let pageSwipeCandidate = false;
let suppressNextClick = false;
/*
    ЗБІЛЬШЕНО з 14 до 24: дрейф пальця при звичайному натисканні
    більше не сприймається як початок свайпу.
*/
const PAGE_SWIPE_START_PX = 24;
function finishPageDrag(dx) {
    const SWIPE_THRESHOLD =
        Math.max(
            55,
            pageDragPxWidth * 0.20
        );
    const pageArticlesEl =
        document.getElementById(
            'page-articles'
        );
    /*
        ВНУТРІШНЯ НАВІГАЦІЯ АРТИКУЛІВ
    */
    if (
        pageDragBasePage === ARTICLES_PAGE_INDEX &&
        articlesPageStack.length > 1
    ) {
        const wrapper =
            document.getElementById(
                'articles-drag-wrapper'
            );
        if (!wrapper) {
            if (pageArticlesEl) {
                pageArticlesEl.classList.remove(
                    'articles-swiping'
                );
            }
            renderArticlesPage();
            return;
        }
        let settled = false;
        const settle = (goBack) => {
            if (settled) return;
            settled = true;
            if (pageArticlesEl) {
                pageArticlesEl.classList.remove(
                    'articles-swiping'
                );
            }
            if (goBack) {
                popArticlesPageLevel();
            } else {
                renderArticlesPage();
            }
        };
        wrapper.style.transition =
            'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
        /*
            Крапочки оновлюємо ВІДРАЗУ, в момент прийняття рішення —
            ще до того, як почалась/завершилась сама анімація зсуву.
            Інакше вони чекали б на transitionend (чи й цілих 400мс
            запасного таймауту) і помітно відставали б від переходу.
        */
        const willGoBack =
            dx >= SWIPE_THRESHOLD;
        renderArticlesDots(
            ARTICLES_PAGE_INDEX,
            willGoBack
                ? articlesPageStack.length - 1
                : articlesPageStack.length
        );
        if (
            willGoBack
        ) {
            wrapper.style.transform =
                'translateX(0px)';
            const onDone = (ev) => {
                if (
                    ev &&
                    ev.target !== wrapper
                ) {
                    return;
                }
                wrapper.removeEventListener(
                    'transitionend',
                    onDone
                );
                settle(true);
            };
            wrapper.addEventListener(
                'transitionend',
                onDone
            );
            setTimeout(
                () => settle(true),
                400
            );
        } else {
            wrapper.style.transform =
                `translateX(-${pageDragPxWidth}px)`;
            const onCancel = (ev) => {
                if (
                    ev &&
                    ev.target !== wrapper
                ) {
                    return;
                }
                wrapper.removeEventListener(
                    'transitionend',
                    onCancel
                );
                settle(false);
            };
            wrapper.addEventListener(
                'transitionend',
                onCancel
            );
            setTimeout(
                () => settle(false),
                400
            );
        }
        return;
    }
    let target =
        pageDragBasePage;
    if (
        Math.abs(dx) >=
        SWIPE_THRESHOLD
    ) {
        const dir =
            dx > 0 ? -1 : 1;
        target =
            Math.max(
                0,
                Math.min(
                    TOTAL_PAGES - 1,
                    pageDragBasePage + dir
                )
            );
    }
    pagesEl.style.transition =
        'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
    if (target !== SEARCH_PAGE_INDEX) {
        exitQtyMode();
    }
    currentPage = target;
    pagesEl.style.transform =
        `translateX(-${target * pageWidthPercent}%)`;
    /*
        Оновлення крапочок після завершення свайпу.
    */
    renderArticlesDots();
    if (
        target === SEARCH_PAGE_INDEX
    ) {
        kbWrapper.classList.remove(
            'hidden'
        );
        if (input.value) search();
    } else {
        kbWrapper.classList.add(
            'hidden'
        );
        if (target === 0) {
            renderWaitlistPage();
        } else if (
            target === ARTICLES_PAGE_INDEX
        ) {
            renderArticlesPage();
        }
    }
}
/* ==================== TOUCH START ==================== */
document.addEventListener(
    'touchstart',
    e => {
        /* Поки відкрита клавіатура кількості передмонтажу — свайпи вимкнені */
        if (pmQtyMode) return;
        if (e.target.closest && e.target.closest('#wl-history')) return;
        if (
            !e.touches ||
            e.touches.length !== 1
        ) {
            return;
        }
        const touch =
            e.touches[0];
        pageDragStartX =
            touch.clientX;
        pageDragStartY =
            touch.clientY;
        pageDragBasePage =
            currentPage;
        pageDragPxWidth =
            (
                pagesEl.parentElement
                    ? pagesEl.parentElement.clientWidth
                    : window.innerWidth
            ) ||
            window.innerWidth;
        pageDragging = true;
        pageMoved = false;
        pageSwipeCandidate = true;
    },
    {
        passive: true
    }
);
/* ==================== TOUCH MOVE ==================== */
document.addEventListener(
    'touchmove',
    e => {
        if (
            !pageDragging ||
            !pageSwipeCandidate ||
            !e.touches ||
            e.touches.length !== 1
        ) {
            return;
        }
        const touch =
            e.touches[0];
        const dx =
            touch.clientX -
            pageDragStartX;
        const dy =
            touch.clientY -
            pageDragStartY;
        if (!pageMoved) {
            const absX =
                Math.abs(dx);
            const absY =
                Math.abs(dy);
            if (
                Math.max(
                    absX,
                    absY
                ) < PAGE_SWIPE_START_PX
            ) {
                return;
            }
            if (
                absY > absX
            ) {
                pageDragging = false;
                pageSwipeCandidate =
                    false;
                return;
            }
            pageMoved = true;
            try {
                e.preventDefault();
            } catch (_) {}
            if (
                pageDragBasePage !== ARTICLES_PAGE_INDEX ||
                articlesPageStack.length <= 1
            ) {
                pagesEl.style.transition =
                    'none';
            } else {
                const contentW =
                    articlesPageContent.clientWidth ||
                    pageDragPxWidth;
                pageDragPxWidth =
                    contentW;
                const prevState =
                    articlesPageStack[
                        articlesPageStack.length - 2
                    ];
                const prevHtml =
                    (
                        prevState &&
                        prevState.cachedHtml
                    )
                        ? prevState.cachedHtml
                        : buildArticlesLevelHtml(
                            articlesPageStack.length - 2
                        );
                if (
                    prevState &&
                    !prevState.cachedHtml
                ) {
                    prevState.cachedHtml =
                        prevHtml;
                }
                const wrapper =
                    document.createElement(
                        'div'
                    );
                wrapper.className =
                    'articles-drag-wrapper';
                wrapper.id =
                    'articles-drag-wrapper';
                const prevPane =
                    document.createElement(
                        'div'
                    );
                prevPane.className =
                    'articles-drag-pane';
                prevPane.innerHTML =
                    prevHtml;
                const currentPane =
                    document.createElement(
                        'div'
                    );
                currentPane.className =
                    'articles-drag-pane';
                while (
                    articlesPageContent.firstChild
                ) {
                    currentPane.appendChild(
                        articlesPageContent.firstChild
                    );
                }
                wrapper.appendChild(
                    prevPane
                );
                wrapper.appendChild(
                    currentPane
                );
                articlesPageContent.appendChild(
                    wrapper
                );
                const pageArticlesEl =
                    document.getElementById(
                        'page-articles'
                    );
                if (pageArticlesEl) {
                    pageArticlesEl.classList.add(
                        'articles-swiping'
                    );
                }
                wrapper.style.transition =
                    'none';
                wrapper.style.transform =
                    `translateX(-${pageDragPxWidth}px)`;
            }
        } else {
            try {
                e.preventDefault();
            } catch (_) {}
        }
        const maxDelta =
            pageDragPxWidth;
        const limitedDx =
            Math.max(
                -maxDelta,
                Math.min(
                    maxDelta,
                    dx
                )
            );
        if (
            pageDragBasePage === ARTICLES_PAGE_INDEX &&
            articlesPageStack.length > 1
        ) {
            const wrapper =
                document.getElementById(
                    'articles-drag-wrapper'
                );
            if (!wrapper) return;
            const visualDx =
                Math.max(
                    0,
                    Math.min(
                        pageDragPxWidth,
                        limitedDx
                    )
                );
            wrapper.style.transition =
                'none';
            wrapper.style.transform =
                `translateX(${visualDx - pageDragPxWidth}px)`;
            /*
                Крапочки "йдуть за пальцем" ще під час самого свайпу —
                так зміна помітна ще швидше, ніж сам перехід.
            */
            const liveThreshold =
                Math.max(
                    55,
                    pageDragPxWidth * 0.20
                );
            renderArticlesDots(
                ARTICLES_PAGE_INDEX,
                visualDx >= liveThreshold
                    ? articlesPageStack.length - 1
                    : articlesPageStack.length
            );
            return;
        }
        let livePos =
            pageDragBasePage -
            limitedDx /
            pageDragPxWidth;
        livePos =
            Math.max(
                0,
                Math.min(
                    TOTAL_PAGES - 1,
                    livePos
                )
            );
        pagesEl.style.transform =
            `translateX(-${livePos * pageWidthPercent}%)`;
        renderArticlesDots(
            Math.round(livePos)
        );
    },
    {
        passive: false
    }
);
/* ==================== TOUCH END ==================== */
document.addEventListener(
    'touchend',
    e => {
        if (!pageDragging) {
            return;
        }
        const wasSwipe =
            pageMoved;
        pageDragging = false;
        pageSwipeCandidate =
            false;
        if (!wasSwipe) {
            if (
                currentPage === SEARCH_PAGE_INDEX &&
                !qtyMode &&
                !pmQtyMode &&
                !kbWrapper.contains(
                    e.target
                ) &&
                !e.target.closest(
                    '.select-btn'
                ) &&
                !e.target.closest(
                    '.mat-pick'
                ) &&
                !e.target.closest(
                    '[data-anav]'
                )
            ) {
                kbWrapper.classList.toggle(
                    'hidden'
                );
            }
            /*
                Швидкий тап: виконуємо клік ОДРАЗУ на touchend,
                не чекаючи окремого синтетичного "click" від браузера
                (той приходить із помітною затримкою). Справжній
                наступний click від цього ж тапу гасимо нижче —
                інакше дія виконалась би двічі.
            */
            const tappable =
                e.target.closest(
                    'button, [data-anav]'
                );
            if (tappable) {
                tappable.click();
                suppressNextClick = true;
                setTimeout(
                    () => {
                        suppressNextClick = false;
                    },
                    400
                );
            }
            return;
        }
        const changedTouch =
            e.changedTouches &&
            e.changedTouches.length
                ? e.changedTouches[0]
                : null;
        const dx =
            changedTouch
                ? changedTouch.clientX -
                  pageDragStartX
                : 0;
        suppressNextClick = true;
        finishPageDrag(dx);
        setTimeout(
            () => {
                suppressNextClick = false;
            },
            400
        );
    },
    {
        passive: true
    }
);
/* ==================== TOUCH CANCEL ==================== */
/*
    Якщо браузер сам скасував жест (наприклад, перехопив скрол),
    скидаємо стан, щоб не лишалось "зависшого" свайпу.
*/
document.addEventListener(
    'touchcancel',
    () => {
        pageDragging = false;
        pageSwipeCandidate = false;
        if (pageMoved) {
            pageMoved = false;
            finishPageDrag(0);
        }
    },
    {
        passive: true
    }
);
/* ==================== КЕРУВАННЯ НА ПК ==================== */
document.addEventListener(
    'keydown',
    e => {
        if (
            e.key !== 'ArrowLeft' &&
            e.key !== 'ArrowRight'
        ) {
            return;
        }
        if (
            e.altKey ||
            e.ctrlKey ||
            e.metaKey ||
            e.shiftKey ||
            e.target.closest(
                'textarea, select, [contenteditable="true"], input:not([readonly])'
            )
        ) {
            return;
        }
        e.preventDefault();
        if (
            currentPage === ARTICLES_PAGE_INDEX &&
            articlesPageStack.length > 1
        ) {
            if (e.key === 'ArrowRight') {
                popArticlesPageLevel();
            }
            return;
        }
        goToPage(
            currentPage +
            (e.key === 'ArrowLeft' ? 1 : -1)
        );
    }
);
let mouseSwipeActive = false;
let mousePullActive = false;
let mousePullArea = null;
let mousePullDy = 0;
document.addEventListener(
    'mousedown',
    e => {
        if (
            e.button !== 0 ||
            e.target.closest(
                'button, input, textarea, select'
            )
        ) {
            return;
        }
        mouseSwipeActive = true;
        mousePullActive = false;
        mousePullArea = null;
        mousePullDy = 0;
        const activeArea = getActiveScrollArea();
        const candidate =
            e.target.closest('.scroll-area');
        if (
            activeArea &&
            candidate === activeArea &&
            activeArea.scrollTop <= 0
        ) {
            mousePullArea = activeArea;
        }
        pageDragStartX = e.clientX;
        pageDragStartY = e.clientY;
        pageDragBasePage = currentPage;
        pageDragPxWidth =
            (
                pagesEl.parentElement
                    ? pagesEl.parentElement.clientWidth
                    : window.innerWidth
            ) ||
            window.innerWidth;
        pageMoved = false;
    }
);
document.addEventListener(
    'mousemove',
    e => {
        if (mousePullActive) {
            const dy = e.clientY - pageDragStartY;
            if (dy <= 0) {
                mousePullActive = false;
                pullActive = false;
                pullDy = 0;
                pullReset(true);
                return;
            }
            mousePullDy = dy;
            pullArea = mousePullArea;
            pullActive = true;
            pullDy = dy;
            pullApply(dy);
            e.preventDefault();
            return;
        }
        if (!mouseSwipeActive) return;
        const dx = e.clientX - pageDragStartX;
        const dy = e.clientY - pageDragStartY;
        if (!pageMoved) {
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);
            if (
                Math.max(absX, absY) <
                PAGE_SWIPE_START_PX
            ) {
                return;
            }
            if (absY > absX) {
                mouseSwipeActive = false;
                if (dy > 0 && mousePullArea) {
                    mousePullActive = true;
                    mousePullDy = dy;
                    pullArea = mousePullArea;
                    pullActive = true;
                    pullDy = dy;
                    pullApply(dy);
                    e.preventDefault();
                }
                return;
            }
            pageMoved = true;
        }
        e.preventDefault();
        if (
            pageDragBasePage === ARTICLES_PAGE_INDEX &&
            articlesPageStack.length > 1
        ) {
            return;
        }
        const limitedDx = Math.max(
            -pageDragPxWidth,
            Math.min(pageDragPxWidth, dx)
        );
        const livePos = Math.max(
            0,
            Math.min(
                TOTAL_PAGES - 1,
                pageDragBasePage -
                    limitedDx / pageDragPxWidth
            )
        );
        pagesEl.style.transition = 'none';
        pagesEl.style.transform =
            `translateX(-${livePos * pageWidthPercent}%)`;
        renderArticlesDots(Math.round(livePos));
    },
    { passive: false }
);
document.addEventListener(
    'mouseup',
    e => {
        if (mousePullActive) {
            mousePullActive = false;
            mousePullDy = Math.max(
                0,
                e.clientY - pageDragStartY
            );
            pullArea = mousePullArea;
            pullActive = mousePullDy > 0;
            pullDy = mousePullDy;
            pullFinish();
            mousePullArea = null;
            mousePullDy = 0;
            return;
        }
        if (!mouseSwipeActive) return;
        mouseSwipeActive = false;
        if (!pageMoved) return;
        const dx = e.clientX - pageDragStartX;
        const threshold = Math.max(
            55,
            pageDragPxWidth * 0.20
        );
        if (
            pageDragBasePage === ARTICLES_PAGE_INDEX &&
            articlesPageStack.length > 1
        ) {
            if (dx >= threshold) {
                popArticlesPageLevel();
            } else {
                renderArticlesPage();
            }
        } else {
            finishPageDrag(dx);
        }
        suppressNextClick = true;
        setTimeout(() => {
            suppressNextClick = false;
        }, 400);
    }
);
/* ==================== БЛОКУВАННЯ CLICK ПІСЛЯ SWIPE ==================== */
document.addEventListener(
    'click',
    e => {
        /*
            Наш власний click() з touchend (isTrusted === false)
            ніколи не гасимо — тільки справжній клік від браузера.
        */
        if (!e.isTrusted) {
            return;
        }
        if (!suppressNextClick) {
            return;
        }
        suppressNextClick = false;
        e.preventDefault();
        e.stopPropagation();
    },
    true
);
/* ==================== ХОВАННЯ КЛАВІАТУРИ ПРИ СКРОЛІ ==================== */
const scrollAreaEl =
    document.querySelector(
        '#page0 .scroll-area'
    );
let resultStartY = 0;
scrollAreaEl.addEventListener(
    'touchstart',
    (e) => {
        resultStartY =
            e.touches[0].clientY;
    },
    {
        passive: true
    }
);
scrollAreaEl.addEventListener(
    'touchmove',
    (e) => {
        if (
            kbWrapper.classList.contains(
                'hidden'
            )
        ) {
            return;
        }
        if (qtyMode) {
            return;
        }
        const dy =
            e.touches[0].clientY -
            resultStartY;
        if (dy < -8) {
            kbWrapper.classList.add(
                'hidden'
            );
        }
    },
    {
        passive: true
    }
);
scrollAreaEl.addEventListener(
    'scroll',
    () => {
        if (
            !qtyMode &&
            scrollAreaEl.scrollTop > 4 &&
            !kbWrapper.classList.contains(
                'hidden'
            )
        ) {
            kbWrapper.classList.add(
                'hidden'
            );
        }
    },
    {
        passive: true
    }
);
/* ==================== ЖЕСТ "ПОТЯГНУТИ ВНИЗ" → ПОВЕРНЕННЯ НА ПОШУК ==================== */
/*
    На будь-якій сторінці/рівні, крім пошуку, якщо контент прокручений
    до самого верху (scrollTop === 0) і користувач тягне вниз,
    контент слідує за жестом (з опором), зверху з'являється індикатор.
    Якщо потягнути достатньо далеко і відпустити — повертаємось на пошук.
    Якщо є куди скролити вгору — жест не спрацьовує (звичайний скрол).
*/
const PULL_DOWN_PX = 90;
let pullStartX = 0;
let pullStartY = 0;
let pullArea = null;
let pullActive = false;
let pullDy = 0;
const pullIndicator = document.createElement('div');
pullIndicator.id = 'pull-indicator';
pullIndicator.innerHTML = '<span class="pull-arrow">↓</span>';
document.body.appendChild(pullIndicator);
const pullArrowEl = pullIndicator.firstChild;
function getActiveScrollArea() {
    if (currentPage === SEARCH_PAGE_INDEX) {
        return document.querySelector('#page0 .scroll-area');
    }
    if (currentPage === ARTICLES_PAGE_INDEX) {
        return document.querySelector('#page-articles .scroll-area');
    }
    if (currentPage === 0) {
        return document.querySelector('#page-waitlist .scroll-area');
    }
    return null;
}
function pullApply(dy) {
    /* Опір: чим далі тягнеш, тим важче */
    const shift = Math.min(150, dy * 0.55);
    const p = Math.min(1, dy / PULL_DOWN_PX);
    if (pullArea) {
        pullArea.style.transition = 'none';
        pullArea.style.transform = `translateY(${shift}px)`;
    }
    pullIndicator.style.transition = 'none';
    pullIndicator.style.opacity = String(Math.min(1, p * 1.4));
    pullIndicator.style.transform =
        `translate(-50%, ${Math.min(shift, 70) - 6}px) scale(${0.6 + 0.4 * p})`;
    const ready = p >= 1;
    pullIndicator.classList.toggle('ready', ready);
    pullArrowEl.textContent = '↓';
    pullArrowEl.style.transform =
        `rotate(${p * 180}deg)`;
}
function pullReset(animated) {
    if (pullArea) {
        pullArea.style.transition = animated
            ? 'transform 0.28s cubic-bezier(0.2,0.8,0.2,1)'
            : 'none';
        pullArea.style.transform = '';
        const a = pullArea;
        setTimeout(() => { a.style.transition = ''; }, 320);
    }
    pullIndicator.style.transition =
        'opacity 0.2s ease, transform 0.28s ease';
    pullIndicator.style.opacity = '0';
    pullIndicator.style.transform =
        'translate(-50%, -30px) scale(0.6)';
    pullIndicator.classList.remove('ready');
}
document.addEventListener(
    'touchstart',
    e => {
        pullActive = false;
        pullDy = 0;
        if (pmQtyMode) return;
        if (e.target.closest && e.target.closest('#wl-history')) return;
        if (
            !e.touches ||
            e.touches.length !== 1
        ) {
            return;
        }
        const area = getActiveScrollArea();
        if (!area || area.scrollTop > 0) {
            return;
        }
        if (currentPage === SEARCH_PAGE_INDEX) {
            if (
                !area.contains(e.target) ||
                e.target.closest(
                    'button, input, textarea, select, [data-anav]'
                )
            ) {
                return;
            }
        } else if (
            e.target.closest &&
            e.target.closest('textarea')
        ) {
            return;
        }
        pullArea = area;
        pullStartX = e.touches[0].clientX;
        pullStartY = e.touches[0].clientY;
        pullActive = true;
    },
    { passive: true }
);
document.addEventListener(
    'touchmove',
    e => {
        if (
            !pullActive ||
            !e.touches ||
            e.touches.length !== 1
        ) {
            return;
        }
        /* Контент зрушив від верху — це вже звичайний скрол */
        if (!pullArea || pullArea.scrollTop > 0) {
            pullActive = false;
            pullReset(true);
            return;
        }
        const dx = e.touches[0].clientX - pullStartX;
        const dy = e.touches[0].clientY - pullStartY;
        /* Горизонтальний свайп між сторінками — не наш жест */
        if (pullDy === 0 && Math.abs(dx) > Math.abs(dy)) {
            if (Math.abs(dx) > 24) {
                pullActive = false;
            }
            return;
        }
        if (dy <= 0) {
            pullDy = 0;
            if (dy < -10) {
                pullActive = false;
            }
            pullReset(false);
            return;
        }
        /* Свайп уже перехоплено горизонтальною логікою — не заважаємо */
        if (pageMoved) {
            pullActive = false;
            pullReset(true);
            return;
        }
        pullDy = dy;
        /* Не даємо цьому жесту стати "кліком" чи вертикальним скролом */
        pageDragging = false;
        pageSwipeCandidate = false;
        if (e.cancelable) {
            try { e.preventDefault(); } catch (_) {}
        }
        pullApply(dy);
    },
    { passive: false }
);
function pullFinish() {
    if (!pullActive && pullDy === 0) {
        return;
    }
    const dy = pullDy;
    const ok = pullActive && dy >= PULL_DOWN_PX;
    pullActive = false;
    pullDy = 0;
    if (dy > 0) {
        suppressNextClick = true;
        setTimeout(() => {
            suppressNextClick = false;
        }, 400);
    }
    if (ok) {
        const a = pullArea;
        pullIndicator.style.transition =
            'opacity 0.25s ease';
        pullIndicator.style.opacity = '0';
        if (currentPage === SEARCH_PAGE_INDEX) {
            exitQtyMode();
            input.value = '';
            search();
        } else {
            /* Повертаємось до пошуку з кореневою панеллю артикулів. */
            articlesPageStack = [
                { level: 'articles' }
            ];
            renderArticlesPage(true);
            pagesEl.style.transition =
                'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
            goToPage(SEARCH_PAGE_INDEX);
        }
        setTimeout(() => {
            if (a) {
                a.style.transition = 'none';
                a.style.transform = '';
            }
            pullIndicator.classList.remove('ready');
        }, 400);
    } else {
        pullReset(true);
    }
}
document.addEventListener(
    'touchend',
    pullFinish,
    { passive: true }
);
document.addEventListener(
    'touchcancel',
    () => {
        pullActive = false;
        pullDy = 0;
        pullReset(true);
    },
    { passive: true }
);
/* ==================== ПЕРВИННИЙ СТАН КРАПОЧОК ==================== */
renderArticlesDots();
/* ==================== SERVICE WORKER (швидкий старт з кешу) ==================== */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}
const instantStart = document.getElementById('instant-start');
if (instantStart) instantStart.remove();
} , 0));
</script>

    <input id="station-list-modal-input" type="text" inputmode="none" readonly placeholder="Кількість">
