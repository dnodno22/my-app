<script>
/* ==================== ДЖЕРЕЛО ДАНИХ ====================
   Аркуші зліва більше НЕ тягнуться з окремих гугл-таблиць —
   вони будуються динамічно з тих самих даних, що і пошук.

   ЛОГІКА ГРУПУВАННЯ АРТИКУЛІВ (стовпчик C):
   Унікальний артикул — це ПОВНИЙ номер (напр. 7340112, 7340113 і т.д.).
   Якщо один і той самий матеріал стосується декількох повних артикулів,
   у стовпчику C це записують скорочено через "/":
       7340112/113/114/115/174/175
   Це означає ШІСТЬ окремих повних артикулів:
       7340112, 7340113, 7340114, 7340115, 7340174, 7340175
   (перше число повне, решта — це останні 3 цифри, які "доклеюються"
   до спільного префікса першого числа: 7340 + 113 = 7340113 і т.д.)

   Кожен такий повний артикул отримує свою окрему сторінку зі списком
   станцій/адрес, куди він застосовується — так само, як показує пошук.
   Короткі коди самі по собі (окремим рядком, без "/") у цих даних не
   зустрічаються — вони існують лише всередині складеного запису вище,
   тож ніякого додаткового "домержування" не потрібно: досатньо просто
   розгорнути кожен рядок і згрупувати рядки за повним артикулом. */
const SPREADSHEET_ID = "1ii4oiQvbayKKN1tffS4X7WxH0NPZ0oiooaHPP6Ku6W8";
const SEARCH_GID = "1679964111";
/* ================================================================ */

let TOTAL_PAGES = 3; // 0 = очікування, 1 = пошук, 2 = артикули (фіксовано)
const SEARCH_PAGE_INDEX = 1;
const ARTICLES_PAGE_INDEX = 2;
let currentPage = SEARCH_PAGE_INDEX;
let searchData = [];
let pageWidthPercent = 100 / TOTAL_PAGES;
let articleGroups = [];

// Стек рівнів навігації на сторінці "Артикули":
// {level:'articles'} -> {level:'actions', article} -> {level:'results', article, action}
//                                                    -> {level:'premontage-categories', article} -> {level:'premontage-wires', article, category}
//                                                    -> {level:'wire-stations', article} -> {level:'wire-results', article, station}
// Свайп у будь-яку сторону на цій сторінці = крок назад (pop зі стеку), поки стек не дійде до 'articles'.
let articlesPageStack = [{ level: 'articles' }];
const ARTICLE_ACTION_KEYS = ["розміщення", "sp", "ts", "стр", "мм", "передмонтаж", "проводи"];
// Читабельні назви кнопок дій (реальний пошук усе одно йде по коду з масиву вище —
// це лише те, що бачить користувач на кнопці/в заголовку).
const ACTION_LABELS = {
    "розміщення": "📍 Розміщення",
    "sp": "🔩 SP",
    "ts": "🧷 TS",
    "стр": "📏 СТР",
    "мм": "📐 ММ",
    "передмонтаж": "🧵 Передмонтаж",
    "проводи": "⚡ Проводи"
};
function actionLabel(key) {
    return ACTION_LABELS[key] || escapeHtml(key);
}

const input = document.getElementById('input');
const resultBox = document.getElementById('result');
const waitlistBox = document.getElementById('waitlist-result');
const kbWrapper = document.getElementById('kb-wrapper');
const pagesEl = document.getElementById('pages');
const dotsEl = document.getElementById('page-dots');

const CACHE_KEY_SEARCH = "searchDataCSV";
const CACHE_KEY_SEARCH_TIME = "searchDataCSVTime";

// Кількість сторінок фіксована (3) — ширина і крапки виставляються один раз при завантаженні
document.querySelectorAll('.page').forEach(p => { p.style.width = pageWidthPercent + '%'; });
pagesEl.style.width = (TOTAL_PAGES * 100) + '%';
for (let i = 0; i < TOTAL_PAGES; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    d.id = 'dot' + i;
    dotsEl.appendChild(d);
}
dotsEl.classList.add('visible');
// На старті відкриваємо саме сторінку пошуку, а не першу бічну сторінку.
pagesEl.style.transform = `translateX(-${currentPage * pageWidthPercent}%)`;

/* ---------- Розбір складеного запису артикулу з колонки C ---------- */
function normalizeArticlePart(part) {
    return String(part || "").trim().replace(/\s+/g, "");
}

// Базовий артикул завжди складається з 7 цифр. Якщо після цих 7 цифр
// іде щось ще (додаткові цифри, букви — будь-що, напр. "734011202А"),
// це вважається тим самим артикулом "7340112", а "02А" — просто
// суфіксом/варіантом, який не впливає на групування по сторінках.
function getArticleBase(code) {
    if (/^\d{7}/.test(code) && code.length > 7) {
        return code.slice(0, 7);
    }
    return code;
}

// "7340112/113/114/115/174/175" -> ["7340112","7340113","7340114","7340115","7340174","7340175"]
// "7340112"                     -> ["7340112"]
// "734011202А"                  -> ["7340112"]  (суфікс "02А" ігнорується при групуванні)
function expandArticleValue(raw) {
    raw = String(raw || "").trim();
    if (!raw) return [];

    const parts = raw
        .split("/")
        .map(normalizeArticlePart)
        .filter(Boolean);

    if (!parts.length) return [];

    // Звичайний одиночний артикул — нічого розгортати, лише привести до бази.
    if (parts.length === 1) {
        return [getArticleBase(parts[0])];
    }

    const first = getArticleBase(parts[0]);
    const result = [first];

    // Для 7340112 (7 цифр): префікс = перші 4 цифри = "7340",
    // далі кожне коротке число (до 3 цифр) доклеюється до префікса:
    // 113 -> 7340113, 114 -> 7340114, 174 -> 7340174 і т.д.
    let prefix = "";
    if (/^\d+$/.test(first) && first.length >= 3) {
        prefix = first.slice(0, -3);
    }

    for (let i = 1; i < parts.length; i++) {
        const part = parts[i];

        if (/^\d{1,3}$/.test(part) && prefix) {
            result.push(prefix + part.padStart(3, "0"));
        } else {
            // Не коротке число (чи вже повний код із можливим суфіксом) — приводимо до бази.
            result.push(getArticleBase(part));
        }
    }

    return [...new Set(result)];
}

/* ---------- Групування рядків за повним артикулом ---------- */
function computeArticleGroups() {
    const groups = {};

    // Кожен рядок може стосуватись кількох повних артикулів одразу
    // (якщо в колонці C складений запис через "/").
    searchData.forEach(row => {
        const articles = expandArticleValue(row.article);

        articles.forEach(article => {
            if (!article) return;
            if (!groups[article]) groups[article] = [];
            groups[article].push(row);
        });
    });

    // Прибираємо дублікати рядків усередині кожної групи.
    Object.keys(groups).forEach(article => {
        const seen = new Set();

        groups[article] = groups[article].filter(row => {
            const key = [
                row.station,
                row.material,
                row.article,
                row.colD,
                row.address
            ].join("|||");

            if (seen.has(key)) return false;

            seen.add(key);
            return true;
        });
    });

    const keys = Object.keys(groups).sort((a, b) =>
        a.localeCompare(b, "uk", { numeric: true, sensitivity: "base" })
    );

    return keys.map(article => ({
        article,
        rows: groups[article]
    }));
}

// ==================== ОБРАНІ АРТИКУЛИ ====================
// Зберігаються окремо від "Обраних матеріалів" у localStorage.
const CACHE_KEY_ARTICLE_FAVORITES = "articleFavorites";

function loadArticleFavorites() {
    try {
        const value = JSON.parse(localStorage.getItem(CACHE_KEY_ARTICLE_FAVORITES) || "[]");
        return Array.isArray(value) ? value.map(String) : [];
    } catch (e) {
        return [];
    }
}

function saveArticleFavorites(list) {
    localStorage.setItem(CACHE_KEY_ARTICLE_FAVORITES, JSON.stringify([...new Set(list.map(String))]));
}

function isArticleFavorite(article) {
    return loadArticleFavorites().includes(String(article));
}

function toggleArticleFavorite(article) {
    const art = String(article || "");
    if (!art) return false;

    const list = loadArticleFavorites();
    const idx = list.indexOf(art);
    if (idx >= 0) {
        list.splice(idx, 1);
        saveArticleFavorites(list);
        return false;
    }

    // Додаємо в кінець. Під час відображення всі обрані все одно йдуть першими.
    list.push(art);
    saveArticleFavorites(list);
    return true;
}

function sortArticlesWithFavorites(articles) {
    const favorites = new Set(loadArticleFavorites());
    return [...articles].sort((a, b) => {
        const aFav = favorites.has(String(a));
        const bFav = favorites.has(String(b));
        if (aFav !== bFav) return aFav ? -1 : 1;
        return String(a).localeCompare(String(b), "uk", { numeric: true, sensitivity: "base" });
    });
}

// Екранування HTML перед вставкою
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function highlight(text, v, fromEnd) {
    const safe = escapeHtml(text);
    if (!v) return safe;
    const lower = text.toLowerCase();
    if (fromEnd) {
        if (!lower.endsWith(v)) return safe;
        const idx = text.length - v.length;
        return escapeHtml(text.slice(0, idx)) + '<mark class="hl">' + escapeHtml(text.slice(idx)) + '</mark>';
    } else {
        if (!lower.startsWith(v)) return safe;
        return '<mark class="hl">' + escapeHtml(text.slice(0, v.length)) + '</mark>' + escapeHtml(text.slice(v.length));
    }
}

// Розбиває масив HTML-рядків станцій на рядки по STATIONS_PER_LINE штук,
// з'єднуючи їх " | " і переносячи (<br>) кожні STATIONS_PER_LINE елементів.
const STATIONS_PER_LINE = 5;
function buildStationsHtml(stationHtmlArr) {
    const lines = [];
    for (let i = 0; i < stationHtmlArr.length; i += STATIONS_PER_LINE) {
        lines.push(stationHtmlArr.slice(i, i + STATIONS_PER_LINE).join(" | "));
    }
    return lines.join("<br>");
}

// Розбиває номер артикулу на групи 4-3-решта (напр. "779600813B" -> "7796 008 13B"),
// середня група трохи більшим шрифтом, з невеликим відступом між групами (не пробіл).
// Підсвітка (mark.hl) для знайдених цифр зберігається так само, як і раніше.
function renderArticleNumber(art, v, isNumOnly, isSpecialSearch) {
    let matchStart = -1, matchEnd = -1;
    if (!isSpecialSearch && v) {
        const lower = art.toLowerCase();
        if (isNumOnly) {
            if (lower.endsWith(v)) { matchStart = art.length - v.length; matchEnd = art.length; }
        } else {
            if (lower.startsWith(v)) { matchStart = 0; matchEnd = v.length; }
        }
    }
    function part(s, e) {
        const str = art.slice(s, e);
        if (matchStart === -1) return escapeHtml(str);
        const overlapStart = Math.max(s, matchStart);
        const overlapEnd = Math.min(e, matchEnd);
        if (overlapStart >= overlapEnd) return escapeHtml(str);
        let out = '';
        if (overlapStart > s) out += escapeHtml(art.slice(s, overlapStart));
        out += '<mark class="hl">' + escapeHtml(art.slice(overlapStart, overlapEnd)) + '</mark>';
        if (overlapEnd < e) out += escapeHtml(art.slice(overlapEnd, e));
        return out;
    }
    const len = art.length;
    if (len <= 4) return `<span class="art-g1">${part(0, len)}</span>`;
    const g1end = Math.min(4, len);
    const g2end = Math.min(7, len);
    let html = `<span class="art-g1">${part(0, g1end)}</span>`;
    if (len > 4) html += `<span class="art-g2">${part(g1end, g2end)}</span>`;
    if (len > 7) html += `<span class="art-g3">${part(g2end, len)}</span>`;
    return html;
}

// Зберігається у localStorage, живе доти, доки не очистити кеш браузера.
const CACHE_KEY_WAITLIST = "materialWaitlist";

function loadWaitlist() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY_WAITLIST) || "[]"); }
    catch (e) { return []; }
}
function saveWaitlist(list) {
    localStorage.setItem(CACHE_KEY_WAITLIST, JSON.stringify(list));
}
function isInWaitlist(key) {
    return loadWaitlist().some(item => item.key === key);
}
function toggleWaitlistItem(key, material, address, articlesPlain) {
    const list = loadWaitlist();
    const idx = list.findIndex(item => item.key === key);
    if (idx >= 0) {
        list.splice(idx, 1);
    } else {
        list.push({ key, material, address, articles: articlesPlain, comment: "" });
    }
    saveWaitlist(list);
    return idx < 0; // true = щойно додано, false = щойно прибрано
}
function setWaitlistComment(key, text) {
    const list = loadWaitlist();
    const idx = list.findIndex(item => item.key === key);
    if (idx >= 0) {
        list[idx].comment = text;
        saveWaitlist(list);
    }
}

// Об'єднує "короткі" (скорочені, до 3 символів) артикули з відповідним "повним" артикулом
// у тій самій групі матеріалу, якщо короткий код збігається з останніми 3 символами повного.
// Наприклад: "7340112" і "112" — це один і той самий артикул, так само "7340114" і "114" тощо.
function mergeAbbreviatedArticles(articleMap) {
    const arts = Object.keys(articleMap);
    const fullArts = arts.filter(a => a.length > 3);
    const shortArts = arts.filter(a => a.length <= 3);
    if (!shortArts.length) return articleMap; // нічого зливати

    const fullByLast3 = {};
    fullArts.forEach(a => {
        const last3 = a.slice(-3);
        if (!fullByLast3[last3]) fullByLast3[last3] = a;
    });

    const merged = {};
    fullArts.forEach(a => { merged[a] = new Set(articleMap[a]); });
    shortArts.forEach(shortArt => {
        const target = fullByLast3[shortArt];
        if (target) {
            articleMap[shortArt].forEach(st => merged[target].add(st));
        } else {
            // немає відповідного повного артикулу в цій групі — залишаємо як є
            if (!merged[shortArt]) merged[shortArt] = new Set();
            articleMap[shortArt].forEach(st => merged[shortArt].add(st));
        }
    });
    return merged;
}

// ==================== СТОРІНКА "АРТИКУЛИ" ====================
// Передмонтажні рядки вже є в основній таблиці з тими самими 5 колонками:
// A = назва передмонтажу (KLS, LDS, KNDS ...)
// B = матеріал / назва провода
// C = артикул
// D = примітка / номер
// E = адреса
//
// Артикул перевіряється безпосередньо по колонці C. Однаковий KNDS
// для різних артикулів тому не змішується.
function isPremontageName(value) {
    const raw = String(value || "").trim();
    if (!raw) return false;
    return /^[A-Za-zА-Яа-яІіЇїЄєҐґ][A-Za-zА-Яа-яІіЇїЄєҐґ0-9_-]*$/.test(raw);
}

function getPremontageRows() {
    return searchData.filter(row => isPremontageName(row.station) && row.article);
}

function premontageArticleMatches(row, article) {
    if (!row || !article) return false;
    return expandArticleValue(row.article).includes(String(article).trim());
}

function computePremontageCategoriesForArticle(article) {
    const categories = new Set();
    getPremontageRows().forEach(row => {
        if (!premontageArticleMatches(row, article)) return;
        const name = String(row.station || "").trim();
        if (name) categories.add(name);
    });
    return [...categories].sort((a, b) =>
        a.localeCompare(b, 'uk', { numeric: true, sensitivity: 'base' })
    );
}

function computeWiresForCategory(article, category) {
    const wantedCategory = String(category || "").trim().toLowerCase();
    return getPremontageRows()
        .filter(row => premontageArticleMatches(row, article) &&
            String(row.station || "").trim().toLowerCase() === wantedCategory)
        .sort((a, b) => String(a.material || "").localeCompare(
            String(b.material || ""), 'uk', { numeric: true, sensitivity: 'base' }
        ));
}

// Рядки для звичайної спецкнопки (sp/ts/стр/мм): збігається артикул (з урахуванням
// "/"-розгорнутих значень) і примітка (colD) починається з обраного ключа.
function computeArticleActionResults(article, key) {
    const v = String(key || "").toLowerCase();
    return searchData.filter(x => {
        if (!expandArticleValue(x.article).includes(article)) return false;
        return x.colD.toLowerCase().startsWith(v);
    });
}

// ==================== ПРОВОДИ (станції 152 / 153 / 157) ====================
// Проводи — це матеріали, що починаються на 152, 153 або 157.
// Передмонтаж сюди не входить (станції з літерами відфільтровуються).
// Якщо в примітці (colD) щось заповнено — рядок не вважається проводом.
function isWireMaterial(material) {
    return /^15[237]/.test(String(material || "").trim());
}

function getWireRowsForArticle(article) {
    return searchData.filter(row => {
        if (!expandArticleValue(row.article).includes(String(article).trim())) return false;
        if (isPremontageName(row.station)) return false; // передмонтаж не входить
        if (String(row.colD || "").trim()) return false; // є примітка — не провід
        return isWireMaterial(row.material);
    });
}

function computeWireStationsForArticle(article) {
    const stations = new Set();
    getWireRowsForArticle(article).forEach(row => {
        const st = String(row.station || "").trim();
        if (st) stations.add(st);
    });
    return [...stations].sort((a, b) =>
        a.localeCompare(b, 'uk', { numeric: true, sensitivity: 'base' })
    );
}

function computeWiresForStation(article, station) {
    const wanted = String(station || "").trim().toLowerCase();
    return getWireRowsForArticle(article)
        .filter(row => String(row.station || "").trim().toLowerCase() === wanted)
        .sort((a, b) => String(a.material || "").localeCompare(
            String(b.material || ""), 'uk', { numeric: true, sensitivity: 'base' }
        ));
}

// Усі матеріали на артикулі (для кнопки «розміщення»)
function getAllMaterialsForArticle(article) {
    return searchData.filter(row =>
        expandArticleValue(row.article).includes(String(article).trim())
    );
}

// Чи є дані для конкретної кнопки дії — якщо ні, кнопку не показуємо
function articleHasAction(article, action) {
    if (action === 'розміщення') {
        return getAllMaterialsForArticle(article).length > 0;
    }
    if (action === 'передмонтаж') {
        return computePremontageCategoriesForArticle(article).length > 0;
    }
    if (action === 'проводи') {
        return computeWireStationsForArticle(article).length > 0;
    }
    // sp / ts / стр / мм
    return computeArticleActionResults(article, action).length > 0;
}

function getAvailableActionsForArticle(article) {
    return ARTICLE_ACTION_KEYS.filter(k => articleHasAction(article, k));
}

function popArticlesPageLevel() {
    if (articlesPageStack.length > 1) {
        articlesPageStack.pop();
        renderArticlesPage();
    }
}

function buildArticlesLevelHtml(stateIndex) {
    const state = articlesPageStack[stateIndex];
    if (!state) return '';

    // "Хлібні крихти" — показують, де саме користувач перебуває в ієрархії.
    let crumb = 'Артикули';
    if (state.article) crumb += ' › ' + state.article;
    if (state.level === 'results') crumb += ' › ' + actionLabel(state.action);
    if (state.level === 'premontage-categories') crumb += ' › ' + actionLabel('передмонтаж');
    if (state.level === 'premontage-wires') crumb += ' › ' + actionLabel('передмонтаж') + ' › ' + state.category;
    if (state.level === 'wire-stations') crumb += ' › ' + actionLabel('проводи');
    if (state.level === 'wire-results') crumb += ' › ' + actionLabel('проводи') + ' › ' + state.station;

    let html = `<div class="page-eyebrow" style="text-align:left;">${escapeHtml(crumb)}</div>`;
    html += '<div class="premontage-toolbar">';
    if (stateIndex > 0) {
        html += '<button class="premontage-nav-btn" data-anav="back">← Назад</button>';
    }
    html += '</div>';

    if (state.level === 'articles') {
        html += '<div class="premontage-title">Оберіть артикул</div>';
        const articles = sortArticlesWithFavorites(articleGroups.map(g => g.article));
        if (!articles.length) {
            html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає даних</div>';
        } else {
            html += '<div class="premontage-btn-grid">';
            articles.forEach(a => {
                html += `<button class="premontage-item-btn" data-anav="article" data-article="${escapeHtml(a)}">${renderArticleNumber(a, "", false, true)}</button>`;
            });
            html += '</div>';
        }
    } else if (state.level === 'actions') {
        const favorite = isArticleFavorite(state.article);
        html += `<div class="premontage-title" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
            <span>Артикул ${escapeHtml(state.article)}</span>
            <button class="article-favorite-btn${favorite ? ' selected' : ''}" data-anav="article-favorite" data-article="${escapeHtml(state.article)}" aria-label="${favorite ? 'Прибрати з обраних' : 'Додати до обраних'}" title="${favorite ? 'Прибрати з обраних' : 'Додати до обраних'}">${favorite ? '★' : '☆'}</button>
        </div>`;
        const available = getAvailableActionsForArticle(state.article);
        if (!available.length) {
            html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає даних для цього артикулу</div>';
        } else {
            html += '<div class="premontage-btn-grid">';
            available.forEach(k => {
                html += `<button class="premontage-item-btn" data-anav="action" data-action="${escapeHtml(k)}">${actionLabel(k)}</button>`;
            });
            html += '</div>';
        }
    } else if (state.level === 'results') {
        const rows = state.action === 'розміщення'
            ? getAllMaterialsForArticle(state.article)
            : computeArticleActionResults(state.article, state.action);
        html += `<div class="premontage-title">${actionLabel(state.action)} — артикул ${escapeHtml(state.article)}</div>`;
        if (!rows.length) {
            html += '<div style="text-align:center; padding:40px; color:#aaa;">Не знайдено</div>';
        } else if (state.action === 'розміщення') {
            // Проста таблиця — постанційно: спочатку сортуємо/групуємо по станції,
            // потім по матеріалу. Порядок колонок: Станція, Матеріал, Адреса.
            const sorted = [...rows].sort((a, b) => {
                const byStation = String(a.station || "").localeCompare(String(b.station || ""), 'uk', { numeric: true, sensitivity: 'base' });
                if (byStation !== 0) return byStation;
                return String(a.material || "").localeCompare(String(b.material || ""), 'uk', { numeric: true, sensitivity: 'base' });
            });
            html += '<table><thead><tr><th>Станція</th><th>Матеріал</th><th>Адреса</th></tr></thead><tbody>';
            sorted.forEach(r => {
                html += `<tr><td>${escapeHtml(r.station)}</td><td>${escapeHtml(r.material)}</td><td>${escapeHtml(r.address)}</td></tr>`;
            });
            html += '</tbody></table>';
        } else if (state.action === 'sp') {
            // sp: назва = число на 158, адреса зеленим, станції справа
            const grouped = {};
            rows.forEach(x => {
                const mat = String(x.material || "").trim();
                const m = mat.match(/158\d+/);
                if (!m) return;
                const num = m[0];
                const st = String(x.station || "").trim();
                const addr = String(x.address || "").trim();
                const key = num + "|" + addr;
                if (!grouped[key]) grouped[key] = { num, addr, stations: new Set() };
                if (st) grouped[key].stations.add(st);
            });
            const items = Object.values(grouped).sort((a, b) =>
                a.num.localeCompare(b.num, 'uk', { numeric: true })
            );
            if (!items.length) {
                html += '<div style="text-align:center; padding:40px; color:#aaa;">Не знайдено</div>';
            } else {
                items.forEach(item => {
                    const stationHtmlArr = [...item.stations]
                        .sort((a, b) => String(a).localeCompare(String(b), 'uk', { numeric: true }))
                        .map(st => escapeHtml(st));
                    const stationsHtml = buildStationsHtml(stationHtmlArr);
                    html += `<div class="result-card">
                        <div class="result-top">
                            <span class="result-material-badge"><span class="box-icon">📦</span>${escapeHtml(item.num)}</span>
                            <span class="result-address-new">${escapeHtml(item.addr)}</span>
                        </div>
                        <div class="article-row" style="border-top:none; padding-top:0; justify-content:flex-end;">
                            <span class="article-stations">${stationsHtml}</span>
                        </div>
                    </div>`;
                });
            }
        } else if (state.action === 'ts') {
            // ts: якщо на одній і тій самій станції — показуємо станцію лише один раз
            const byStation = {};
            rows.forEach(x => {
                const st = String(x.station || "").trim() || "—";
                if (!byStation[st]) byStation[st] = [];
                const mat = String(x.material || "").trim();
                const addr = String(x.address || "").trim();
                const key = mat + "|" + addr;
                if (!byStation[st].some(item => item.key === key)) {
                    byStation[st].push({ key, mat, addr });
                }
            });
            const stationKeys = Object.keys(byStation).sort((a, b) =>
                a.localeCompare(b, 'uk', { numeric: true, sensitivity: 'base' })
            );
            stationKeys.forEach(st => {
                html += `<div class="result-card">
                    <div class="result-top">
                        <span class="result-material-badge"><span class="box-icon">📍</span>Станція ${escapeHtml(st)}</span>
                    </div>`;
                byStation[st].forEach((item, i) => {
                    html += `<div class="article-row"${i === 0 ? ' style="border-top:none; padding-top:0;"' : ''}>
                        <span class="article-number">${escapeHtml(item.mat)}</span>
                        <span class="article-stations">${escapeHtml(item.addr)}</span>
                    </div>`;
                });
                html += `</div>`;
            });
        } else if (state.action === 'стр') {
            // стр: номер станції завжди справа
            const grouped = {};
            rows.forEach(x => {
                const matKey = x.material + "|" + x.address;
                if (!grouped[matKey]) grouped[matKey] = new Set();
                grouped[matKey].add(x.station);
            });
            for (let matKey in grouped) {
                const [matName, matAddr] = matKey.split("|");
                const stationHtmlArr = [...grouped[matKey]]
                    .sort((a, b) => String(a).localeCompare(String(b), 'uk', { numeric: true }))
                    .map(st => escapeHtml(st));
                const stationsHtml = buildStationsHtml(stationHtmlArr);
                html += `<div class="result-card">
                    <div class="result-top">
                        <span class="result-material-badge"><span class="box-icon">📦</span>${escapeHtml(matName)}</span>
                        <span class="result-address-new">${escapeHtml(matAddr)}</span>
                    </div>
                    <div class="article-row" style="border-top:none; padding-top:0; justify-content:flex-end;">
                        <span class="article-stations">${stationsHtml}</span>
                    </div>
                </div>`;
            }
        } else {
            // мм та інші
            const grouped = {};
            rows.forEach(x => {
                const matKey = x.material + "|" + x.address;
                if (!grouped[matKey]) grouped[matKey] = new Set();
                grouped[matKey].add(x.station);
            });
            for (let matKey in grouped) {
                const [matName, matAddr] = matKey.split("|");
                const stationHtmlArr = [...grouped[matKey]].map(st => escapeHtml(st));
                const stationsHtml = buildStationsHtml(stationHtmlArr);
                html += `<div class="result-card">
                    <div class="result-top">
                        <span class="result-material-badge"><span class="box-icon">📦</span>${escapeHtml(matName)}</span>
                        <span class="result-address-new">${escapeHtml(matAddr)}</span>
                    </div>
                    <div class="article-row" style="border-top:none; padding-top:0; justify-content:flex-end;">
                        <span class="article-stations">${stationsHtml}</span>
                    </div>
                </div>`;
            }
        }
    } else if (state.level === 'premontage-categories') {
        const categories = computePremontageCategoriesForArticle(state.article);
        html += `<div class="premontage-title">Артикул ${escapeHtml(state.article)} — передмонтажі</div>`;
        if (!categories.length) {
            html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає передмонтажів для цього артикулу</div>';
        } else {
            html += '<div class="premontage-btn-grid">';
            categories.forEach(c => {
                html += `<button class="premontage-item-btn" data-anav="category" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`;
            });
            html += '</div>';
        }
    } else if (state.level === 'premontage-wires') {
        const wires = computeWiresForCategory(state.article, state.category);
        html += `<div class="premontage-title">${escapeHtml(state.category)} — проводи</div>`;
        if (!wires.length) {
            html += '<div style="text-align:center; padding:40px; color:#aaa;">Проводів не знайдено</div>';
        } else {
            html += '<div class="wire-list">';
            wires.forEach(w => {
                const wireName = String(w.material || "").trim();
                const note = String(w.colD || "").trim();
                const address = String(w.address || "").trim();
                html += `<div class="wire-row">
                    <span class="wire-name">${escapeHtml(wireName)}</span>
                    ${note ? `<span class="wire-code">${escapeHtml(note)}</span>` : ''}
                    <span class="wire-location">${escapeHtml(address)}</span>
                </div>`;
            });
            html += '</div>';
        }
    } else if (state.level === 'wire-stations') {
        const stations = computeWireStationsForArticle(state.article);
        html += `<div class="premontage-title">Артикул ${escapeHtml(state.article)} — станції з проводами</div>`;
        if (!stations.length) {
            html += '<div style="text-align:center; padding:40px; color:#aaa;">Немає станцій з проводами для цього артикулу</div>';
        } else {
            html += '<div class="premontage-btn-grid">';
            stations.forEach(st => {
                html += `<button class="premontage-item-btn" data-anav="wire-station" data-station="${escapeHtml(st)}">${escapeHtml(st)}</button>`;
            });
            html += '</div>';
        }
    } else if (state.level === 'wire-results') {
        const wires = computeWiresForStation(state.article, state.station);
        html += `<div class="premontage-title">Станція ${escapeHtml(state.station)} — проводи (артикул ${escapeHtml(state.article)})</div>`;
        if (!wires.length) {
            html += '<div style="text-align:center; padding:40px; color:#aaa;">Проводів не знайдено</div>';
        } else {
            // Станцію вже обрано — показуємо лише назву провода і адресу
            const seen = new Set();
            wires.forEach(x => {
                const matName = String(x.material || "").trim();
                const matAddr = String(x.address || "").trim();
                const key = matName + "|" + matAddr;
                if (seen.has(key)) return;
                seen.add(key);
                html += `<div class="result-card">
                    <div class="result-top">
                        <span class="result-material-badge"><span class="box-icon">📦</span>${escapeHtml(matName)}</span>
                        <span class="result-address-new">${escapeHtml(matAddr)}</span>
                    </div>
                </div>`;
            });
        }
    }

    return html;
}

function renderArticlesPage() {
    const container = document.getElementById('articles-page-content');
    if (!container) return;
    // Скидаємо зсув після перетягування назад
    container.style.transition = '';
    container.style.transform = '';
    container.style.opacity = '';
    container.innerHTML = buildArticlesLevelHtml(articlesPageStack.length - 1);
}

const articlesPageContent = document.getElementById('articles-page-content');

articlesPageContent.addEventListener('click', (e) => {
    if (e.target.closest('[data-anav="back"]')) {
        popArticlesPageLevel();
        return;
    }
    const btn = e.target.closest('[data-anav]');
    if (!btn) return;
    const nav = btn.dataset.anav;
    const current = articlesPageStack[articlesPageStack.length - 1];

    if (nav === 'article-favorite') {
        toggleArticleFavorite(btn.dataset.article);
        renderArticlesPage();
        return;
    }

    if (nav === 'article') {
        articlesPageStack.push({ level: 'actions', article: btn.dataset.article });
        renderArticlesPage();
        return;
    }
    if (nav === 'action') {
        const action = btn.dataset.action;
        if (action === 'передмонтаж') {
            articlesPageStack.push({ level: 'premontage-categories', article: current.article });
        } else if (action === 'проводи') {
            articlesPageStack.push({ level: 'wire-stations', article: current.article });
        } else {
            articlesPageStack.push({ level: 'results', article: current.article, action });
        }
        renderArticlesPage();
        return;
    }
    if (nav === 'category') {
        articlesPageStack.push({ level: 'premontage-wires', article: current.article, category: btn.dataset.category });
        renderArticlesPage();
        return;
    }
    if (nav === 'wire-station') {
        articlesPageStack.push({ level: 'wire-results', article: current.article, station: btn.dataset.station });
        renderArticlesPage();
        return;
    }
});

function search() {
    const v = input.value.toLowerCase();
    if (!v) { resultBox.innerHTML = ""; return; }
    const isNumOnly = /^\d+$/.test(v);
    const isSpecialSearch = v.includes("стр") || v.includes("мм") || v.includes("ts");

    const filtered = searchData.filter(x => {
        if (isSpecialSearch) return x.colD.toLowerCase().startsWith(v);
        if (isNumOnly) {
            return x.station.toLowerCase().endsWith(v)
                || x.material.toLowerCase().endsWith(v)
                || x.article.toLowerCase().endsWith(v)
                || x.colD.toLowerCase().endsWith(v)
                || x.address.toLowerCase().endsWith(v);
        }
        return x.station.toLowerCase().startsWith(v)
            || x.material.toLowerCase().startsWith(v)
            || x.article.toLowerCase().startsWith(v)
            || x.colD.toLowerCase().startsWith(v)
            || x.address.toLowerCase().startsWith(v);
    });

    if (!filtered.length) { resultBox.innerHTML = '<div style="text-align:center; padding:40px; color:#aaa;">Не знайдено</div>'; return; }

    let html = "";
    searchCardKeys = [];
    searchResultLookup = {};

    // Групуємо по матеріалу (+адреса), щоб не повторювати
    // назву матеріалу для кожного артикула окремо. Дизайн карток — як на скріншоті.
    const grouped = {};
    filtered.forEach(x => {
        const matKey = x.material + "|" + x.address;
        if (!grouped[matKey]) grouped[matKey] = {};
        if (!grouped[matKey][x.article]) grouped[matKey][x.article] = new Set();
        grouped[matKey][x.article].add(x.station);
    });
    for (let matKey in grouped) {
        const [matName, matAddr] = matKey.split("|");
        const matHtml = isSpecialSearch ? escapeHtml(matName) : highlight(matName, v, isNumOnly);
        const addrHtml = isSpecialSearch ? escapeHtml(matAddr) : highlight(matAddr, v, isNumOnly);

        const mergedArticles = mergeAbbreviatedArticles(grouped[matKey]);

        const articlesPlain = {};
        for (let art in mergedArticles) articlesPlain[art] = [...mergedArticles[art]];
        searchResultLookup[matKey] = { material: matName, address: matAddr, articles: articlesPlain };
        const cardIdx = searchCardKeys.push(matKey) - 1;
        const selected = isInWaitlist(matKey);

        html += `<div class="result-card">
            <div class="result-top">
                <span class="result-material-badge"><span class="box-icon">📦</span>${matHtml}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="result-address-new">${addrHtml}</span>
                    <button class="select-btn${selected ? ' selected' : ''}" data-idx="${cardIdx}">${selected ? '★' : '☆'}</button>
                </div>
            </div>`;
        for (let art in mergedArticles) {
            const artHtml = renderArticleNumber(art, v, isNumOnly, isSpecialSearch);
            const stationHtmlArr = [...mergedArticles[art]]
                .map(st => isSpecialSearch ? escapeHtml(st) : highlight(st, v, isNumOnly));
            const stationsHtml = buildStationsHtml(stationHtmlArr);
            html += `<div class="article-row">
                <span class="article-number">${artHtml}</span>
                <span class="article-stations">${stationsHtml}</span>
            </div>`;
        }
        html += `</div>`;
    }

    resultBox.innerHTML = html;
}


/* ---------- Дата останнього оновлення (для аркушів з групами артикулів) ---------- */
function formatDate(ts) {
    const d = new Date(parseInt(ts, 10));
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- Навігація між сторінками (єдиний свайп) ---------- */
function goToPage(n) {
    n = Math.max(0, Math.min(TOTAL_PAGES - 1, n));
    currentPage = n;
    pagesEl.style.transform = `translateX(-${n * pageWidthPercent}%)`;
    for (let i = 0; i < TOTAL_PAGES; i++) {
        document.getElementById('dot' + i).classList.toggle('active', i === n);
    }

    if (n === SEARCH_PAGE_INDEX) {
        kbWrapper.classList.remove('hidden');
    } else {
        kbWrapper.classList.add('hidden');
        if (n === 0) {
            renderWaitlistPage();
        } else if (n === ARTICLES_PAGE_INDEX) {
            renderArticlesPage();
        }
    }
}

/*
   ЄДИНИЙ горизонтальний свайп для всього застосунку.

   Тут навмисно НЕМАЄ окремого "внутрішнього" свайпу для:
   Артикул -> Дії -> Передмонтаж -> KNDS -> ...

   Тобто всюди використовується один і той самий механізм, що й
   на основних сторінках: палець тягне #pages за собою, а після
   відпускання відкривається найближча основна сторінка.

   Внутрішні сторінки артикулів змінюються ТІЛЬКИ натисканням кнопок
   "Назад" / потрібного пункту, без окремої логіки бокового свайпу.
*/
let pageDragStartX = 0;
let pageDragStartY = 0;
let pageDragBasePage = 0;
let pageDragging = false;
let pageMoved = false;
let pageDragPxWidth = 0;
let pageSwipeCandidate = false;
let suppressNextClick = false;

// Один горизонтальний свайп для всіх сторінок.
// Важливо: сам swipe починається тільки після помітного горизонтального руху.
// Звичайний тап по кнопці тому не перехоплюється.
const PAGE_SWIPE_START_PX = 14;

function finishPageDrag(dx) {
    const SWIPE_THRESHOLD = Math.max(55, pageDragPxWidth * 0.20);

    let target = pageDragBasePage;
    if (Math.abs(dx) >= SWIPE_THRESHOLD) {
        const dir = dx > 0 ? -1 : 1; // вправо -> попередня, вліво -> наступна
        target = Math.max(0, Math.min(TOTAL_PAGES - 1, pageDragBasePage + dir));
    }

    pagesEl.style.transition = 'transform 0.3s cubic-bezier(0.4,0,0.2,1)';
    currentPage = target;
    pagesEl.style.transform = `translateX(-${target * pageWidthPercent}%)`;

    for (let i = 0; i < TOTAL_PAGES; i++) {
        document.getElementById('dot' + i).classList.toggle('active', i === target);
    }

    if (target === SEARCH_PAGE_INDEX) {
        kbWrapper.classList.remove('hidden');
    } else {
        kbWrapper.classList.add('hidden');
        if (target === 0) renderWaitlistPage();
        else if (target === ARTICLES_PAGE_INDEX) renderArticlesPage();
    }
}

// Починаємо відстежувати жест, але НЕ вимикаємо перехід і НЕ змінюємо DOM
// на самому touchstart. Це прибирає випадкове "перше натискання не спрацювало".
document.addEventListener('touchstart', e => {
    if (!e.touches || e.touches.length !== 1) return;

    const touch = e.touches[0];
    pageDragStartX = touch.clientX;
    pageDragStartY = touch.clientY;
    pageDragBasePage = currentPage;
    pageDragPxWidth = (pagesEl.parentElement ? pagesEl.parentElement.clientWidth : window.innerWidth) || window.innerWidth;

    pageDragging = true;
    pageMoved = false;
    pageSwipeCandidate = true;
}, { passive: true });

document.addEventListener('touchmove', e => {
    if (!pageDragging || !pageSwipeCandidate || !e.touches || e.touches.length !== 1) return;

    const touch = e.touches[0];
    const dx = touch.clientX - pageDragStartX;
    const dy = touch.clientY - pageDragStartY;

    // Спочатку визначаємо напрямок жесту.
    // До цього моменту кнопки отримують звичайний тап.
    if (!pageMoved) {
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        if (Math.max(absX, absY) < PAGE_SWIPE_START_PX) return;

        // Вертикальний рух — віддаємо жест скролу.
        if (absY > absX) {
            pageDragging = false;
            pageSwipeCandidate = false;
            return;
        }

        // Лише тепер справді починаємо свайп сторінок.
        pageMoved = true;
        pagesEl.style.transition = 'none';
    }

    const maxDelta = pageDragPxWidth;
    const limitedDx = Math.max(-maxDelta, Math.min(maxDelta, dx));
    let livePos = pageDragBasePage - limitedDx / pageDragPxWidth;
    livePos = Math.max(0, Math.min(TOTAL_PAGES - 1, livePos));
    pagesEl.style.transform = `translateX(-${livePos * pageWidthPercent}%)`;
}, { passive: true });

document.addEventListener('touchend', e => {
    if (!pageDragging) return;

    const wasSwipe = pageMoved;
    pageDragging = false;
    pageSwipeCandidate = false;

    if (!wasSwipe) {
        // Звичайний тап — нічого не робимо.
        if (
            currentPage === SEARCH_PAGE_INDEX &&
            !kbWrapper.contains(e.target) &&
            !e.target.closest('.select-btn') &&
            !e.target.closest('[data-anav]')
        ) {
            kbWrapper.classList.toggle('hidden');
        }
        return;
    }

    const changedTouch = e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : null;
    const dx = changedTouch ? changedTouch.clientX - pageDragStartX : 0;

    // Після справжнього свайпу браузер може надіслати synthetic click
    // по елементу під пальцем. Наступний такий click блокуємо.
    suppressNextClick = true;
    finishPageDrag(dx);
    setTimeout(() => { suppressNextClick = false; }, 400);
}, { passive: true });

// Блокуємо лише click, який згенерувався після реального swipe.
document.addEventListener('click', e => {
    if (!suppressNextClick) return;
    suppressNextClick = false;
    e.preventDefault();
    e.stopPropagation();
}, true);

// Свайп вгору по знайденому тексту (результатах пошуку) — ховає клавіатуру одразу на початку руху
const scrollAreaEl = document.querySelector('#page0 .scroll-area');
let resultStartY = 0;
scrollAreaEl.addEventListener('touchstart', (e) => {
    resultStartY = e.touches[0].clientY;
}, {passive:true});
scrollAreaEl.addEventListener('touchmove', (e) => {
    if (kbWrapper.classList.contains('hidden')) return;
    const dy = e.touches[0].clientY - resultStartY;
    if (dy < -8) { // рух вгору щойно почався — ховаємо клавіатуру негайно
        kbWrapper.classList.add('hidden');
    }
}, {passive:true});
// підстраховка: якщо контент прогорнувся програмно/інерцією без явного touchmove-тригера
scrollAreaEl.addEventListener('scroll', () => {
    if (scrollAreaEl.scrollTop > 4 && !kbWrapper.classList.contains('hidden')) {
        kbWrapper.classList.add('hidden');
    }
}, {passive:true});
</script>
