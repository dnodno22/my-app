<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Пошук</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, Arial, sans-serif;
    background: #fff;
    touch-action: none;
}
#pages {
    display: flex;
    width: 300%; /* Початкове розташування без очікування JavaScript */
    height: 100%;
    transform: translateX(-33.333333%); /* Одразу показуємо сторінку пошуку */
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.page {
    width: 33.333333%; /* Геометрія сторінок доступна ще до запуску JS */
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
}
/* ==================== SEARCH PAGE ==================== */
.search-header {
    padding: 16px 16px 8px;
    padding-top: calc(30px + env(safe-area-inset-top));
    flex-shrink: 0;
}
#page-articles .scroll-area {
    padding-top: calc(30px + env(safe-area-inset-top));
}
input#input {
    width: 100%;
    padding: 16px 18px;
    font-size: 22px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    text-align: center;
    outline: none;
    background: #f9fafb;
    color: #111;
    caret-color: transparent;
    height: 60px;
}
.scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 16px 16px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}
/* ==================== КРАПОЧКИ ГЛИБИНИ АРТИКУЛІВ ==================== */
.articles-dots {
    position: fixed;
    bottom: calc(8px + env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    height: 18px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 7px;
    z-index: 30;
    pointer-events: none;
}
.articles-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d1d5db;
    transition: all 0.2s ease;
}
.articles-dots .dot.past {
    background: #9ca3af;
}
.articles-dots .dot.active {
    width: 9px;
    height: 9px;
    background: #111827;
}
/* ==================== СВАЙП ВНУТРІШНІХ РІВНІВ ==================== */
.articles-drag-wrapper {
    display: flex;
    align-items: flex-start;
    width: 200%;
    will-change: transform;
}
.articles-drag-pane {
    width: 50%;
    flex: 0 0 50%;
    box-sizing: border-box;
    min-width: 0;
    padding: 0;
}
#page-articles.articles-swiping .scroll-area {
    overflow-y: hidden;
    touch-action: none;
}
#page-articles,
#page-articles * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
#page-articles table,
#page-articles td,
#page-articles th,
#page-articles .result-card,
#page-articles .premontage-title {
    touch-action: pan-y;
}
/* Заборона системного виділення / "Копіювати" на пошуку, обраних і панелях */
#page0,
#page0 *,
#page-waitlist,
#page-waitlist *,
#pm-qty-panel,
#pm-qty-panel * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
/* Поля коментаря лишаються редагованими */
#page0 textarea,
#page-waitlist textarea,
#pm-qty-panel textarea,
#page-articles textarea {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
}
/* ==================== RESULT CARDS ==================== */
.result-card {
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    padding: 24px;
    margin-bottom: 16px;
}
.result-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}
.result-material-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #111111;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.1;
    white-space: nowrap;
}
.result-address-new {
    font-weight: 600;
    font-size: 14px;
    color: #059669;
    white-space: nowrap;
    text-align: right;
}
/* Іконки та зірочка: лише у класичному режимі / лише в читабельному */
body.interface-readable .ico {
    display: none;
}
body.interface-readable .star-right {
    display: none;
}
body.interface-classic .star-left {
    display: none;
}
/* Адреса на сторінці пошуку (читабельний режим): чорний шрифт у рамці */
body.interface-readable #result .result-address-new,
body.interface-readable #waitlist-result .result-address-new {
    color: #111111;
    font-size: 15px;
    font-weight: 700;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 14px;
    padding: 8px 14px;
}
.article-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid #ECECEC;
}
.article-row:first-child {
    border-top: none;
    padding-top: 0;
}
/* Обраний артикул у результатах пошуку: смужка зліва без заливки рядка */
/* Обраний артикул у результатах пошуку: лівий край рамки кольорового відтінку */
.art-r.art-r-fav {
    border-left: 4px solid #003366;
    padding-left: 11px;
}
.article-number {
    font-size: 15px;
    font-weight: 700;
    color: #111111;
    white-space: nowrap;
}
.article-number .art-g1 {
    margin-right: 3px;
}
.article-number .art-g2 {
    font-size: 1.2em;
    margin-right: 3px;
}
.article-stations {
    font-size: 20px;
    font-weight: 800;
    color: #111111;
    text-align: right;
    line-height: 1.3;
}
.article-row .article-stations {
    flex: 1;
    min-width: 0;
}
.station-list-classic {
    display: none;
}
.station-list-readable {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 4px;
}
.station-chip {
    display: inline-flex;
    min-width: 34px;
    min-height: 30px;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #f3f4f6;
    color: #111;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
}
body.interface-classic .station-list-classic {
    display: block;
}
body.interface-classic .station-list-readable {
    display: none;
}
body.interface-readable .station-list-classic {
    display: none;
}
body.interface-readable .station-list-readable {
    display: flex;
}
/* Читабельний вигляд артикулу: проєкт (сірий) · НАЗВА (акцент) · стан (сірий) */
.art-classic {
    display: inline;
}
.art-readable {
    display: none;
}
body.interface-classic .art-classic {
    display: inline;
}
body.interface-classic .art-readable {
    display: none;
}
body.interface-readable .art-classic {
    display: none;
}
body.interface-readable .art-readable {
    display: inline-flex;
}
.art-r {
    align-items: baseline;
    gap: 2px;
    white-space: nowrap;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 14px;
    padding: 8px 14px;
}
.art-r-base {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.15;
    color: #111;
}
.art-r-stack {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
}
.art-r-stan {
    font-size: 14px;
    font-weight: 700;
    color: #6b7280;
    margin-left: 1px;
}
/* ==================== СПИСОК ОЧІКУВАННЯ ==================== */
.wl-menu-btn {
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #111;
    font-size: 20px;
    line-height: 1;
    border-radius: 10px;
    padding: 6px 10px;
    margin-left: 12px;
    cursor: pointer;
    touch-action: manipulation;
}
.wl-menu-btn.open {
    background: #eef2ff;
    border-color: #c7d2fe;
    color: #4338ca;
}
.wl-history {
    position: absolute;
    left: 16px;
    right: 16px;
    top: calc(88px + env(safe-area-inset-top));
    z-index: 40;
    max-height: 60%;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    padding: 6px 0;
    touch-action: pan-y;
}
.wl-history-title {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 800;
    color: #6b7280;
}
.wl-history-row {
    display: flex;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid #f0f0f0;
    font-size: 14px;
    color: #111;
}
.wl-history-time {
    flex-shrink: 0;
    min-width: 78px;
    font-size: 12px;
    font-weight: 700;
    color: #6b7280;
}
.wl-history-text {
    word-break: break-word;
}
.wl-history-empty {
    padding: 12px 14px;
    font-size: 14px;
    color: #9ca3af;
}
.waitlist-title {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #111111;
    text-align: center;
    padding: 8px 0;
}
.select-btn {
    border: none;
    background: transparent;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    color: #d1d5db;
    flex-shrink: 0;
}
.select-btn.selected {
    color: #FFC400;
}
.select-btn:active {
    transform: scale(.9);
}
.article-choice-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
}
.article-choice-main {
    flex: 1;
    min-width: 0;
}
.article-favorite-btn {
    width: 54px;
    min-width: 54px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #9ca3af;
    border-radius: 14px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
}
.article-favorite-btn.selected {
    color: #FFC400;
    background: #fffaf0;
    border-color: #f3d37a;
}
.article-favorite-btn:active {
    transform: scale(.96);
}
.waitlist-actions-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
}
.waitlist-remove-btn {
    border: none;
    background: #fff7e0;
    color: #b45309;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    flex: 1;
    text-align: center;
    cursor: pointer;
}
.waitlist-remove-btn:active {
    background: #fdeeca;
}
.comment-toggle-btn {
    border: none;
    background: #eef2ff;
    color: #4338ca;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    flex: 1;
    text-align: center;
    cursor: pointer;
}
.comment-toggle-btn:active {
    background: #e0e7ff;
}
.comment-edit-area {
    margin-top: 12px;
}
.comment-textarea {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 64px;
    outline: none;
    color: #111;
    background: #f9fafb;
}
.comment-save-btn {
    display: block;
    margin-top: 8px;
    border: none;
    background: #4338ca;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    width: 100%;
    text-align: center;
    cursor: pointer;
}
.comment-save-btn:active {
    background: #372ea8;
}
.waitlist-comment-text {
    margin-top: 12px;
    padding: 10px 12px;
    background: #f3f4f6;
    border-radius: 10px;
    font-size: 14px;
    color: #374151;
    white-space: pre-wrap;
    word-break: break-word;
}
/* ==================== ПАНЕЛЬ ПЕРЕДМОНТАЖУ ==================== */
.premontage-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
}
.premontage-nav-btn {
    border: none;
    background: #eef2ff;
    color: #4338ca;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
}
.premontage-nav-btn:active {
    background: #e0e7ff;
}
.premontage-nav-btn.active {
    background: #4338ca;
    color: #fff;
}
.premontage-close-btn {
    background: #fff7e0;
    color: #b45309;
    margin-left: auto;
}
.premontage-close-btn:active {
    background: #fdeeca;
}
.premontage-title {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    margin-bottom: 14px;
}
.level-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}
.level-head-left {
    font-size: 20px;
    font-weight: 800;
    color: #111;
}
.level-head-main {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.level-head-tail {
    font-size: 0.7em;
    font-weight: 700;
    color: #6b7280;
    margin-left: 1px;
}
.level-head-right {
    font-size: 20px;
    font-weight: 800;
    color: #111;
    text-align: right;
}
.premontage-btn-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}
.premontage-item-btn {
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #111;
    font-weight: 700;
    font-size: 15px;
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    white-space: normal;
    word-break: break-word;
}
.premontage-item-btn:active {
    background: #eef2ff;
}
.premontage-item-btn.favorite {
    background: #fffaf0;
    border-color: #f3d37a;
}
.wire-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.wire-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px 14px;
}
.wire-name {
    font-weight: 800;
    font-size: 16px;
    color: #111;
    flex-shrink: 0;
}
.wire-code {
    font-size: 13px;
    color: #6b7280;
    flex: 1;
    text-align: center;
}
.wire-location {
    font-weight: 600;
    font-size: 14px;
    color: #059669;
    text-align: right;
    white-space: nowrap;
}
#pull-indicator {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    width: 38px;
    height: 38px;
    margin-left: 0;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #4338ca;
    opacity: 0;
    transform: translate(-50%, -30px) scale(0.6);
    pointer-events: none;
    z-index: 50;
}
#pull-indicator.ready {
    background: #eef2ff;
}
#pull-indicator .pull-arrow {
    display: inline-block;
    line-height: 1;
}
/* ==================== КІЛЬКІСТЬ → ОБРАНЕ ==================== */
.mat-pick {
    border: none;
    background: transparent;
    font: inherit;
    color: inherit;
    padding: 4px 6px;
    margin: -4px -6px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    touch-action: manipulation;
}
.mat-pick:active {
    background: #eef2ff;
}
.mat-pick.qty-target {
    outline: 2px solid #4338ca;
    background: #eef2ff;
}
input#input.qty-mode {
    background: #eef2ff;
    border-color: #4338ca;
}
.qty-bar {
    margin-bottom: 10px;
}
.qty-title {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    text-align: center;
    margin-bottom: 8px;
    word-break: break-word;
}
.qty-bar .comment-textarea {
    min-height: 48px;
    margin-bottom: 8px;
}
.qty-actions {
    display: flex;
    gap: 8px;
}
.qty-btn {
    flex: 1;
    border: 1px solid #222;
    background: #fff;
    color: #222;
    font-weight: 700;
    font-size: 14px;
    border-radius: 8px;
    padding: 12px 0;
    touch-action: manipulation;
    user-select: none;
}
.qty-btn:active {
    transform: scale(.97);
}
.qty-btn.qty-comment {
    background: #eef2ff;
    border-color: #c7d2fe;
    color: #4338ca;
}
.qty-btn.qty-cancel {
    flex: 0 0 52px;
    background: #fff7e0;
    border-color: #f3d37a;
    color: #b45309;
}
.qty-btn.qty-ok {
    background: #4338ca;
    border-color: #4338ca;
    color: #fff;
}
.waitlist-qty {
    font-weight: 800;
    font-size: 20px;
    color: #111;
    margin-left: 12px;
    padding-left: 12px;
    border-left: 2px solid #d1d5db;
    white-space: nowrap;
}
.waitlist-divider {
    height: 1px;
    background: #e5e7eb;
    margin-top: 14px;
}
/* ==================== ОБРАНЕ: БЛОК ПЕРЕДМОНТАЖІВ АРТИКУЛУ ==================== */
.pm-group-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}
.pm-group-article {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 22px;
    font-weight: 800;
    color: #111;
    margin-bottom: 10px;
}
.pm-group-clear-btn {
    border: none;
    background: #fff7e0;
    color: #b45309;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
}
.pm-group-clear-btn:active {
    background: #fdeeca;
}
/* Гліф: синя смужка зліва на рамці обраного артикулу */
.pm-group-article-frame.art-r-fav {
    border-left: 4px solid #003366;
    padding-left: 11px;
}
.pm-group-article-frame {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    white-space: nowrap;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 14px;
    padding: 8px 14px;
}
.pm-group-item {
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
}
.pm-group-item.qty-target {
    outline: 2px solid #4338ca;
    background: #eef2ff;
}
.pm-group-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}
.waitlist-qty-right,
.pm-group-right .waitlist-qty {
    margin-left: 0;
    padding-left: 0;
    border-left: none;
}
.pm-group-addr {
    font-size: 14px;
    font-weight: 700;
    color: #059669;
    white-space: nowrap;
}
.pm-group-kind {
    margin-left: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #6b7280;
}
.pm-group-chips {
    display: inline-flex;
    margin-left: 8px;
    vertical-align: middle;
}
.pm-group-chips .station-list-readable {
    justify-content: flex-start;
}
.pm-group-stations-small {
    margin-left: 0;
    margin-top: 4px;
}
.pm-group-stations {
    margin-top: 8px;
    font-size: 15px;
}
.result-card.qty-target,
.wire-row.qty-target {
    outline: 2px solid #4338ca;
    background: #eef2ff;

function normalizeArticlePart(part) {
    return String(part || "")
        .trim()
        .replace(/\s+/g, "");
}
function getArticleBase(code) {
    if (/^\d{7}/.test(code) && code.length > 7) {
        return code.slice(0, 7);
    }
    return code;
}
function expandArticleValue(raw) {
    const k = String(raw || "");
    let r = _expandCache.get(k);
    if (r === undefined) {
        r = expandArticleValueRaw(k);
        _expandCache.set(k, r);
    }
    return r;
}
function expandArticleValueRaw(raw) {
    raw = String(raw || "").trim();
    if (!raw) return [];
    const parts = raw
        .split("/")
        .map(normalizeArticlePart)
        .filter(Boolean);
    if (!parts.length) return [];
    if (parts.length === 1) {
        return [getArticleBase(parts[0])];
    }
    const first = getArticleBase(parts[0]);
    const result = [first];
    let prefix = "";
    if (/^\d+$/.test(first) && first.length >= 3) {
        prefix = first.slice(0, -3);
    }
    for (let i = 1; i < parts.length; i++) {
        const part = parts[i];
        if (/^\d{1,3}$/.test(part) && prefix) {
            result.push(
                prefix + part.padStart(3, "0")
            );
        } else {
            result.push(
                getArticleBase(part)
            );
        }
    }
    return [...new Set(result)];
}

function computeArticleGroups() {
    const groups = {};
    searchData.forEach(row => {
        const articles =
            expandArticleValue(row.article);
        articles.forEach(article => {
            if (!article) return;
            if (!groups[article]) {
                groups[article] = [];
            }
            groups[article].push(row);
        });
    });
    Object.keys(groups).forEach(article => {
        const seen = new Set();
        groups[article] =
            groups[article].filter(row => {
                const key = [
                    row.station,
                    row.material,
                    row.article,
                    row.colD,
                    row.address
                ].join("|||");
                if (seen.has(key)) {
                    return false;
                }
                seen.add(key);
                return true;
            });
    });
    const keys =
        Object.keys(groups).sort((a, b) =>
            a.localeCompare(
                b,
                "uk",
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
        );
    return keys.map(article => ({
        article,
        rows: groups[article]
    }));
}

function fetchSearchData() {

        SEARCH_GIDS.map(gid =>
            fetch(
                `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}&t=` +
                stamp
            )
                .then(r => r.ok ? r.text() : null)
                .then(t => {
                    /* Відсікаємо порожні відповіді та HTML-сторінки помилок */
                    if (
                        t === null ||
                        !t.trim() ||
                        /^\s*</.test(t)
                    ) {
                        return null;
                    }
                    return t;
                })
                .catch(() => null)
        )
    ).then(texts => {
        let changed = false;
        texts.forEach((t, i) => {
            if (t === null) return;
            const key = gidCacheKey(SEARCH_GIDS[i]);
            if (localStorage.getItem(key) !== t) {
                localStorage.setItem(key, t);
                changed = true;
            }
        });
        if (texts.some(t => t !== null)) {
            localStorage.setItem(
                CACHE_KEY_SEARCH_TIME,
                Date.now().toString()
            );
        }
        if (!changed) {
            /* Дані не змінились — нічого не перебудовуємо */
            return;
        }
        const all = SEARCH_GIDS.map(g => ({
            gid: g,
            text:
                localStorage.getItem(gidCacheKey(g)) ||

        refreshArticleGroups();

                `<span class="art-g3">${part(g2end, len)}</span>`;
        }
    }
    if (!fancy) {
        return html;
    }
    /* Кілька артикулів в одному записі (через "/") — в одній рамці */
    if (String(art).includes("/")) {
        return `<span class="art-classic">${html}</span>` +
            `<span class="art-readable">${readableMultiArticleHtml(art, v, isNumOnly, isSpecialSearch)}</span>`;
    }
    /* Читабельний варіант: як у шапці рівня — артикул + дрібний сірий стан, в рамці */
    const favBase = expandArticleValue(art)[0];
    const isFav =
        Boolean(favBase) &&
        loadArticleFavorites().includes(favBase);
    let readable =
        '<span class="art-r' +
        (isFav ? ' art-r-fav' : '') + '">';
    readable +=
        `<span class="art-r-base">${part(0, g2end)}</span>`;
    if (len > 7) {
        readable +=
            `<span class="art-r-stan">${part(g2end, len)}</span>`;
    }
    readable += '</span>';
    return `<span class="art-classic">${html}</span>` +
        `<span class="art-readable">${readable}</span>`;
}

const CACHE_KEY_WAITLIST =

const CACHE_KEY_WL_LOG = "waitlistHistory";

function pushWaitlistLog(texts) {
    if (!texts.length) return;
    try {

        texts.forEach(x => log.unshift({ t, text: x }));

            CACHE_KEY_WL_LOG,

function wlLabel(item) {
    let l =
        (item.kind ? item.kind + ' ' : '') +
        String(item.material || '');
    if (item.kind && item.station) {
        l += ' ст. ' + item.station;
    }
    const k = String(item.key || '');
    if (k.startsWith('pm|') || k.startsWith('spts|')) {
        l += ' (арт. ' + k.split('|')[1] + ')';
    }
    return l.trim();
}
function wlDiffTexts(prev, next) {
    const prevMap = new Map(prev.map(i => [i.key, i]));
    const nextMap = new Map(next.map(i => [i.key, i]));
    const out = [];
    const added = [];
    const removed = [];
    next.forEach(i => {
        const o = prevMap.get(i.key);
        if (!o) {
            added.push(i);
            return;
        }
        const oq = o.qty ? String(o.qty) : '';
        const nq = i.qty ? String(i.qty) : '';
        const oc = String(o.comment || '').trim();
        const nc = String(i.comment || '').trim();
        if (oq !== nq) {
            out.push(
                'Змінено: ' + wlLabel(i) + ' · ' +
                (oq ? oq + ' → ' : '') +
                (nq || 'без кількості')
            );
        } else if (oc !== nc) {
            out.push(
                'Коментар: ' + wlLabel(i) +
                (nc ? '' : ' (прибрано)')
            );
        }
    });
    prev.forEach(o => {
        if (!nextMap.has(o.key)) removed.push(o);
    });
    if (added.length > 2) {
        out.push('Додано: ' + added.length + ' позицій');
    } else {
        added.forEach(i =>
            out.push(
                'Додано: ' + wlLabel(i) +
                (i.qty ? ' · ' + i.qty : '')
            )
        );
    }
    if (removed.length > 2) {
        out.push('Видалено: ' + removed.length + ' позицій');
    } else {
        removed.forEach(o =>
            out.push(
                'Видалено: ' + wlLabel(o) +
                (o.qty ? ' · ' + o.qty : '')
            )
        );
    }
    return out;
}
function saveWaitlist(list) {
    const prev = loadWaitlist();
    localStorage.setItem(
        CACHE_KEY_WAITLIST,
        JSON.stringify(list)

        pushWaitlistLog(wlDiffTexts(prev, list));
    } catch (e) {
        /* Історія не має блокувати збереження */
    }
    /* Позначки «є в обраних» на панелі артикулів мають оновитись */

const TAP_STATS_KEY = 'tapStats';
function loadTapStats() {

        return Array.isArray(a) ? a : [];

function saveTapStat(ms) {

let tapT0 = 0, tapX = 0, tapY = 0, tapMoved = false;
document.addEventListener('touchstart', e => {
    if (!e.touches || e.touches.length !== 1) { tapT0 = 0; return; }
    tapT0 = performance.now();
    tapX = e.touches[0].clientX;
    tapY = e.touches[0].clientY;
    tapMoved = false;
}, { capture: true, passive: true });
document.addEventListener('touchmove', e => {
    if (!tapT0 || !e.touches.length) return;
    if (
        Math.abs(e.touches[0].clientX - tapX) > 10 ||
        Math.abs(e.touches[0].clientY - tapY) > 10
    ) tapMoved = true;
}, { capture: true, passive: true });
document.addEventListener('touchend', () => {
    if (tapT0 && !tapMoved) {
        const d = performance.now() - tapT0;
        if (d < 3000) saveTapStat(d);
    }
    tapT0 = 0;
}, { capture: true, passive: true });
function tapStatsRow(label, arr) {
    if (!arr.length) {
        return `<div class="wl-history-row"><span class="wl-history-text">${label}: —</span></div>`;
    }
    const a = [...arr].sort((x, y) => x - y);
    const q = f => a[Math.min(a.length - 1, Math.floor(f * a.length))];
    const avg = Math.round(a.reduce((x, y) => x + y, 0) / a.length);
    return `<div class="wl-history-row"><span class="wl-history-text">${label} (${a.length}): сер. ${avg} мс · мед. ${q(0.5)} · 90% ${q(0.9)} · макс ${a[a.length - 1]}</span></div>`;
}
function renderTapStatsHtml() {
    const all = loadTapStats();

        tapStatsRow('Тапи', taps) +

}

function pmArticleOfItem(item) {
    const k = String((item && item.key) || "");
    if (k.startsWith('pm|') || k.startsWith('spts|')) {
        const art = k.split('|')[1];
        return art ? art : null;
    }
    /* Звичайний матеріал: у блок артикулу лише якщо введена кількість і артикул один; зірочка без кількості лишається окремою карткою */
    if (!item) return null;
    if (!item.qty || !item.articles) return null;
    const keys = Object.keys(item.articles);
    if (keys.length !== 1) return null;

function addWaitlistWithQty(key, data, qty, comment) {

/* ==================== MERGE ARTICLE ==================== */
function mergeAbbreviatedArticles(articleMap) {
    const arts =
        Object.keys(articleMap);
    const fullArts =
        arts.filter(
            a => a.length > 3
        );
    const shortArts =
        arts.filter(
            a => a.length <= 3
        );
    if (!shortArts.length) {
        return articleMap;
    }
    const fullByLast3 = {};
    fullArts.forEach(a => {
        const last3 =
            a.slice(-3);
        if (!fullByLast3[last3]) {
            fullByLast3[last3] = a;
        }
    });
    const merged = {};
    fullArts.forEach(a => {
        merged[a] =
            new Set(articleMap[a]);
    });
    shortArts.forEach(shortArt => {
        const target =
            fullByLast3[shortArt];
        if (target) {
            articleMap[shortArt]
                .forEach(st =>
                    merged[target].add(st)
                );
        } else {
            if (!merged[shortArt]) {
                merged[shortArt] =
                    new Set();
            }
            articleMap[shortArt]
                .forEach(st =>
                    merged[shortArt].add(st)
                );
        }
    });
    return merged;
}
/* ==================== ПЕРЕДМОНТАЖ ==================== */
function isPremontageName(value) {
    const raw =
        String(value || "").trim();
    if (!raw) return false;
    /*
        Назва передмонтажу: починається з літери, може містити
        цифри, _ - * і далі через пробіл ще частини
        (наприклад "KNDS 15825134", "lds1 15812345").
    */
    return /^[A-Za-zА-Яа-яІіЇїЄєҐґ][A-Za-zА-Яа-яІіЇїЄєҐґ0-9_*-]*(?:\s+[A-Za-zА-Яа-яІіЇїЄєҐґ0-9_*-]+)*$/
        .test(raw);
}
function getPremontageRows() {
    return searchData.filter(
        row =>
            isPremontageName(row.station) &&
            row.article
    );
}
function getSearchRowsForFilters() {
    const materialFilters =
        selectedSearchFilters.filter(filter =>
            ['wires', 'materials']
                .includes(filter)
        );
    const sourceFilters =
        selectedSearchFilters.filter(filter =>
            SEARCH_SOURCE_FILTERS.includes(filter)
        );
    return searchData.filter(row => {
        const matchesMaterial =
            !materialFilters.length ||
            materialFilters.some(filter => {
                if (filter === 'wires') {
                    return isWireMaterial(
                        row.material
                    );
                }
                if (filter === 'materials') {
                    const material =
                        String(row.material || "").trim();
                    const hasNote =
                        String(row.colD || "").trim();
                    const noted152 =
                        /^152/.test(material) &&
                        Boolean(hasNote);
                    return material &&
                        !/^158/.test(material) &&
                        (
                            noted152 ||
                            !isWireMaterial(material)
                        );
                }
                return false;
            });
        const matchesSource =
            !sourceFilters.length ||
            sourceFilters.some(filter => {
                if (filter === 'audi') {
                    return row.sourceGid === AUDI_GID;
                }
                if (filter === 'bmw') {
                    return row.sourceGid === BMW_GID;
                }
                return row.sourceGid === PREMONTAGE_AUDI_GID;
            });
        return (
            matchesMaterial &&
            matchesSource
        );
    });
}
function premontageArticleMatches(
    row,
    article
) {
    if (!row || !article) {
        return false;
    }
    return expandArticleValue(
        row.article
    ).includes(
        String(article).trim()
    );
}
function computePremontageCategoriesForArticle(
    article
) {
    const categories = new Set();
    getPremontageRows().forEach(row => {
        if (
            !premontageArticleMatches(
                row,
                article
            )
        ) return;
        const name =
            String(
                row.station || ""
            ).trim();
        if (name) {
            categories.add(name);
        }
    });
    /*
        Постанційно: номер на 158… у назві передмонтажу шукаємо в матеріалах
        рядків із номером станції цього ж артикулу; сортуємо за найменшою
        станцією. Без збігу — в кінці, за назвою.
    */
    const stationOf158 = {};
    searchData.forEach(row => {
        if (isPremontageName(row.station)) return;
        if (!premontageArticleMatches(row, article)) return;
        const st = String(row.station || "").trim();
        if (!st) return;
        const tokens =
            String(row.material || "").match(/158\d+/g);
        if (!tokens) return;
        tokens.forEach(t => {
            (stationOf158[t] = stationOf158[t] || []).push(st);
        });
    });
    const cmp = (x, y) =>
        String(x).localeCompare(
            String(y),
            'uk',
            { numeric: true, sensitivity: 'base' }
        );
    /*
        Станція передмонтажу: рядок, де в матеріалі стоїть сама буквено-цифрова
        назва (напр. "1  KS_28  779803801A" → станція 1). Назва має збігатись
        цілим словом. Якщо такого рядка нема — як і раніше, за номером на 158…
    */
    const stationRows = [];
    searchData.forEach(row => {
        if (isPremontageName(row.station)) return;
        if (!premontageArticleMatches(row, article)) return;
        const st = String(row.station || "").trim();
        if (st) stationRows.push({ st, mat: String(row.material || "").toLowerCase() });
    });
    const escRe = v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const firstStation = c => {
        const name = premontageShortName(c).toLowerCase().trim();
        const found = [];
        if (name) {
            const re = new RegExp(
                '(^|[^a-zа-яіїєґ0-9_*-])' + escRe(name) + '($|[^a-zа-яіїєґ0-9_*-])'
            );
            stationRows.forEach(r => {
                if (re.test(r.mat)) found.push(r.st);
            });
        }
        if (!found.length) {
            const t = String(c).match(/158\d+/);
            if (t && stationOf158[t[0]]) found.push(...stationOf158[t[0]]);
        }
        return found.length ? [...found].sort(cmp)[0] : null;
    };
    return [...categories].sort((a, b) => {
        const sa = firstStation(a);
        const sb = firstStation(b);
        if (sa !== null && sb !== null) {
            const byStation = cmp(sa, sb);
            if (byStation !== 0) return byStation;
        } else if (sa !== null) {
            return -1;
        } else if (sb !== null) {
            return 1;
        }
        return cmp(a, b);
    });
}
function computeWiresForCategory(
    article,
    category
) {
    const wantedCategory =
        String(
            category || ""
        ).trim()
        .toLowerCase();
    return getPremontageRows()
        .filter(row =>
            premontageArticleMatches(
                row,
                article
            ) &&
            String(
                row.station || ""
            ).trim().toLowerCase()
            === wantedCategory
        )
        .sort((a, b) =>
            String(a.material || "")
                .localeCompare(
                    String(b.material || ""),
                    'uk',
                    {
                        numeric: true,
                        sensitivity: 'base'
                    }
                )
        );
}

/* Адреса зони "А 5" (А / A, потім 5 або 05): "A 05 05 06" */
function isIsotapeAddress(address) {
    return /^[AА]\s*0?5(?:\s|$)/i.test(
        String(address || "").trim()
    );
}
/* У примітці є слово "стр" (на початку слова): СТР, стр 3, ... */
function hasStrNote(note) {
    return /(^|[^\p{L}])стр/iu.test(
        String(note || "")
    );
}
/*
    Ізострічка: матеріал вважається ізострічкою, якщо на будь-якому
    артикулі він на адресі "А 5" або має примітку "стр". Тоді він
    показується на ВСІХ артикулах, де використовується (там його
    могли просто не позначити).
*/
function getIsotapeMaterials() {
    if (!_isotapeSet) {
        _isotapeSet = new Set();
        searchData.forEach(x => {
            if (
                isIsotapeAddress(x.address) ||
                hasStrNote(x.colD)
            ) {
                const m =
                    String(x.material || "").trim();
                if (m) {
                    _isotapeSet.add(m);
                }
            }
        });
    }
    return _isotapeSet;
}
function computeArticleActionResults(
    article,
    key
) {
    const v =
        String(key || "")
            .toLowerCase();
    if (v === 'ізострічка') {
        return searchData.filter(x =>
            expandArticleValue(
                x.article
            ).includes(article) &&
            getIsotapeMaterials().has(
                String(x.material || "").trim()
            )
        );
    }
    return searchData.filter(x => {
        if (
            !expandArticleValue(
                x.article
            ).includes(article)
        ) {
            return false;
        }
        return x.colD
            .toLowerCase()
            .startsWith(v);
    });
}

function isWireMaterial(material) {
    return /^15[237]/.test(
        String(material || "").trim()
    );
}
function getWireRowsForArticle(article) {
    return searchData.filter(row => {
        if (
            !expandArticleValue(
                row.article
            ).includes(
                String(article).trim()
            )
        ) {
            return false;
        }
        if (
            isPremontageName(
                row.station
            )
        ) {
            return false;
        }
        if (
            String(
                row.colD || ""
            ).trim()
        ) {
            return false;
        }
        return isWireMaterial(
            row.material
        );
    });
}
function computeWireStationsForArticle(
    article
) {
    const stations = new Set();
    getWireRowsForArticle(article)
        .forEach(row => {
            const st =
                String(
                    row.station || ""
                ).trim();
            if (st) {
                stations.add(st);
            }
        });
    return [...stations].sort(
        (a, b) =>
            a.localeCompare(
                b,
                'uk',
                {
                    numeric: true,
                    sensitivity: 'base'
                }
            )
    );
}
function computeWiresForStation(
    article,
    station
) {
    const wanted =
        String(
            station || ""
        ).trim()
        .toLowerCase();
    return getWireRowsForArticle(article)
        .filter(row =>
            String(
                row.station || ""
            ).trim().toLowerCase()
            === wanted
        )
        .sort((a, b) =>
            String(a.material || "")
                .localeCompare(
                    String(b.material || ""),
                    'uk',
                    {
                        numeric: true,
                        sensitivity: 'base'
                    }
                )
        );
}

function getAllMaterialsForArticle(article) {

            row.article
        ).includes(
            String(article).trim()
        )
    );
}
/* ==================== СПІЛЬНІ МАТЕРІАЛИ ==================== */
function buildMaterialArticleMap() {
    const map = {};
    searchData.forEach(row => {
        const mat =
            String(row.material || "").trim();
        if (!mat) return;
        if (!map[mat]) {
            map[mat] = new Set();
        }
        expandArticleValue(row.article)
            .forEach(a => map[mat].add(a));
    });
    return map;
}
function getOtherArticles(
    map,
    material,
    article
) {
    const set =
        map[String(material || "").trim()];
    if (!set) return [];
    const current =
        String(article || "").trim();
    return [...set]
        .filter(a => a !== current)
        .sort((a, b) =>
            a.localeCompare(
                b,
                'uk',
                {
                    numeric: true,
                    sensitivity: 'base'
                }
            )
        );
}
/* ==================== ДІЇ ==================== */
function articleHasAction(
    article,
    action
) {
    if (action === 'список') return true;
    if (action === 'розміщення') {
        return getAllMaterialsForArticle(
            article
        ).length > 0;
    }
    if (action === 'передмонтаж') {
        return computePremontageCategoriesForArticle(
            article
        ).length > 0;
    }
    if (action === 'проводи') {
        return computeWireStationsForArticle(
            article
        ).length > 0;
    }
    return computeArticleActionResults(
        article,
        action
    ).length > 0;
}
function getAvailableActionsForArticle(
    article
) {
    const cacheKey = String(article);
    if (_actionsCache[cacheKey]) {
        return _actionsCache[cacheKey];
    }
    const result =
        ARTICLE_ACTION_KEYS.filter(
            k => articleHasAction(
                article,
                k
            )
        );
    _actionsCache[cacheKey] = result;
    return result;
}

/* Поле очищено у вже позначеного передмонтажу → прибираємо його з обраних */
function pmRemoveSavedCurrent() {
    const list = loadWaitlist().filter(i => i.key !== pmQtyKey);
    saveWaitlist(list);
    articlesPageStack.forEach(s => {
        delete s.cachedHtml;
    });
}
function confirmPmQty() {
    if (!pmQtyMode) return;
    if (
        pmQtyHad &&
        pmQtyValue === ""
    ) {
        pmRemoveSavedCurrent();
        exitPmQtyMode(true);
        return;
    }
    if (pmQtySource === 'waitlist') {
        /* Порожньо = лишаємо кількість, правимо лише коментар; 0 = прибрати з обраних */
        const list = loadWaitlist();
        const wi = list.findIndex(i => i.key === pmQtyKey);
        if (wi >= 0) {
            if (pmQtyValue !== "" && parseInt(pmQtyValue, 10) === 0) {
                list.splice(wi, 1);
            } else {
                if (pmQtyValue !== "") {
                    list[wi].qty = parseInt(pmQtyValue, 10);
                }
                list[wi].comment = pmCommentEl.value.trim();
            }
            saveWaitlist(list);
        }
        exitPmQtyMode(true);
        return;
    }
    const qty = parseInt(pmQtyValue, 10);
    if (!/^\d+$/.test(pmQtyValue) || !(qty > 0)) {
        pmDisplayEl.style.borderColor = '#ef4444';
        setTimeout(() => {
            pmDisplayEl.style.borderColor = '';
        }, 600);
        return;
    }
    let pmData = {
        material: pmQtyLabel,
        address: String(pmQtyArticle)
    };
    if (pmQtySource === 'search') {
        const d = searchResultLookup[pmQtyKey];
        if (!d) {
            exitPmQtyMode(true);
            return;
        }
        pmData = d;
    } else if (pmQtySource === 'spts' && pmSptsData) {
        pmData = pmSptsData;
    }
    addWaitlistWithQty(
        pmQtyKey,
        pmData,
        qty,
        pmCommentEl.value.trim()
    );
    articlesPageStack.forEach(s => {
        delete s.cachedHtml;
    });
    exitPmQtyMode(true);
}
pmPanelEl.addEventListener('click', e => {
    const digit = e.target.closest('[data-pmv]');
    if (digit) {
        const v = digit.dataset.pmv;
        if (pmQtyValue === "0") pmQtyValue = "";
        if (
            pmQtyValue === "" &&
            v === "0" &&
            pmQtySource !== 'waitlist'
        ) {
            return;
        }
        if (pmQtyValue.length < 4) {
            pmQtyValue += v;
            pmRefreshPanel();
            pmApplyTarget(false);
        }
        return;
    }
    const act = e.target.closest('[data-pm]');
    if (!act) return;
    const a = act.dataset.pm;
    if (a === 'clear') {
        pmQtyValue = "";
        pmRefreshPanel();
        pmApplyTarget(false);
    } else if (a === 'comment') {
        pmCommentEl.classList.toggle('hidden');
        pmSyncSpace();
        if (!pmCommentEl.classList.contains('hidden')) {
            pmCommentEl.focus();
        }
    } else if (a === 'cancel') {
        if (
            pmQtyHad &&
            pmQtyValue === ""
        ) {
            pmRemoveSavedCurrent();
        }
        exitPmQtyMode(true);
    } else if (a === 'ok') {
        confirmPmQty();
    }
});
/* ---------- Довге натискання ---------- */
function pmCancelPress() {
    if (pmPressTimer) {
        clearTimeout(pmPressTimer);
        pmPressTimer = null;
    }
    pmPressBtn = null;
}
let pmSkipWaitClick = false;
function pmStartPress(btn, x, y, kind) {
    pmCancelPress();
    pmPressBtn = btn;
    pmPressX = x;
    pmPressY = y;
    pmPressTimer = setTimeout(() => {
        pmPressTimer = null;
        const b = pmPressBtn;
        pmPressBtn = null;
        if (!b || !b.isConnected) return;
        let go = null;
        if (kind === 'waitlist') {
            if (pmQtyMode) return;
            const wi = parseInt(b.dataset.pmEdit, 10);
            pmSkipWaitClick = true;
            go = () => enterPmWaitlistEdit(wi);
        } else if (kind === 'search') {
            if (
                currentPage !== SEARCH_PAGE_INDEX ||
                qtyMode ||
                pmQtyMode
            ) return;
            const key =
                searchCardKeys[parseInt(b.dataset.idx, 10)];
            if (key === undefined) return;
            go = () => enterPmSearchMode(key, b);
        } else if (kind === 'spts') {
            const cur =
                articlesPageStack[articlesPageStack.length - 1];
            if (!cur || pmQtyMode) return;
            const okLevel =
                cur.level === 'premontage-wires' ||
                cur.level === 'wire-results' ||
                (cur.level === 'results' && cur.action !== 'розміщення');
            if (!okLevel) return;
            go = () => enterPmSptsMode(cur.article, b);
        } else {
            const cur =
                articlesPageStack[articlesPageStack.length - 1];
            if (!cur || cur.level !== 'premontage-categories') return;
            go = () => enterPmQtyMode(
                cur.article,
                b.dataset.category,
                b.dataset.label || b.textContent.trim()
            );
        }
        /* Гасимо жести свайпу / "потягнути вниз" для цього дотику */
        pageDragging = false;
        pageSwipeCandidate = false;
        pullActive = false;
        try {
            if (navigator.vibrate) navigator.vibrate(40);
        } catch (_) {}
        go();
    }, PM_LONG_PRESS_MS);
}
articlesPageContent.addEventListener('touchstart', e => {
    if (!e.touches || e.touches.length !== 1) {
        pmCancelPress();
        return;
    }
    const btn = e.target.closest('[data-anav="category"]');
    if (btn) {
        pmStartPress(btn, e.touches[0].clientX, e.touches[0].clientY);
        return;
    }
    const row = e.target.closest('[data-spts-key]');
    if (row) {
        pmStartPress(
            row,
            e.touches[0].clientX,
            e.touches[0].clientY,
            'spts'
        );
    }
}, { passive: true });
articlesPageContent.addEventListener('touchmove', e => {
    if (!pmPressTimer || !e.touches.length) return;
    const t = e.touches[0];
    if (
        Math.abs(t.clientX - pmPressX) > 10 ||
        Math.abs(t.clientY - pmPressY) > 10
    ) {
        pmCancelPress();
    }
}, { passive: true });
articlesPageContent.addEventListener('touchend', pmCancelPress, { passive: true });
articlesPageContent.addEventListener('touchcancel', pmCancelPress, { passive: true });
articlesPageContent.addEventListener('contextmenu', e => {

});
