<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Пошук</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, Arial, sans-serif;
    background: #fff;
    touch-action: none;
}
#pages {
    display: flex;
    height: 100%;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.page {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
}
/* ==================== SEARCH PAGE ==================== */
.search-header {
    padding: 16px 16px 8px;
    padding-top: calc(30px + env(safe-area-inset-top));
    flex-shrink: 0;
}
#page-articles .scroll-area {
    padding-top: calc(30px + env(safe-area-inset-top));
}
input#input {
    width: 100%;
    padding: 16px 18px;
    font-size: 22px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    text-align: center;
    outline: none;
    background: #f9fafb;
    color: #111;
    caret-color: transparent;
    height: 60px;
}
.scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 16px 16px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}
/* ==================== КРАПОЧКИ ГЛИБИНИ АРТИКУЛІВ ==================== */
.articles-dots {
    position: fixed;
    bottom: calc(8px + env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    height: 18px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 7px;
    z-index: 30;
    pointer-events: none;
}
.articles-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d1d5db;
    transition: all 0.2s ease;
}
.articles-dots .dot.past {
    background: #9ca3af;
}
.articles-dots .dot.active {
    width: 9px;
    height: 9px;
    background: #111827;
}
/* ==================== СВАЙП ВНУТРІШНІХ РІВНІВ ==================== */
.articles-drag-wrapper {
    display: flex;
    align-items: flex-start;
    width: 200%;
    will-change: transform;
}
.articles-drag-pane {
    width: 50%;
    flex: 0 0 50%;
    box-sizing: border-box;
    min-width: 0;
    padding: 0;
}
#page-articles.articles-swiping .scroll-area {
    overflow-y: hidden;
    touch-action: none;
}
#page-articles,
#page-articles * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
#page-articles table,
#page-articles td,
#page-articles th,
#page-articles .result-card,
#page-articles .premontage-title {
    touch-action: pan-y;
}
/* ==================== RESULT CARDS ==================== */
.result-card {
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    padding: 24px;
    margin-bottom: 16px;
}
.result-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}
.result-material-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #111111;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.1;
    white-space: nowrap;
}
/* hide original small icons */
.result-material-badge .box-icon,
.box-icon,
.icon {
    display: none;
}
.result-material-badge .box-icon {
    font-size: 0.85em;
}
.result-address-new {
    font-weight: 600;
    font-size: 14px;
    color: #111; /* changed to black */
    white-space: nowrap;
    text-align: right;
    border: 1px solid #e5e7eb; /* border like other elements */
    background: #f9fafb;
    border-radius: 10px;
    padding: 6px 10px;
    display: inline-block;
}
.article-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid #ECECEC;
}
.article-row:first-child {
    border-top: none;
    padding-top: 0;
}
.article-number {
    font-size: 15px;
    font-weight: 700;
    color: #111111;
    white-space: nowrap;
}
.article-number .art-g1 {
    margin-right: 3px;
}
.article-number .art-g2 {
    font-size: 1.2em;
    margin-right: 3px;
}
.article-stations {
    font-size: 20px;
    font-weight: 800;
    color: #111111;
    text-align: right;
    line-height: 1.3;
}
.article-row .article-stations {
    flex: 1;
    min-width: 0;
}
.station-list-classic {
    display: none;
}
.station-list-readable {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 4px;
}
.station-chip {
    display: inline-flex;
    min-width: 34px;
    min-height: 30px;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #f3f4f6;
    color: #111;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
}
body.interface-classic .station-list-classic {
    display: block;
}
body.interface-classic .station-list-readable {
    display: none;
}
body.interface-readable .station-list-classic {
    display: none;
}
body.interface-readable .station-list-readable {
    display: flex;
}
/* Читабельний вигляд артикулу: проєкт (сірий) · НАЗВА (акцент) · стан (сірий) */
.art-classic {
    display: inline;
}
.art-readable {
    display: none;
}
body.interface-classic .art-classic {
    display: inline;
}
body.interface-classic .art-readable {
    display: none;
}
body.interface-readable .art-classic {
    display: none;
}
body.interface-readable .art-readable {
    display: inline-flex;
}
.art-r {
    align-items: baseline;
    gap: 2px;
    white-space: nowrap;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 14px;
    padding: 8px 14px;
}
.art-r-base {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.15;
    color: #111;
}
.art-r-stack {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
}
.art-r-stan {
    font-size: 14px;
    font-weight: 700;
    color: #6b7280;
    margin-left: 1px;
}
/* Ensure favorite button appears on the left of material name in result cards */
.result-top .article-favorite-btn {
    order: -1;
    margin-right: 8px;
}
/* ==================== СПИСОК ОЧІКУВАННЯ ==================== */
.waitlist-title {
    font-size: 18px;
    font-weight: 700;
    color: #111111;
    text-align: center;
    padding: 8px 0;
}
.select-btn {
    border: none;
    background: transparent;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    color: #d1d5db;
    flex-shrink: 0;
}
.select-btn.selected {
    color: #FFC400;
}
.select-btn:active {
    transform: scale(.9);
}
.article-choice-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
}
.article-choice-main {
    flex: 1;
    min-width: 0;
}
.article-favorite-btn {
    width: 54px;
    min-width: 54px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #9ca3af;
    border-radius: 14px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
}
.article-favorite-btn.selected {
    color: #FFC400;
    background: #fffaf0;
    border-color: #f3d37a;
}
.article-favorite-btn:active {
    transform: scale(.96);
}
.waitlist-actions-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
}
.waitlist-remove-btn {
    border: none;
    background: #fff7e0;
    color: #b45309;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    flex: 1;
    text-align: center;
    cursor: pointer;
}
.waitlist-remove-btn:active {
    background: #fdeeca;
}
.comment-toggle-btn {
    border: none;
    background: #eef2ff;
    color: #4338ca;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    flex: 1;
    text-align: center;
    cursor: pointer;
}
.comment-toggle-btn:active {
    background: #e0e7ff;
}
.comment-edit-area {
    margin-top: 12px;
}
.comment-textarea {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 64px;
    outline: none;
    color: #111;
    background: #f9fafb;
}
.comment-save-btn {
    display: block;
    margin-top: 8px;
    border: none;
    background: #4338ca;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 0;
    width: 100%;
    text-align: center;
    cursor: pointer;
}
.comment-save-btn:active {
    background: #372ea8;
}
.waitlist-comment-text {
    margin-top: 12px;
    padding: 10px 12px;
    background: #f3f4f6;
    border-radius: 10px;
    font-size: 14px;
    color: #374151;
    white-space: pre-wrap;
    word-break: break-word;
}
/* ==================== ПАНЕЛЬ ПЕРЕДМОНТАЖУ ==================== */
.premontage-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
}
.premontage-nav-btn {
    border: none;
    background: #eef2ff;
    color: #4338ca;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
}
.premontage-nav-btn:active {
    background: #e0e7ff;
}
.premontage-nav-btn.active {
    background: #4338ca;
    color: #fff;
}
.premontage-close-btn {
    background: #fff7e0;
    color: #b45309;
    margin-left: auto;
}
.premontage-close-btn:active {
    background: #fdeeca;
}
.premontage-title {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    margin-bottom: 14px;
}
.level-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}
.level-head-left {
    font-size: 20px;
    font-weight: 800;
    color: #111;
}
.level-head-main {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.level-head-tail {
    font-size: 0.7em;
    font-weight: 700;
    color: #6b7280;
    margin-left: 1px;
}
.level-head-right {
    font-size: 20px;
    font-weight: 800;
    color: #111;
    text-align: right;
}
.premontage-btn-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}
.premontage-item-btn {
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #111;
    font-weight: 700;
    font-size: 15px;
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    white-space: normal;
    word-break: break-word;
}
.premontage-item-btn:active {
    background: #eef2ff;
}
.premontage-item-btn.favorite {
    background: #fffaf0;
    border-color: #f3d37a;
}
.wire-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.wire-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px 14px;
}
.wire-name {
    font-weight: 800;
    font-size: 16px;
    color: #111;
    flex-shrink: 0;
}
.wire-code {
    font-size: 13px;
    color: #6b7280;
    flex: 1;
    text-align: center;
}
.wire-location {
    font-weight: 600;
    font-size: 14px;
    color: #059669;
    text-align: right;
    white-space: nowrap;
}
#pull-indicator {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    width: 38px;
    height: 38px;
    margin-left: 0;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #4338ca;
    opacity: 0;
    transform: translate(-50%, -30px) scale(0.6);
    pointer-events: none;
    z-index: 50;
}
#pull-indicator.ready {
    background: #eef2ff;
}
#pull-indicator .pull-arrow {
    display: inline-block;
    line-height: 1;
}
/* ==================== HIGHLIGHT ==================== */
mark.hl {
    background: #fde047;
    color: #111;
    border-radius: 3px;
    padding: 0 2px;
    font-weight: inherit;
}
/* ==================== KEYBOARDS ==================== */
.kb-container {
    position: relative;
    flex-shrink: 0;
    background: #fff;
    border-top: 1px solid #e5e7eb;
    padding: 12px;
    /* Extra space below 0-key for depth dots */
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
}
.kb-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}
.filter-menu {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 12px;
    bottom: calc(28px + env(safe-area-inset-bottom));
    z-index: 45;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: 10px;
    padding: 0;
    background: transparent;
}
.filter-option {
    min-width: 0;
    min-height: 0;
    height: 100%;
    padding: 4px 6px;
    border: 1px solid #222;
    border-radius: 8px;
    background: #fff;
    color: #000;
    font: 600 14px -apple-system, Arial, sans-serif;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
}
.filter-option.active {
    border-color: #9ca3af;
    background: #e5e7eb;
    color: #000;
}
.filter-menu:not(.filter-options-open) .filter-choice {
    display: none;
}
.filter-menu:not(.interface-options-open) .interface-choice {
    display: none;
}
.filter-menu.filter-options-open [data-filter-expand],
.filter-menu.filter-options-open [data-interface-expand],
.filter-menu.interface-options-open [data-filter-expand],
.filter-menu.interface-options-open [data-interface-expand] {
    display: none;
}
.filter-menu-heading {
    background: #f1f5f9;
    color: #000;
}
.filter-empty {
    border: 0;
    background: transparent;
    pointer-events: none;
}
.filter-panel-open #kb1 {
    visibility: hidden;
}
.hidden {
    display: none !important;
}
.btn {
    background: #fff;
    border: 1px solid #222;
    border-radius: 8px;
    color: #222;
    font-size: 18px;
    font-weight: 600;
    padding: 15px 0;
    text-align: center;
    touch-action: manipulation;
    user-select: none;
}
.btn:active {
    background: #F7F7F7;
    transform: scale(.96);
}
.btn-special {
    background: #f1f5f9;
}
.btn-version {
    background: #f1f5f9;
    color: #000;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: pointer;
}
/* ==================== TABLE PAGES ==================== */
.table-page {
    background: #fff;
}
.table-header {
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    border-bottom: 1px solid #e5e7eb;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}
.table-title {
    font-weight: 700;
    font-size: 16px;
    color: #111;
}
.table-updated {
    font-size: 11px;
    color: #9ca3af;
}
.table-scroll {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
}
table {
    border-collapse: collapse;
    font-size: 13px;
    min-width: 100%;
}
th {
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    padding: 12px 8px;
    text-align: left;
    font-weight: 700;
    color: #333;
}
td {
    border: 1px solid #e2e8f0;
    padding: 8px;
    white-space: nowrap;
    color: #444;
}
tr:nth-child(even) td {
    background: #f9fafb;
}
</style>
</head>
<body>
<div id="pages">
    <!-- PAGE (waitlist): свайп управо від пошуку -->
    <div class="page" id="page-waitlist">
        <div class="search-header">
            <div class="waitlist-title">Обрані матеріали</div>
        </div>
        <div class="scroll-area">
            <div id="waitlist-result"></div>
        </div>
    </div>
    <!-- PAGE (search) -->
    <div class="page" id="page0">
        <div class="search-header">
            <input id="input" readonly>
        </div>
        <div class="scroll-area">
            <div id="result"></div>
        </div>
        <div id="kb-wrapper" class="kb-container">
            <div id="kb1" class="kb-grid">
                <button class="btn" data-v="1">1</button>
                <button class="btn" data-v="2">2</button>
                <button class="btn" data-v="3">3</button>
                <button class="btn" data-v="4">4</button>
                <button class="btn" data-v="5">5</button>
                <button class="btn" data-v="6">6</button>
                <button class="btn" data-v="7">7</button>
                <button class="btn" data-v="8">8</button>
                <button class="btn" data-v="9">9</button>
                <button
                    type="button"
                    class="btn btn-version"
                    id="kb-version"
                    aria-label="Фільтр пошуку"
                    aria-haspopup="true"
                    aria-expanded="false">v67</button>
                <button class="btn" data-v="0">0</button>
                <button class="btn btn-special" data-del="all">⌫</button>
            </div>
            <div id="filter-menu" class="filter-menu hidden" role="group" aria-label="Параметри пошуку">
                <button type="button" class="filter-option filter-menu-heading" data-filter-expand aria-expanded="false">Фільтр</button>
                <button type="button" class="filter-option filter-menu-heading" data-interface-expand aria-expanded="false">Інтерфейс</button>
                <button type="button" class="filter-option filter-choice" data-search-filter="all">Усі дані</button>
                <button type="button" class="filter-option filter-choice" data-search-filter="wires">Проводи</button>
                <button type="button" class="filter-option filter-choice" data-search-filter="materials">Матеріал</button>
                <button type="button" class="filter-option filter-choice" data-search-filter="premontage">Передмонтажі</button>
                <button type="button" class="filter-option filter-choice" data-search-filter="audi">Audi</button>
                <button type="button" class="filter-option filter-choice" data-search-filter="bmw">BMW</button>
                <button type="button" class="filter-option interface-choice" data-interface-mode="classic">Класичний · v66</button>
                <button type="button" class="filter-option interface-choice" data-interface-mode="readable">Читабельний · v73</button>
                <div class="filter-empty" aria-hidden="true"></div>
                <div class="filter-empty" aria-hidden="true"></div>
                <div class="filter-empty" aria-hidden="true"></div>
                <div class="filter-empty" aria-hidden="true"></div>
                <div class="filter-empty" aria-hidden="true"></div>
            </div>
        </div>
    </div>
    <!-- PAGE (артикули): свайп ліворуч від пошуку -->
    <div class="page" id="page-articles">
        <div class="scroll-area">
            <div id="articles-page-content"></div>
        </div>
    </div>
</div>
<!-- КРАПОЧКИ ГЛИБИНИ (глобально: пошук + артикули) -->
<div class="articles-dots" id="articles-dots"></div>
<script>
/* ==================== ДЖЕРЕЛО ДАНИХ ==================== */
/* ==================== ВЕРСІЯ КОДУ ==================== */
const CODE_VERSION = 73;
const SPREADSHEET_ID = "1ii4oiQvbayKKN1tffS4X7WxH0NPZ0oiooaHPP6Ku6W8";
const SEARCH_GID = "1679964111";
const AUDI_GID = SEARCH_GID;
const BMW_GID = "421001458";
const PREMONTAGE_AUDI_GID = "1146686549";
/* Усі аркуші (gid), з яких тягнуться дані. Додай сюди нові gid через кому. */
const SEARCH_GIDS = [AUDI_GID, BMW_GID, PREMONTAGE_AUDI_GID, "2115582321", "994923423"];
/* ================================================================ */
/* Кеші для швидкодії */
const _expandCache = new Map();

function loadInterfaceMode() {
    try {
        const saved =
            localStorage.getItem(
                CACHE_KEY_INTERFACE_MODE
            );
        return INTERFACE_MODE_KEYS.includes(saved)
            ? saved
            : 'readable';
    } catch (e) {
        return 'readable';

}
let interfaceMode = loadInterfaceMode();
function loadSearchFilters() {
    try {
        const saved =
            JSON.parse(
                localStorage.getItem(
                    CACHE_KEY_SEARCH_FILTERS
                ) || "null"
            );
        if (saved && saved.version === 3 &&
            Array.isArray(saved.filters)) {
            return [...new Set(
                saved.filters
                    .map(String)
                    .filter(filter =>
                        SEARCH_FILTER_KEYS.includes(filter)
                    )
            )];
        }
        const previousFilters =
            saved && Array.isArray(saved.filters)
                ? saved.filters
                : Array.isArray(saved)
                    ? saved
                    : [];
        return [...new Set(
            previousFilters
                .map(String)
                .filter(filter =>
                    ['wires', 'materials', 'premontage']
                        .includes(filter)
                )
        )];
    } catch (e) {
        return [];
    }
}
function saveSearchFilters() {
    try {
        localStorage.setItem(
            CACHE_KEY_SEARCH_FILTERS,
            JSON.stringify({
                version: 3,
                filters: selectedSearchFilters
            })
        );
    } catch (e) {
        /* Збереження фільтрів не має блокувати пошук. */
    }
}
selectedSearchFilters = loadSearchFilters();
/* ==================== КРАПОЧКИ ГЛИБИНИ ==================== */
function renderArticlesDots(overridePage, overrideDepth) {
    if (!articlesDots) return;
    /*
        overridePage / overrideDepth дозволяють показати крапочки
        "наперед" — просто щоб ПІД ЧАС самого свайпу (ще до того, як
        currentPage чи articlesPageStack реально зміняться) крапочки
        вже відображали стан, в який ми прямуємо. Так вони йдуть
        синхронно з переходом, а не з запізненням після нього.
    */
    const page =
        overridePage !== undefined
            ? overridePage
            : currentPage;
    /*
        Крапочки показуємо на сторінках "Пошук" і "Артикули".
        На "Обрані матеріали" їх немає.
    */
    if (
        page !== ARTICLES_PAGE_INDEX &&
        page !== SEARCH_PAGE_INDEX
    ) {
        articlesDots.style.display = 'none';
        articlesDots.innerHTML = '';
        return;
    }
    /*
        Кількість крапочок = кількість рівнів у стеку.
        1:
        Артикули
        2:
        Артикули → Артикул
        3:
        Артикули → Артикул → Дія
        4:
        Артикули → Артикул → Передмонтаж → Категорія
        і т.д.
    */
    /*
        Пошук завжди 1-а крапочка (перша сторінка).
        Панель артикулів = 2-а крапочка, кожен рівень углиб додає ще одну.
        Тому на сторінці артикулів: глибина стеку + 1.
    */
    let depth;
    if (page === SEARCH_PAGE_INDEX) {
        depth = 1;
    } else {
        depth =
            (
                overrideDepth !== undefined
                    ? overrideDepth
                    : articlesPageStack.length
            ) + 1;
    }
    if (depth <= 0) {
        articlesDots.style.display = 'none';
        articlesDots.innerHTML = '';
        return;
    }
    articlesDots.style.display = 'flex';
    articlesDots.innerHTML = '';
    for (let i = 0; i < depth; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === depth - 1 ? ' active' : '');
        if (i < depth - 1) dot.classList.add('past');
        articlesDots.appendChild(dot);
    }
}
