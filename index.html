ase() + k.slice(1);\n}\n/* ==================== РЕНДЕР АРТИКУЛІВ ==================== */\nfunction renderArticlesPage(\n    forceRebuild\n) {\n    /*\n        ВАЖЛИВО:\n        Крапочки оновлюємо ПЕРЕД рендером контенту.\n        Тому при переході на наступний рівень\n        вони одразу змінюють кількість.\n    */\n    renderArticlesDots();\n    const container =\n        document.getElementById(\n            'articles-page-content'\n        );\n    if (!container) return;\n    container.style.transition = '';\n    container.style.transform = '';\n    container.style.opacity = '';\n    const pageArticlesEl =\n        document.getElementById(\n            'page-articles'\n        );\n    if (pageArticlesEl) {\n        pageArticlesEl.classList.remove(\n            'articles-swiping'\n        );\n    }\n    const idx =\n        articlesPageStack.length - 1;\n    const state =\n        articlesPageStack[idx];\n    let html;\n    if (\n        !forceRebuild &&\n        state &&\n        state.cachedHtml\n    ) {\n        html =\n            state.cachedHtml;\n    } else {\n        html =\n            buildArticlesLevelHtml(\n                idx\n            );\n        if (state) {\n            state.cachedHtml = html;\n        }\n    }\n    container.innerHTML = html;\n}\n/* ==================== КЛІКИ НА АРТИКУЛАХ ==================== */\narticlesPageContent.addEventListener(\n    'click',\n    (e) => {\n        const btn =\n            e.target.closest(\n                '[data-anav]'\n            );\n        if (!btn) return;\n        const nav =\n            btn.dataset.anav;\n        const current =\n            articlesPageStack[\n                articlesPageStack.length - 1\n            ];\n        /* ---------- ПЕРЕМИКАЧІ РОЗМІЩЕННЯ ---------- */\n        if (\n            nav === 'toggle-shared' ||\n            nav === 'toggle-qty'\n        ) {\n            if (\n                current &&\n                current.level === 'results'\n            ) {\n                if (nav === 'toggle-shared') {\n                    current.shared =\n                        !current.shared;\n                } else {\n                    current.sortQty =\n                        !current.sortQty;\n                }\n                renderArticlesPage(true);\n            }\n            return;\n        }\n        /* ---------- ДО ПОШУКУ ---------- */\n        if (nav === 'to-search') {\n            const material =\n                decodeURIComponent(\n                    btn.dataset.material || \"\"\n                );\n            input.value =\n                material;\n            goToPage(\n                SEARCH_PAGE_INDEX\n            );\n            search();\n            return;\n        }\n        /* ---------- ОБРАНЕ ---------- */\n        if (\n            nav === 'article-favorite'\n        ) {\n            toggleArticleFavorite(\n                btn.dataset.article\n            );\n            articlesPageStack.forEach(st => {\n                delete st.cachedHtml;\n            });\n            renderArticlesPage(\n                true\n            );\n            return;\n        }\n        /* ---------- АРТИКУЛ ---------- */\n        if (nav === 'article') {\n            articlesPageStack.push({\n                level: 'actions',\n                article: btn.dataset.article\n            });\n            renderArticlesPage();\n            return;\n        }\n        /* ---------- ДІЯ ---------- */\n        if (nav === 'action') {\n            const action =\n                btn.dataset.action;\n            if (\n                action === 'передмонтаж'\n            ) {\n                articlesPageStack.push({\n                    level: 'premontage-categories',\n                    article: current.article\n                });\n            } else if (\n                action === 'проводи'\n            ) {\n                articlesPageStack.push({\n                    level: 'wire-stations',\n                    article: current.article\n                });\n            } else {\n                articlesPageStack.push({\n                    level: 'results',\n                    article: current.article,\n                    action\n                });\n            }\n            renderArticlesPage();\n            return;\n        }\n        /* ---------- КАТЕГОРІЯ ---------- */\n        if (nav === 'category') {\n            articlesPageStack.push({\n                level: 'premontage-wires',\n                article: current.article,\n                category: btn.dataset.category\n            });\n            renderArticlesPage();\n            return;\n        }\n        /* ---------- СТАНЦІЯ ПРОВОДУ ---------- */\n        if (nav === 'wire-station') {\n            articlesPageStack.push({\n                level: 'wire-results',\n                article: current.article,\n                station: btn.dataset.station\n            });\n            renderArticlesPage();\n            return;\n        }\n    }\n);\n/* ==================== ПОШУК ==================== */\nfunction search() {\n    const v =\n        input.value.toLowerCase();\n    if (!v) {\n        resultBox.innerHTML = \"\";\n        return;\n    }\n    const isNumOnly =\n        /^\\d+$/.test(v);\n    const isSpecialSearch =\n        v.includes(\"стр\") ||\n        v.includes(\"мм\") ||\n        v.includes(\"ts\");\n    const filtered =\n        searchData.filter(x => {\n            if (isSpecialSearch) {\n                return x.colD\n                    .toLowerCase()\n                    .startsWith(v);\n            }\n            if (isNumOnly) {\n                return (\n                    x.station\n                        .toLowerCase()\n                        .endsWith(v)\n                    ||\n                    x.material\n                        .toLowerCase()\n                        .endsWith(v)\n                    ||\n                    String(x.material || \"\")\n                        .replace(/\\D/g, \"\") === v\n                    ||\n                    x.article\n                        .toLowerCase()\n                        .endsWith(v)\n                    ||\n                    x.colD\n                        .toLowerCase()\n                        .endsWith(v)\n                    ||\n                    x.address\n                        .toLowerCase()\n                        .endsWith(v)\n                );\n            }\n            return (\n                x.station\n                    .toLowerCase()\n                    .startsWith(v)\n                ||\n                x.material\n                    .toLowerCase()\n                    .startsWith(v)\n                ||\n                x.article\n                    .toLowerCase()\n                    .startsWith(v)\n                ||\n                x.colD\n                    .toLowerCase()\n                    .startsWith(v)\n                ||\n                x.address\n                    .toLowerCase()\n                    .startsWith(v)\n            );\n        });\n    if (!filtered.length) {\n        resultBox.innerHTML =\n            '<div style=\"text-align:center; padding:40px; color:#aaa;\">Не знайдено</div>';\n        return;\n    }\n    let html = \"\";\n    searchCardKeys = [];\n    searchResultLookup = {};\n    const grouped = {};\n    filtered.forEach(x => {\n        const matKey =\n            x.material +\n            \"|\" +\n            x.address;\n        if (!grouped[matKey]) {\n            grouped[matKey] = {};\n        }\n        if (\n            !grouped[matKey][x.article]\n        ) {\n            grouped[matKey][x.article] =\n                new Set();\n        }\n        grouped[matKey][x.article]\n            .add(x.station);\n    });\n    for (\n        let matKey in grouped\n    ) {\n        const [\n            matName,\n            matAddr\n        ] =\n            matKey.split(\"|\");\n        const matHtml =\n            isSpecialSearch\n                ? escapeHtml(matName)\n                : highlight(\n                    matName,\n                    v,\n                    isNumOnly\n                );\n        const addrHtml =\n            isSpecialSearch\n                ? escapeHtml(matAddr)\n                : highlight(\n                    matAddr,\n                    v,\n                    isNumOnly\n                );\n        const mergedArticles =\n            mergeAbbreviatedArticles(\n                grouped[matKey]\n            );\n        const articlesPlain = {};\n        for (\n            let art in mergedArticles\n        ) {\n            articlesPlain[art] =\n                [...mergedArticles[art]];\n        }\n        searchResultLookup[matKey] = {\n            material: matName,\n            address: matAddr,\n            articles: articlesPlain\n        };\n        const cardIdx =\n            searchCardKeys.push(\n                matKey\n            ) - 1;\n        const selected =\n            isInWaitlist(\n                matKey\n            );\n        html += `\n            <div class=\"result-card\">\n                <div class=\"result-top\">\n                    <span class=\"result-material-badge\">\n                        <span class=\"box-icon\">📦</span>\n                        ${matHtml}\n                    </span>\n                    <div\n                        style=\"display:flex; align-items:center; gap:8px;\">\n                        <span class=\"result-address-new\">\n                            ${addrHtml}\n                        </span>\n                        <button\n                            class=\"select-btn${selected ? ' selected' : ''}\"\n                            data-idx=\"${cardIdx}\">\n                            ${selected ? '★' : '☆'}\n                        </button>\n                    </div>\n                </div>\n        `;\n        for (\n            let art in mergedArticles\n        ) {\n            const artHtml =\n                renderArticleNumber(\n                    art,\n                    v,\n                    isNumOnly,\n                    isSpecialSearch\n                );\n            const stationHtmlArr =\n                uniqueDisplayStations(\n                    mergedArticles[art]\n                )\n                    .map(st =>\n                        isSpecialSearch\n                            ? escapeHtml(st)\n                            : highlight(\n                                st,\n                                v,\n                                isNumOnly\n                            )\n                    );\n            const stationsHtml =\n                buildStationsHtml(\n                    stationHtmlArr\n                );\n            html += `\n                <div class=\"article-row\">\n                    <span class=\"article-number\">\n                        ${artHtml}\n                    </span>\n                    <span class=\"article-stations\">\n                        ${stationsHtml}\n                    </span>\n                </div>\n            `;\n        }\n        html +=\n            `</div>`;\n    }\n    resultBox.innerHTML =\n        html;\n}\n/* ==================== ДАТА ==================== */\nfunction formatDate(ts) {\n    const d =\n        new Date(\n            parseInt(\n                ts,\n                10\n            )\n        );\n    const pad =\n        n =>\n            String(n)\n                .padStart(2, '0');\n    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;\n}\n/* ==================== ПЕРЕХІД МІЖ ГОЛОВНИМИ СТОРІНКАМИ ==================== */\nfunction goToPage(n) {\n    n =\n        Math.max(\n            0,\n            Math.min(\n                TOTAL_PAGES - 1,\n                n\n            )\n        );\n    currentPage = n;\n    pagesEl.style.transform =\n        `translateX(-${n * pageWidthPercent}%)`;\n    /*\n        Оновлюємо крапочки тут також.\n        Це гарантує, що коли залишаємо сторінку\n        \"Артикули\", вони одразу зникають.\n    */\n    renderArticlesDots();\n    if (\n        n === SEARCH_PAGE_INDEX\n    ) {\n        kbWrapper.classList.remove(\n            'hidden'\n        );\n    } else {\n        kbWrapper.classList.add(\n            'hidden'\n        );\n        if (n === 0) {\n            renderWaitlistPage();\n        } else if (\n            n === ARTICLES_PAGE_INDEX\n        ) {\n            renderArticlesPage();\n        }\n    }\n}\n/* ==================== ГОРИЗОНТАЛЬНИЙ СВАЙП ==================== */\nlet pageDragStartX = 0;\nlet pageDragStartY = 0;\nlet pageDragBasePage = 0;\nlet pageDragging = false;\nlet pageMoved = false;\nlet pageDragPxWidth = 0;\nlet pageSwipeCandidate = false;\nlet suppressNextClick = false;\n/*\n    ЗБІЛЬШЕНО з 14 до 24: дрейф пальця при звичайному натисканні\n    більше не сприймається як початок свайпу.\n*/\nconst PAGE_SWIPE_START_PX = 24;\nfunction finishPageDrag(dx) {\n    const SWIPE_THRESHOLD =\n        Math.max(\n            55,\n            pageDragPxWidth * 0.20\n        );\n    const pageArticlesEl =\n        document.getElementById(\n            'page-articles'\n        );\n    /*\n        ВНУТРІШНЯ НАВІГАЦІЯ АРТИКУЛІВ\n    */\n    if (\n        pageDragBasePage === ARTICLES_PAGE_INDEX &&\n        articlesPageStack.length > 1\n    ) {\n        const wrapper =\n            document.getElementById(\n                'articles-drag-wrapper'\n            );\n        if (!wrapper) {\n            if (pageArticlesEl) {\n                pageArticlesEl.classList.remove(\n                    'articles-swiping'\n                );\n            }\n            renderArticlesPage();\n            return;\n        }\n        let settled = false;\n        const settle = (goBack) => {\n            if (settled) return;\n            settled = true;\n            if (pageArticlesEl) {\n                pageArticlesEl.classList.remove(\n                    'articles-swiping'\n                );\n            }\n            if (goBack) {\n                popArticlesPageLevel();\n            } else {\n                renderArticlesPage();\n            }\n        };\n        wrapper.style.transition =\n            'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';\n        /*\n            Крапочки оновлюємо ВІДРАЗУ, в момент прийняття рішення —\n            ще до того, як почалась/завершилась сама анімація зсуву.\n            Інакше вони чекали б на transitionend (чи й цілих 400мс\n            запасного таймауту) і помітно відставали б від переходу.\n        */\n        const willGoBack =\n            dx >= SWIPE_THRESHOLD;\n        renderArticlesDots(\n            ARTICLES_PAGE_INDEX,\n            willGoBack\n                ? articlesPageStack.length - 1\n                : articlesPageStack.length\n        );\n        if (\n            willGoBack\n        ) {\n            wrapper.style.transform =\n                'translateX(0px)';\n            const onDone = (ev) => {\n                if (\n                    ev &&\n                    ev.target !== wrapper\n                ) {\n                    return;\n                }\n                wrapper.removeEventListener(\n                    'transitionend',\n                    onDone\n                );\n                settle(true);\n            };\n            wrapper.addEventListener(\n                'transitionend',\n                onDone\n            );\n            setTimeout(\n                () => settle(true),\n                400\n            );\n        } else {\n            wrapper.style.transform =\n                `translateX(-${pageDragPxWidth}px)`;\n            const onCancel = (ev) => {\n                if (\n                    ev &&\n                    ev.target !== wrapper\n                ) {\n                    return;\n                }\n                wrapper.removeEventListener(\n                    'transitionend',\n                    onCancel\n                );\n                settle(false);\n            };\n            wrapper.addEventListener(\n                'transitionend',\n                onCancel\n            );\n            setTimeout(\n                () => settle(false),\n                400\n            );\n        }\n        return;\n    }\n    let target =\n        pageDragBasePage;\n    if (\n        Math.abs(dx) >=\n        SWIPE_THRESHOLD\n    ) {\n        const dir =\n            dx > 0 ? -1 : 1;\n        target =\n            Math.max(\n                0,\n                Math.min(\n                    TOTAL_PAGES - 1,\n                    pageDragBasePage + dir\n                )\n            );\n    }\n    pagesEl.style.transition =\n        'transform 0.35s cubic-bezier(0.4,0,0.2,1)';\n    currentPage = target;\n    pagesEl.style.transform =\n        `translateX(-${target * pageWidthPercent}%)`;\n    /*\n        Оновлення крапочок після завершення свайпу.\n    */\n    renderArticlesDots();\n    if (\n        target === SEARCH_PAGE_INDEX\n    ) {\n        kbWrapper.classList.remove(\n            'hidden'\n        );\n    } else {\n        kbWrapper.classList.add(\n            'hidden'\n        );\n        if (target === 0) {\n            renderWaitlistPage();\n        } else if (\n            target === ARTICLES_PAGE_INDEX\n        ) {\n            renderArticlesPage();\n        }\n    }\n}\n/* ==================== TOUCH START ==================== */\ndocument.addEventListener(\n    'touchstart',\n    e => {\n        if (\n            !e.touches ||\n            e.touches.length !== 1\n        ) {\n            return;\n        }\n        const touch =\n            e.touches[0];\n        pageDragStartX =\n            touch.clientX;\n        pageDragStartY =\n            touch.clientY;\n        pageDragBasePage =\n            currentPage;\n        pageDragPxWidth =\n            (\n                pagesEl.parentElement\n                    ? pagesEl.parentElement.clientWidth\n                    : window.innerWidth\n            ) ||\n            window.innerWidth;\n        pageDragging = true;\n        pageMoved = false;\n        pageSwipeCandidate = true;\n    },\n    {\n        passive: true\n    }\n);\n/* ==================== TOUCH MOVE ==================== */\ndocument.addEventListener(\n    'touchmove',\n    e => {\n        if (\n            !pageDragging ||\n            !pageSwipeCandidate ||\n            !e.touches ||\n            e.touches.length !== 1\n        ) {\n            return;\n        }\n        const touch =\n            e.touches[0];\n        const dx =\n            touch.clientX -\n            pageDragStartX;\n        const dy =\n            touch.clientY -\n            pageDragStartY;\n        if (!pageMoved) {\n            const absX =\n                Math.abs(dx);\n            const absY =\n                Math.abs(dy);\n            if (\n                Math.max(\n                    absX,\n                    absY\n                ) < PAGE_SWIPE_START_PX\n            ) {\n                return;\n            }\n            if (\n                absY > absX\n            ) {\n                pageDragging = false;\n                pageSwipeCandidate =\n                    false;\n                return;\n            }\n            pageMoved = true;\n            try {\n                e.preventDefault();\n            } catch (_) {}\n            if (\n                pageDragBasePage !== ARTICLES_PAGE_INDEX ||\n                articlesPageStack.length <= 1\n            ) {\n                pagesEl.style.transition =\n                    'none';\n            } else {\n                const contentW =\n                    articlesPageContent.clientWidth ||\n                    pageDragPxWidth;\n                pageDragPxWidth =\n                    contentW;\n                const prevState =\n                    articlesPageStack[\n                        articlesPageStack.length - 2\n                    ];\n                const prevHtml =\n                    (\n                        prevState &&\n                        prevState.cachedHtml\n                    )\n                        ? prevState.cachedHtml\n                        : buildArticlesLevelHtml(\n                            articlesPageStack.length - 2\n                        );\n                if (\n                    prevState &&\n                    !prevState.cachedHtml\n                ) {\n                    prevState.cachedHtml =\n                        prevHtml;\n                }\n                const wrapper =\n                    document.createElement(\n                        'div'\n                    );\n                wrapper.className =\n                    'articles-drag-wrapper';\n                wrapper.id =\n                    'articles-drag-wrapper';\n                const prevPane =\n                    document.createElement(\n                        'div'\n                    );\n                prevPane.className =\n                    'articles-drag-pane';\n                prevPane.innerHTML =\n                    prevHtml;\n                const currentPane =\n                    document.createElement(\n                        'div'\n                    );\n                currentPane.className =\n                    'articles-drag-pane';\n                while (\n                    articlesPageContent.firstChild\n                ) {\n                    currentPane.appendChild(\n                        articlesPageContent.firstChild\n                    );\n                }\n                wrapper.appendChild(\n                    prevPane\n                );\n                wrapper.appendChild(\n                    currentPane\n                );\n                articlesPageContent.appendChild(\n                    wrapper\n                );\n                const pageArticlesEl =\n                    document.getElementById(\n                        'page-articles'\n                    );\n                if (pageArticlesEl) {\n                    pageArticlesEl.classList.add(\n                        'articles-swiping'\n                    );\n                }\n                wrapper.style.transition =\n                    'none';\n                wrapper.style.transform =\n                    `translateX(-${pageDragPxWidth}px)`;\n            }\n        } else {\n            try {\n                e.preventDefault();\n            } catch (_) {}\n        }\n        const maxDelta =\n            pageDragPxWidth;\n        const limitedDx =\n            Math.max(\n                -maxDelta,\n                Math.min(\n                    maxDelta,\n                    dx\n                )\n            );\n        if (\n            pageDragBasePage === ARTICLES_PAGE_INDEX &&\n            articlesPageStack.length > 1\n        ) {\n            const wrapper =\n                document.getElementById(\n                    'articles-drag-wrapper'\n                );\n            if (!wrapper) return;\n            const visualDx =\n                Math.max(\n                    0,\n                    Math.min(\n                        pageDragPxWidth,\n                        limitedDx\n                    )\n                );\n            wrapper.style.transition =\n                'none';\n            wrapper.style.transform =\n                `translateX(${visualDx - pageDragPxWidth}px)`;\n            /*\n                Крапочки \"йдуть за пальцем\" ще під час самого свайпу —\n                так зміна помітна ще швидше, ніж сам перехід.\n            */\n            const liveThreshold =\n                Math.max(\n                    55,\n                    pageDragPxWidth * 0.20\n                );\n            renderArticlesDots(\n                ARTICLES_PAGE_INDEX,\n                visualDx >= liveThreshold\n                    ? articlesPageStack.length - 1\n                    : articlesPageStack.length\n            );\n            return;\n        }\n        let livePos =\n            pageDragBasePage -\n            limitedDx /\n            pageDragPxWidth;\n        livePos =\n            Math.max(\n                0,\n                Math.min(\n                    TOTAL_PAGES - 1,\n                    livePos\n                )\n            );\n        pagesEl.style.transform =\n            `translateX(-${livePos * pageWidthPercent}%)`;\n        renderArticlesDots(\n            Math.round(livePos)\n        );\n    },\n    {\n        passive: false\n    }\n);\n/* ==================== TOUCH END ==================== */\ndocument.addEventListener(\n    'touchend',\n    e => {\n        if (!pageDragging) {\n            return;\n        }\n        const wasSwipe =\n            pageMoved;\n        pageDragging = false;\n        pageSwipeCandidate =\n            false;\n        if (!wasSwipe) {\n            if (\n                currentPage === SEARCH_PAGE_INDEX &&\n                !kbWrapper.contains(\n                    e.target\n                ) &&\n                !e.target.closest(\n                    '.select-btn'\n                ) &&\n                !e.target.closest(\n                    '[data-anav]'\n                )\n            ) {\n                kbWrapper.classList.toggle(\n                    'hidden'\n                );\n            }\n            /*\n                Швидкий тап: виконуємо клік ОДРАЗУ на touchend,\n                не чекаючи окремого синтетичного \"click\" від браузера\n                (той приходить із помітною затримкою). Справжній\n                наступний click від цього ж тапу гасимо нижче —\n                інакше дія виконалась би двічі.\n            */\n            const tappable =\n                e.target.closest(\n                    'button, [data-anav]'\n                );\n            if (tappable) {\n                tappable.click();\n                suppressNextClick = true;\n                setTimeout(\n                    () => {\n                        suppressNextClick = false;\n                    },\n                    400\n                );\n            }\n            return;\n        }\n        const changedTouch =\n            e.changedTouches &&\n            e.changedTouches.length\n                ? e.changedTouches[0]\n                : null;\n        const dx =\n            changedTouch\n                ? changedTouch.clientX -\n                  pageDragStartX\n                : 0;\n        suppressNextClick = true;\n        finishPageDrag(dx);\n        setTimeout(\n            () => {\n                suppressNextClick = false;\n            },\n            400\n        );\n    },\n    {\n        passive: true\n    }\n);\n/* ==================== TOUCH CANCEL ==================== */\n/*\n    Якщо браузер сам скасував жест (наприклад, перехопив скрол),\n    скидаємо стан, щоб не лишалось \"зависшого\" свайпу.\n*/\ndocument.addEventListener(\n    'touchcancel',\n    () => {\n        pageDragging = false;\n        pageSwipeCandidate = false;\n        if (pageMoved) {\n            pageMoved = false;\n            finishPageDrag(0);\n        }\n    },\n    {\n        passive: true\n    }\n);\n/* ==================== БЛОКУВАННЯ CLICK ПІСЛЯ SWIPE ==================== */\ndocument.addEventListener(\n    'click',\n    e => {\n        /*\n            Наш власний click() з touchend (isTrusted === false)\n            ніколи не гасимо — тільки справжній клік від браузера.\n        */\n        if (!e.isTrusted) {\n            return;\n        }\n        if (!suppressNextClick) {\n            return;\n        }\n        suppressNextClick = false;\n        e.preventDefault();\n        e.stopPropagation();\n    },\n    true\n);\n/* ==================== ХОВАННЯ КЛАВІАТУРИ ПРИ СКРОЛІ ==================== */\nconst scrollAreaEl =\n    document.querySelector(\n        '#page0 .scroll-area'\n    );\nlet resultStartY = 0;\nscrollAreaEl.addEventListener(\n    'touchstart',\n    (e) => {\n        resultStartY =\n            e.touches[0].clientY;\n    },\n    {\n        passive: true\n    }\n);\nscrollAreaEl.addEventListener(\n    'touchmove',\n    (e) => {\n        if (\n            kbWrapper.classList.contains(\n                'hidden'\n            )\n        ) {\n            return;\n        }\n        const dy =\n            e.touches[0].clientY -\n            resultStartY;\n        if (dy < -8) {\n            kbWrapper.classList.add(\n                'hidden'\n            );\n        }\n    },\n    {\n        passive: true\n    }\n);\nscrollAreaEl.addEventListener(\n    'scroll',\n    () => {\n        if (\n            scrollAreaEl.scrollTop > 4 &&\n            !kbWrapper.classList.contains(\n                'hidden'\n            )\n        ) {\n            kbWrapper.classList.add(\n                'hidden'\n            );\n        }\n    },\n    {\n        passive: true\n    }\n);\n/* ==================== ПЕРВИННИЙ СТАН КРАПОЧОК ==================== */\nrenderArticlesDots();\n<\/script>\n</body>\n</html>", "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#ffffff\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<title>Пошук</title>\n<style>\n*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }\n\nhtml, body {\n    width: 100%; height: 100%; overflow: hidden;\n    font-family: -apple-system, Arial, sans-serif;\n    background: #fff; touch-action: none;\n}\n\n#pages { display: flex; height: 100%; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); }\n.page { height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative; flex-shrink: 0; }\n\n/* SEARCH PAGE */\n.search-header { padding: 16px 16px 8px; padding-top: calc(16px + env(safe-area-inset-top)); flex-shrink: 0; }\ninput#input {\n    width: 100%; padding: 16px 18px; font-size: 22px; border-radius: 14px;\n    border: 1px solid #e5e7eb; text-align: center; outline: none;\n    background: #f9fafb; color: #111; caret-color: transparent; height: 60px;\n}\n\n.scroll-area { flex: 1; overflow-y: auto; padding: 8px 16px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }\n\n/* ==================== RESULT CARDS (NEW DESIGN) ==================== */\n.result-card {\n    background: #ffffff;\n    border-radius: 22px;\n    box-shadow: 0 2px 14px rgba(0,0,0,0.08);\n    padding: 24px;\n    margin-bottom: 16px;\n}\n\n.result-top {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    gap: 12px;\n    margin-bottom: 20px;\n}\n\n.result-material-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    color: #111111;\n    font-weight: 700;\n    font-size: 20px;\n    line-height: 1.1;\n    white-space: nowrap;\n}\n\n.result-material-badge .box-icon { font-size: 0.85em; }\n\n.result-address-new {\n    font-weight: 600;\n    font-size: 14px;\n    color: #059669;\n    white-space: nowrap;\n    text-align: right;\n}\n\n.article-row {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    gap: 16px;\n    padding: 14px 0;\n    border-top: 1px solid #ECECEC;\n}\n.article-row:first-child {\n    border-top: none;\n    padding-top: 0;\n}\n\n.article-number {\n    font-size: 15px;\n    font-weight: 700;\n    color: #111111;\n    white-space: nowrap;\n}\n.article-number .art-g1 { margin-right: 3px; }\n.article-number .art-g2 { font-size: 1.2em; margin-right: 3px; }\n.article-number .art-g3 { }\n\n.article-stations {\n    font-size: 20px;\n    font-weight: 800;\n    color: #111111;\n    text-align: right;\n    line-height: 1.3;\n}\n\n/* ==================== СПИСОК ОЧІКУВАННЯ (WAITLIST) ==================== */\n.waitlist-title {\n    font-size: 18px;\n    font-weight: 700;\n    color: #111111;\n    text-align: center;\n    padding: 8px 0;\n}\n\n.select-btn {\n    border: none;\n    background: transparent;\n    font-size: 24px;\n    line-height: 1;\n    cursor: pointer;\n    padding: 2px 4px;\n    color: #d1d5db;\n    flex-shrink: 0;\n}\n.select-btn.selected { color: #FFC400; }\n.select-btn:active { transform: scale(.9); }\n\n.waitlist-actions-row {\n    display: flex;\n    gap: 8px;\n    margin-top: 16px;\n}\n\n.waitlist-remove-btn {\n    border: none;\n    background: #fff7e0;\n    color: #b45309;\n    font-weight: 700;\n    font-size: 14px;\n    border-radius: 10px;\n    padding: 10px 0;\n    flex: 1;\n    text-align: center;\n    cursor: pointer;\n}\n.waitlist-remove-btn:active { background: #fdeeca; }\n\n.comment-toggle-btn {\n    border: none;\n    background: #eef2ff;\n    color: #4338ca;\n    font-weight: 700;\n    font-size: 14px;\n    border-radius: 10px;\n    padding: 10px 0;\n    flex: 1;\n    text-align: center;\n    cursor: pointer;\n}\n.comment-toggle-btn:active { background: #e0e7ff; }\n\n.comment-edit-area { margin-top: 12px; }\n.comment-textarea {\n    width: 100%;\n    border: 1px solid #e5e7eb;\n    border-radius: 10px;\n    padding: 10px 12px;\n    font-size: 14px;\n    font-family: inherit;\n    resize: vertical;\n    min-height: 64px;\n    outline: none;\n    color: #111;\n    background: #f9fafb;\n}\n.comment-save-btn {\n    display: block;\n    margin-top: 8px;\n    border: none;\n    background: #4338ca;\n    color: #fff;\n    font-weight: 700;\n    font-size: 14px;\n    border-radius: 10px;\n    padding: 10px 0;\n    width: 100%;\n    text-align: center;\n    cursor: pointer;\n}\n.comment-save-btn:active { background: #372ea8; }\n\n.waitlist-comment-text {\n    margin-top: 12px;\n    padding: 10px 12px;\n    background: #f3f4f6;\n    border-radius: 10px;\n    font-size: 14px;\n    color: #374151;\n    white-space: pre-wrap;\n    word-break: break-word;\n}\n\n/* HIGHLIGHT */\nmark.hl {\n    background: #fde047;\n    color: #111;\n    border-radius: 3px;\n    padding: 0 2px;\n    font-weight: inherit;\n}\n\n/* KEYBOARDS */\n.kb-container {\n    flex-shrink: 0; background: #fff; border-top: 1px solid #e5e7eb;\n    padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom));\n}\n.kb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n.hidden { display: none !important; }\n\n.btn {\n    background: #fff; border: 1px solid #222; border-radius: 8px;\n    color: #222; font-size: 18px; font-weight: 600; padding: 15px 0;\n    text-align: center; touch-action: manipulation; user-select: none;\n}\n.btn:active { background: #F7F7F7; transform: scale(.96); }\n.btn-special { background: #f1f5f9; }\n\n/* КАРУСЕЛЬ ДОДАТКОВИХ КНОПОК (sp, ts, стр, мм, ...) */\n.kb-carousel {\n    display: flex; align-items: flex-start; gap: 10px;\n    overflow-x: auto; overflow-y: hidden;\n    -webkit-overflow-scrolling: touch;\n    touch-action: pan-x;\n    scroll-snap-type: x proximity;\n    scrollbar-width: none;\n    height: 0; margin-top: 0; opacity: 0;\n    transition: height 0.28s ease, margin-top 0.28s ease, opacity 0.22s ease;\n}\n.kb-carousel.visible { margin-top: 10px; opacity: 1; }\n.kb-carousel::-webkit-scrollbar { display: none; }\n.kb-carousel .btn {\n    flex: 0 0 auto; width: calc((100% - 20px) / 3); padding: 15px 4px;\n    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\n    scroll-snap-align: start;\n}\n\n/* TABLE PAGES */\n.table-page { background: #fff; }\n.table-header { padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); border-bottom: 1px solid #e5e7eb; flex-shrink: 0; display: flex; justify-content: space-between; align-items: baseline; }\n.table-title { font-weight: 700; font-size: 16px; color: #111; }\n.table-updated { font-size: 11px; color: #9ca3af; }\n.table-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }\ntable { border-collapse: collapse; font-size: 13px; min-width: 100%; }\nth { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 12px 8px; position: sticky; top: 0; text-align: left; font-weight: 700; color: #333; }\ntd { border: 1px solid #e2e8f0; padding: 8px; white-space: nowrap; color: #444; }\ntr:nth-child(even) td { background: #f9fafb; }\n\n.page-dots { position: fixed; bottom: calc(8px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 5px; pointer-events: none; z-index: 10; opacity: 0; transition: opacity 0.2s ease; }\n.page-dots.visible { opacity: 1; }\n.dot { width: 5px; height: 5px; border-radius: 50%; background: #d1d5db; }\n.dot.active { background: #374151; transform: scale(1.4); }\n</style>\n</head>\n<body>\n\n<div id=\"pages\">\n    <!-- PAGE (waitlist): свайп управо від пошуку -->\n    <div class=\"page\" id=\"page-waitlist\">\n        <div class=\"search-header\"><div class=\"waitlist-title\">? Обрані матеріали</div></div>\n        <div class=\"scroll-area\"><div id=\"waitlist-result\"></div></div>\n    </div>\n    <!-- PAGE (search) -->\n    <div class=\"page\" id=\"page0\">\n        <div class=\"search-header\"><input id=\"input\" readonly></div>\n        <div class=\"scroll-area\"><div id=\"result\"></div></div>\n        <div id=\"kb-wrapper\" class=\"kb-container\">\n            <div id=\"kb1\" class=\"kb-grid\">\n                <button class=\"btn\" data-v=\"1\">1</button>\n                <button class=\"btn\" data-v=\"2\">2</button>\n                <button class=\"btn\" data-v=\"3\">3</button>\n                <button class=\"btn\" data-v=\"4\">4</button>\n                <button class=\"btn\" data-v=\"5\">5</button>\n                <button class=\"btn\" data-v=\"6\">6</button>\n                <button class=\"btn\" data-v=\"7\">7</button>\n                <button class=\"btn\" data-v=\"8\">8</button>\n                <button class=\"btn\" data-v=\"9\">9</button>\n                <button class=\"btn\" data-v=\"с\">с</button>\n                <button class=\"btn\" data-v=\"0\">0</button>\n                <button class=\"btn btn-special\" data-del=\"all\">?</button>\n            </div>\n            <div id=\"kb-carousel\" class=\"kb-carousel\"></div>\n        </div>\n    </div>\n    <!-- TABLE PAGES генеруються скриптом нижче -->\n</div>\n\n<div class=\"page-dots\" id=\"page-dots\"></div>\n\n<script>\n/* ==================== ДЖЕРЕЛО ДАНИХ ====================\n   Аркуші зліва більше НЕ тягнуться з окремих гугл-таблиць —\n   вони будуються динамічно з тих самих даних, що і пошук.\n\n   ЛОГІКА ГРУПУВАННЯ АРТИКУЛІВ (стовпчик C):\n   Унікальний артикул — це ПОВНИЙ номер (напр. 7340112, 7340113 і т.д.).\n   Якщо один і той самий матеріал стосується декількох повних артикулів,\n   у стовпчику C це записують скорочено через \"/\":\n       7340112/113/114/115/174/175\n   Це означає ШІСТЬ окремих повних артикулів:\n       7340112, 7340113, 7340114, 7340115, 7340174, 7340175\n   (перше число повне, решта — це останні 3 цифри, які \"доклеюються\"\n   до спільного префікса першого числа: 7340 + 113 = 7340113 і т.д.)\n\n   Кожен такий повний артикул отримує свою окрему сторінку зі списком\n   станцій/адрес, куди він застосовується — так само, як показує пошук.\n   Короткі коди самі по собі (окремим рядком, без \"/\") у цих даних не\n   зустрічаються — вони існують лише всередині складеного запису вище,\n   тож ніякого додаткового \"домержування\" не потрібно: досатньо просто\n   розгорнути кожен рядок і згрупувати рядки за повним артикулом. */\nconst SPREADSHEET_ID = \"1ii4oiQvbayKKN1tffS4X7WxH0NPZ0oiooaHPP6Ku6W8\";\nconst SEARCH_GID = \"1679964111\";\n/* ================================================================ */\n\nlet TOTAL_PAGES = 2; // сторінка очікування + пошук; аркуші груп додаються динамічно\nconst SEARCH_PAGE_INDEX = 1; // 0 = waitlist, 1 = search, 2+ = аркуші повних артикулів\nlet currentPage = SEARCH_PAGE_INDEX;\nlet searchData = [];\nlet pageWidthPercent = 100 / TOTAL_PAGES;\nlet articleGroups = [];\n\nconst input = document.getElementById('input');\nconst resultBox = document.getElementById('result');\nconst waitlistBox = document.getElementById('waitlist-result');\nconst kbWrapper = document.getElementById('kb-wrapper');\nconst pagesEl = document.getElementById('pages');\nconst dotsEl = document.getElementById('page-dots');\n\nconst CACHE_KEY_SEARCH = \"searchDataCSV\";\nconst CACHE_KEY_SEARCH_TIME = \"searchDataCSVTime\";\n\n/* ---------- Розбір складеного запису артикулу з колонки C ---------- */\nfunction normalizeArticlePart(part) {\n    return String(part || \"\").trim().replace(/\\s+/g, \"\");\n}\n\n// Базовий артикул завжди складається з 7 цифр. Якщо після цих 7 цифр\n// іде щось ще (додаткові цифри, букви — будь-що, напр. \"734011202А\"),\n// це вважається тим самим артикулом \"7340112\", а \"02А\" — просто\n// суфіксом/варіантом, який не впливає на групування по сторінках.\nfunction getArticleBase(code) {\n    if (/^\\d{7}/.test(code) && code.length > 7) {\n        return code.slice(0, 7);\n    }\n    return code;\n}\n\n// \"7340112/113/114/115/174/175\" -> [\"7340112\",\"7340113\",\"7340114\",\"7340115\",\"7340174\",\"7340175\"]\n// \"7340112\"                     -> [\"7340112\"]\n// \"734011202А\"                  -> [\"7340112\"]  (суфікс \"02А\" ігнорується при групуванні)\nfunction expandArticleValue(raw) {\n    raw = String(raw || \"\").trim();\n    if (!raw) return [];\n\n    const parts = raw\n        .split(\"/\")\n        .map(normalizeArticlePart)\n        .filter(Boolean);\n\n    if (!parts.length) return [];\n\n    // Звичайний одиночний артикул — нічого розгортати, лише привести до бази.\n    if (parts.length === 1) {\n        return [getArticleBase(parts[0])];\n    }\n\n    const first = getArticleBase(parts[0]);\n    const result = [first];\n\n    // Для 7340112 (7 цифр): префікс = перші 4 цифри = \"7340\",\n    // далі кожне коротке число (до 3 цифр) доклеюється до префікса:\n    // 113 -> 7340113, 114 -> 7340114, 174 -> 7340174 і т.д.\n    let prefix = \"\";\n    if (/^\\d+$/.test(first) && first.length >= 3) {\n        prefix = first.slice(0, -3);\n    }\n\n    for (let i = 1; i < parts.length; i++) {\n        const part = parts[i];\n\n        if (/^\\d{1,3}$/.test(part) && prefix) {\n            result.push(prefix + part.padStart(3, \"0\"));\n        } else {\n            // Не коротке число (чи вже повний код із можливим суфіксом) — приводимо до бази.\n            result.push(getArticleBase(part));\n        }\n    }\n\n    return [...new Set(result)];\n}\n\n/* ---------- Групування рядків за повним артикулом ---------- */\nfunction computeArticleGroups() {\n    const groups = {};\n\n    // Кожен рядок може стосуватись кількох повних артикулів одразу\n    // (якщо в колонці C складений запис через \"/\").\n    searchData.forEach(row => {\n        const articles = expandArticleValue(row.article);\n\n        articles.forEach(article => {\n            if (!article) return;\n            if (!groups[article]) groups[article] = [];\n            groups[article].push(row);\n        });\n    });\n\n    // Прибираємо дублікати рядків усередині кожної групи.\n    Object.keys(groups).forEach(article => {\n        const seen = new Set();\n\n        groups[article] = groups[article].filter(row => {\n            const key = [\n                row.station,\n                row.material,\n                row.article,\n                row.colD,\n                row.address\n            ].join(\"|||\");\n\n            if (seen.has(key)) return false;\n\n            seen.add(key);\n            return true;\n        });\n    });\n\n    const keys = Object.keys(groups).sort((a, b) =>\n        a.localeCompare(b, \"uk\", { numeric: true, sensitivity: \"base\" })\n    );\n\n    return keys.map(article => ({\n        article,\n        rows: groups[article]\n    }));\n}\n\nfunction renderGroupTable(container, rows, targetArticle) {\n    const sorted = [...rows].sort((a, b) =>\n        a.station.localeCompare(b.station, \"uk\", { numeric: true })\n    );\n\n    let h = `\n        <table>\n            <thead>\n                <tr>\n                    <th>Артикул</th>\n                    <th>Матеріал</th>\n                    <th>Станція</th>\n                    <th>Адреса</th>\n                </tr>\n            </thead>\n            <tbody>\n    `;\n\n    sorted.forEach(r => {\n        h += `\n            <tr>\n                <td>${escapeHtml(targetArticle)}</td>\n                <td>${escapeHtml(r.material)}</td>\n                <td>${escapeHtml(r.station)}</td>\n                <td>${escapeHtml(r.address)}</td>\n            </tr>\n        `;\n    });\n\n    h += `\n            </tbody>\n        </table>\n    `;\n\n    container.innerHTML = h;\n}\n\n// Перебудовує аркуші зліва з поточних searchData. Викликається одразу після\n// завантаження кешу і повторно після кожного свіжого фетчу з Google Таблиці.\nfunction buildArticleGroupPages() {\n    document.querySelectorAll('.page.article-group-page').forEach(p => p.remove());\n\n    articleGroups = computeArticleGroups();\n    const updatedTime = localStorage.getItem(CACHE_KEY_SEARCH_TIME);\n    const updatedLabel = updatedTime ? ('оновлено ' + formatDate(updatedTime)) : '';\n\n    articleGroups.forEach(group => {\n        const pageEl = document.createElement('div');\n        pageEl.className = 'page table-page article-group-page';\n        pageEl.innerHTML = `\n            <div class=\"table-header\">\n                <span class=\"table-title\">Артикул ${escapeHtml(group.article)}</span>\n                <span class=\"table-updated\">${group.rows.length} зап. ${updatedLabel ? '• ' + updatedLabel : ''}</span>\n            </div>\n            <div class=\"table-scroll\"><div class=\"group-table-content\"></div></div>`;\n        pagesEl.appendChild(pageEl);\n        renderGroupTable(\n            pageEl.querySelector('.group-table-content'),\n            group.rows,\n            group.article\n        );\n    });\n\n    TOTAL_PAGES = 2 + articleGroups.length;\n    pageWidthPercent = 100 / TOTAL_PAGES;\n    document.querySelectorAll('.page').forEach(p => { p.style.width = pageWidthPercent + '%'; });\n    pagesEl.style.width = (TOTAL_PAGES * 100) + '%';\n\n    // перебудовуємо крапки\n    dotsEl.innerHTML = '';\n    for (let i = 0; i < TOTAL_PAGES; i++) {\n        const d = document.createElement('div');\n        d.className = 'dot' + (i === currentPage ? ' active' : '');\n        d.id = 'dot' + i;\n        dotsEl.appendChild(d);\n    }\n\n    // не змінюємо позицію користувача різко — лише підстраховка, якщо сторінок стало менше\n    currentPage = Math.min(currentPage, TOTAL_PAGES - 1);\n    pagesEl.style.transition = 'none';\n    pagesEl.style.transform = `translateX(-${currentPage * pageWidthPercent}%)`;\n    requestAnimationFrame(() => { pagesEl.style.transition = ''; });\n}\n\n/* ---------- Клавіатура (сторінка пошуку) ---------- */\n\n\n// Кнопки каруселі — щоб додати нову, просто допишіть value в масив\nconst CAROUSEL_KEYS = [\"sp\", \"ts\", \"стр\", \"мм\", \"передмонтаж\"];\nconst carouselEl = document.getElementById('kb-carousel');\nCAROUSEL_KEYS.forEach(v => {\n    const b = document.createElement('button');\n    b.className = 'btn';\n    b.dataset.v = v;\n    b.textContent = v;\n    carouselEl.appendChild(b);\n});\n\n// Показ/приховування каруселі (живе «витягування» слідом за пальцем)\nlet carouselNaturalHeight = 0;\nfunction measureCarouselHeight() {\n    if (carouselNaturalHeight) return carouselNaturalHeight;\n    const firstBtn = carouselEl.querySelector('.btn');\n    carouselNaturalHeight = firstBtn ? firstBtn.offsetHeight : 54;\n    return carouselNaturalHeight;\n}\nlet carouselOpen = false;\n\n// Миттєво (без анімації) виставити висоту каруселі — викликається під час руху пальця\nfunction setCarouselDragHeight(px) {\n    const maxH = measureCarouselHeight();\n    px = Math.max(0, Math.min(maxH, px));\n    const ratio = maxH ? px / maxH : 0;\n    carouselEl.style.transition = 'none';\n    carouselEl.style.height = px + 'px';\n    carouselEl.style.opacity = ratio;\n    carouselEl.style.marginTop = (10 * ratio) + 'px';\n    if (px > 0) carouselEl.classList.add('visible'); else carouselEl.classList.remove('visible');\n}\n\n// Доанімувати до кінця (повністю відкрито/закрито) — викликається при відпусканні пальця\nfunction settleCarousel(open) {\n    const maxH = measureCarouselHeight();\n    carouselEl.style.transition = ''; // повертаємо CSS-анімацію\n    void carouselEl.offsetHeight; // форс-рефлоу, щоб анімація точно спрацювала\n    if (open) {\n        carouselEl.style.height = maxH + 'px';\n        carouselEl.style.opacity = '1';\n        carouselEl.style.marginTop = '10px';\n        carouselEl.classList.add('visible');\n    } else {\n        carouselEl.style.height = '0px';\n        carouselEl.style.opacity = '0';\n        carouselEl.style.marginTop = '0px';\n        carouselEl.classList.remove('visible');\n    }\n    carouselOpen = open;\n}\nfunction showCarousel() { settleCarousel(true); }\nfunction hideCarousel() { settleCarousel(false); }\n\n// Спільна логіка перетягування (використовується і клавіатурою, і самою каруселлю)\nlet dragStartY = 0, dragBaseHeight = 0, dragActive = false;\nfunction beginDrag(y) {\n    dragStartY = y;\n    dragBaseHeight = carouselEl.getBoundingClientRect().height;\n    dragActive = true;\n}\nfunction updateDrag(y) {\n    if (!dragActive) return;\n    const delta = dragStartY - y; // рух вгору = позитивне значення = карусель росте\n    setCarouselDragHeight(dragBaseHeight + delta);\n}\nfunction endDrag(y) {\n    if (!dragActive) return;\n    dragActive = false;\n    const delta = dragStartY - y;\n    const newH = Math.max(0, Math.min(measureCarouselHeight(), dragBaseHeight + delta));\n    settleCarousel(newH > measureCarouselHeight() * 0.35);\n}\n\n// Перетягування усередині каруселі: горизонтальний рух — гортання кнопок (нативний скрол),\n// вертикальний рух вниз — «затягує» карусель назад слідом за пальцем\nlet carouselStartX = 0, carouselStartY = 0, carouselDragging = false;\ncarouselEl.addEventListener('touchstart', (e) => {\n    carouselStartX = e.touches[0].clientX;\n    carouselStartY = e.touches[0].clientY;\n    carouselDragging = false;\n    e.stopPropagation();\n}, {passive:true});\ncarouselEl.addEventListener('touchmove', (e) => {\n    const x = e.touches[0].clientX, y = e.touches[0].clientY;\n    const dx = x - carouselStartX, dy = y - carouselStartY;\n    if (Math.abs(dy) > Math.abs(dx) && dy > 0) {\n        if (!carouselDragging) { carouselDragging = true; beginDrag(carouselStartY); }\n        updateDrag(y);\n    }\n    e.stopPropagation();\n}, {passive:true});\ncarouselEl.addEventListener('touchend', (e) => {\n    if (carouselDragging) { endDrag(e.changedTouches[0].clientY); }\n    carouselDragging = false;\n    e.stopPropagation();\n}, {passive:true});\n\n// Перетягування по самій клавіатурі (цифровий блок): вгору — «витягує» карусель,\n// вниз — «затягує» назад. Слідує за пальцем у реальному часі.\nlet kbStartX = 0, kbStartY = 0, kbMoved = false;\nkbWrapper.addEventListener('touchstart', (e) => {\n    kbStartX = e.touches[0].clientX;\n    kbStartY = e.touches[0].clientY;\n    kbMoved = false;\n}, {passive:true});\nkbWrapper.addEventListener('touchmove', (e) => {\n    const x = e.touches[0].clientX, y = e.touches[0].clientY;\n    const dx = x - kbStartX, dy = y - kbStartY;\n    if (Math.abs(dy) > Math.abs(dx)) {\n        if (!kbMoved) { kbMoved = true; beginDrag(kbStartY); }\n        updateDrag(y);\n    }\n}, {passive:true});\nkbWrapper.addEventListener('touchend', (e) => {\n    if (kbMoved) { endDrag(e.changedTouches[0].clientY); }\n    kbMoved = false;\n}, {passive:true});\n\nlet lastInputFromCarousel = false;\ndocument.getElementById('kb-wrapper').addEventListener('click', (e) => {\n    const btn = e.target.closest('.btn');\n    if (!btn) return;\n    e.stopPropagation();\n    if (btn.dataset.del) {\n        input.value = \"\";\n        lastInputFromCarousel = false;\n    } else if (btn.dataset.v !== undefined) {\n        input.value += btn.dataset.v;\n        lastInputFromCarousel = !!btn.closest('#kb-carousel');\n    }\n    search();\n});\n\nfunction parseSearchCSV(t) {\n    searchData = t.trim().split(\"\\n\").map(r => {\n        const c = r.split(\",\");\n        return {\n            station: c[0]||\"\",\n            material: c[1]||\"\",\n            article: c[2]||\"\",\n            colD: c[3]||\"\",\n            address: c[4]||\"\"\n        };\n    });\n}\n\n// 1. СПОЧАТКУ дивимось у кеш і одразу малюємо, якщо там щось є\nconst cachedSearch = localStorage.getItem(CACHE_KEY_SEARCH);\nif (cachedSearch) {\n    parseSearchCSV(cachedSearch);\n    if (input.value) search();\n}\nbuildArticleGroupPages();\n\n// 2. ПОТІМ у фоні тягнемо свіжі дані і тихо оновлюємо кеш + список + аркуші зліва\nfunction fetchSearchData() {\n    const url1 = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${SEARCH_GID}&t=` + Date.now();\n    fetch(url1)\n    .then(r => r.text())\n    .then(t => {\n        localStorage.setItem(CACHE_KEY_SEARCH, t);\n        localStorage.setItem(CACHE_KEY_SEARCH_TIME, Date.now().toString());\n        parseSearchCSV(t);\n        buildArticleGroupPages();\n        if (input.value) search();\n    })\n    .catch(() => {});\n}\nfetchSearchData();\n\n// Екранування HTML перед вставкою\nfunction escapeHtml(str) {\n    return String(str)\n        .replace(/&/g, \"&amp;\")\n        .replace(/</g, \"&lt;\")\n        .replace(/>/g, \"&gt;\");\n}\n\nfunction highlight(text, v, fromEnd) {\n    const safe = escapeHtml(text);\n    if (!v) return safe;\n    const lower = text.toLowerCase();\n    if (fromEnd) {\n        if (!lower.endsWith(v)) return safe;\n        const idx = text.length - v.length;\n        return escapeHtml(text.slice(0, idx)) + '<mark class=\"hl\">' + escapeHtml(text.slice(idx)) + '</mark>';\n    } else {\n        if (!lower.startsWith(v)) return safe;\n        return '<mark class=\"hl\">' + escapeHtml(text.slice(0, v.length)) + '</mark>' + escapeHtml(text.slice(v.length));\n    }\n}\n\n// Розбиває масив HTML-рядків станцій на рядки по STATIONS_PER_LINE штук,\n// з'єднуючи їх \" | \" і переносячи (<br>) кожні STATIONS_PER_LINE елементів.\nconst STATIONS_PER_LINE = 5;\nfunction buildStationsHtml(stationHtmlArr) {\n    const lines = [];\n    for (let i = 0; i < stationHtmlArr.length; i += STATIONS_PER_LINE) {\n        lines.push(stationHtmlArr.slice(i, i + STATIONS_PER_LINE).join(\" | \"));\n    }\n    return lines.join(\"<br>\");\n}\n\n// Розбиває номер артикулу на групи 4-3-решта (напр. \"779600813B\" -> \"7796 008 13B\"),\n// середня група трохи більшим шрифтом, з невеликим відступом між групами (не пробіл).\n// Підсвітка (mark.hl) для знайдених цифр зберігається так само, як і раніше.\nfunction renderArticleNumber(art, v, isNumOnly, isSpecialSearch) {\n    let matchStart = -1, matchEnd = -1;\n    if (!isSpecialSearch && v) {\n        const lower = art.toLowerCase();\n        if (isNumOnly) {\n            if (lower.endsWith(v)) { matchStart = art.length - v.length; matchEnd = art.length; }\n        } else {\n            if (lower.startsWith(v)) { matchStart = 0; matchEnd = v.length; }\n        }\n    }\n    function part(s, e) {\n        const str = art.slice(s, e);\n        if (matchStart === -1) return escapeHtml(str);\n        const overlapStart = Math.max(s, matchStart);\n        const overlapEnd = Math.min(e, matchEnd);\n        if (overlapStart >= overlapEnd) return escapeHtml(str);\n        let out = '';\n        if (overlapStart > s) out += escapeHtml(art.slice(s, overlapStart));\n        out += '<mark class=\"hl\">' + escapeHtml(art.slice(overlapStart, overlapEnd)) + '</mark>';\n        if (overlapEnd < e) out += escapeHtml(art.slice(overlapEnd, e));\n        return out;\n    }\n    const len = art.length;\n    if (len <= 4) return `<span class=\"art-g1\">${part(0, len)}</span>`;\n    const g1end = Math.min(4, len);\n    const g2end = Math.min(7, len);\n    let html = `<span class=\"art-g1\">${part(0, g1end)}</span>`;\n    if (len > 4) html += `<span class=\"art-g2\">${part(g1end, g2end)}</span>`;\n    if (len > 7) html += `<span class=\"art-g3\">${part(g2end, len)}</span>`;\n    return html;\n}\n\n// ==================== СПИСОК ОЧІКУВАННЯ (обрані матеріали) ====================\n// Зберігається у localStorage, живе доти, доки не очистити кеш браузера.\nconst CACHE_KEY_WAITLIST = \"materialWaitlist\";\n\nfunction loadWaitlist() {\n    try { return JSON.parse(localStorage.getItem(CACHE_KEY_WAITLIST) || \"[]\"); }\n    catch (e) { return []; }\n}\nfunction saveWaitlist(list) {\n    localStorage.setItem(CACHE_KEY_WAITLIST, JSON.stringify(list));\n}\nfunction isInWaitlist(key) {\n    return loadWaitlist().some(item => item.key === key);\n}\nfunction toggleWaitlistItem(key, material, address, articlesPlain) {\n    const list = loadWaitlist();\n    const idx = list.findIndex(item => item.key === key);\n    if (idx >= 0) {\n        list.splice(idx, 1);\n    } else {\n        list.push({ key, material, address, articles: articlesPlain, comment: \"\" });\n    }\n    saveWaitlist(list);\n    return idx < 0; // true = щойно додано, false = щойно прибрано\n}\nfunction setWaitlistComment(key, text) {\n    const list = loadWaitlist();\n    const idx = list.findIndex(item => item.key === key);\n    if (idx >= 0) {\n        list[idx].comment = text;\n        saveWaitlist(list);\n    }\n}\n\nlet waitlistCardKeys = [];\nfunction renderWaitlistPage() {\n    const list = loadWaitlist();\n    if (!list.length) {\n        waitlistBox.innerHTML = '<div style=\"text-align:center; padding:40px; color:#aaa;\">Список порожній</div>';\n        waitlistCardKeys = [];\n        return;\n    }\n    waitlistCardKeys = [];\n    let html = \"\";\n    list.forEach(item => {\n        const idx = waitlistCardKeys.push(item.key) - 1;\n        const hasComment = !!(item.comment && item.comment.trim());\n        html += `<div class=\"result-card\">\n            <div class=\"result-top\">\n                <span class=\"result-material-badge\"><span class=\"box-icon\">??</span>${escapeHtml(item.material)}</span>\n                <div style=\"display:flex; align-items:center; gap:8px;\">\n                    <span class=\"result-address-new\">${escapeHtml(item.address)}</span>\n                </div>\n            </div>`;\n        for (let art in item.articles) {\n            const stationHtmlArr = item.articles[art].map(st => escapeHtml(st));\n            const stationsHtml = buildStationsHtml(stationHtmlArr);\n            html += `<div class=\"article-row\">\n                <span class=\"article-number\">${renderArticleNumber(art, \"\", false, true)}</span>\n                <span class=\"article-stations\">${stationsHtml}</span>\n            </div>`;\n        }\n        html += `<div class=\"waitlist-actions-row\">\n                <button class=\"waitlist-remove-btn\" data-idx=\"${idx}\">? Прибрати зі списку</button>\n                <button class=\"comment-toggle-btn\" data-idx=\"${idx}\">${hasComment ? '? Коментар' : '?? Коментар'}</button>\n            </div>\n            <div class=\"comment-edit-area hidden\" data-idx=\"${idx}\">\n                <textarea class=\"comment-textarea\" data-idx=\"${idx}\" placeholder=\"Ваш коментар...\">${escapeHtml(item.comment || \"\")}</textarea>\n                <button class=\"comment-save-btn\" data-idx=\"${idx}\">Зберегти</button>\n            </div>`;\n        if (hasComment) {\n            html += `<div class=\"waitlist-comment-text\" data-idx=\"${idx}\">${escapeHtml(item.comment)}</div>`;\n        }\n        html += `</div>`;\n    });\n    waitlistBox.innerHTML = html;\n}\n\nwaitlistBox.addEventListener('click', (e) => {\n    const removeBtn = e.target.closest('.waitlist-remove-btn');\n    if (removeBtn) {\n        const key = waitlistCardKeys[parseInt(removeBtn.dataset.idx, 10)];\n        if (key === undefined) return;\n        const list = loadWaitlist().filter(item => item.key !== key);\n        saveWaitlist(list);\n        renderWaitlistPage();\n        return;\n    }\n    const toggleBtn = e.target.closest('.comment-toggle-btn');\n    if (toggleBtn) {\n        const idx = toggleBtn.dataset.idx;\n        const area = waitlistBox.querySelector(`.comment-edit-area[data-idx=\"${idx}\"]`);\n        if (area) {\n            area.classList.toggle('hidden');\n            if (!area.classList.contains('hidden')) {\n                const ta = area.querySelector('.comment-textarea');\n                if (ta) ta.focus();\n            }\n        }\n        return;\n    }\n    const saveBtn = e.target.closest('.comment-save-btn');\n    if (saveBtn) {\n        const idx = parseInt(saveBtn.dataset.idx, 10);\n        const key = waitlistCardKeys[idx];\n        if (key === undefined) return;\n        const textarea = waitlistBox.querySelector(`.comment-textarea[data-idx=\"${idx}\"]`);\n        const text = textarea ? textarea.value : \"\";\n        setWaitlistComment(key, text);\n        renderWaitlistPage();\n        return;\n    }\n});\n\n// Клік по кнопці-зірочці на картці результату пошуку — додає/прибирає матеріал зі списку очікування\nlet searchCardKeys = [];\nlet searchResultLookup = {};\nresultBox.addEventListener('click', (e) => {\n    const btn = e.target.closest('.select-btn');\n    if (!btn) return;\n    const key = searchCardKeys[parseInt(btn.dataset.idx, 10)];\n    if (key === undefined) return;\n    const data = searchResultLookup[key];\n    if (!data) return;\n    const nowSelected = toggleWaitlistItem(key, data.material, data.address, data.articles);\n    btn.classList.toggle('selected', nowSelected);\n    btn.textContent = nowSelected ? '?' : '?';\n});\n\n// Об'єднує \"короткі\" (скорочені, до 3 символів) артикули з відповідним \"повним\" артикулом\n// у тій самій групі матеріалу, якщо короткий код збігається з останніми 3 символами повного.\n// Наприклад: \"7340112\" і \"112\" — це один і той самий артикул, так само \"7340114\" і \"114\" тощо.\nfunction mergeAbbreviatedArticles(articleMap) {\n    const arts = Object.keys(articleMap);\n    const fullArts = arts.filter(a => a.length > 3);\n    const shortArts = arts.filter(a => a.length <= 3);\n    if (!shortArts.length) return articleMap; // нічого зливати\n\n    const fullByLast3 = {};\n    fullArts.forEach(a => {\n        const last3 = a.slice(-3);\n        if (!fullByLast3[last3]) fullByLast3[last3] = a;\n    });\n\n    const merged = {};\n    fullArts.forEach(a => { merged[a] = new Set(articleMap[a]); });\n    shortArts.forEach(shortArt => {\n        const target = fullByLast3[shortArt];\n        if (target) {\n            articleMap[shortArt].forEach(st => merged[target].add(st));\n        } else {\n            // немає відповідного повного артикулу в цій групі — залишаємо як є\n            if (!merged[shortArt]) merged[shortArt] = new Set();\n            articleMap[shortArt].forEach(st => merged[shortArt].add(st));\n        }\n    });\n    return merged;\n}\n\nfunction search() {\n    const v = input.value.toLowerCase();\n    if (!v) { resultBox.innerHTML = \"\"; return; }\n    const isNumOnly = /^\\d+$/.test(v);\n    const isSpecialSearch = v.includes(\"стр\") || v.includes(\"мм\") || v.includes(\"ts\");\n\n    const filtered = searchData.filter(x => {\n        if (isSpecialSearch) return x.colD.toLowerCase().startsWith(v);\n        if (isNumOnly) {\n            return x.station.toLowerCase().endsWith(v)\n                || x.material.toLowerCase().endsWith(v)\n                || x.article.toLowerCase().endsWith(v)\n                || x.colD.toLowerCase().endsWith(v)\n                || x.address.toLowerCase().endsWith(v);\n        }\n        return x.station.toLowerCase().startsWith(v)\n            || x.material.toLowerCase().startsWith(v)\n            || x.article.toLowerCase().startsWith(v)\n            || x.colD.toLowerCase().startsWith(v)\n            || x.address.toLowerCase().startsWith(v);\n    });\n\n    if (!filtered.length) { resultBox.innerHTML = '<div style=\"text-align:center; padding:40px; color:#aaa;\">Не знайдено</div>'; return; }\n\n    let html = \"\";\n    searchCardKeys = [];\n    searchResultLookup = {};\n\n    if (lastInputFromCarousel) {\n        // СТАРЕ групування (як шукалось через карусель раніше): спочатку артикул,\n        // під ним — матеріал+адреса, і станції. Відображення — у новому дизайні карток.\n        const grouped = {};\n        filtered.forEach(x => {\n            if (!grouped[x.article]) grouped[x.article] = {};\n            const matKey = x.material + \"|\" + x.address;\n            if (!grouped[x.article][matKey]) grouped[x.article][matKey] = new Set();\n            grouped[x.article][matKey].add(x.station);\n        });\n        for (let art in grouped) {\n            const artHtml = renderArticleNumber(art, v, isNumOnly, isSpecialSearch);\n            html += `<div class=\"result-card\">\n                <div class=\"result-top\">\n                    <span class=\"result-material-badge\"><span class=\"box-icon\">??</span>${artHtml}</span>\n                </div>`;\n            let first = true;\n            for (let matKey in grouped[art]) {\n                const [matName, matAddr] = matKey.split(\"|\");\n                const matHtml = isSpecialSearch ? escapeHtml(matName) : highlight(matName, v, isNumOnly);\n                const addrHtml = isSpecialSearch ? escapeHtml(matAddr) : highlight(matAddr, v, isNumOnly);\n                const stationHtmlArr = [...grouped[art][matKey]]\n                    .map(st => isSpecialSearch ? escapeHtml(st) : highlight(st, v, isNumOnly));\n                const stationsHtml = buildStationsHtml(stationHtmlArr);\n                html += `<div class=\"article-row\"${first ? ' style=\"border-top:none;padding-top:0;\"' : ''}>\n                    <span class=\"article-number\">${matHtml}</span>\n                    <span class=\"article-stations\">${addrHtml}<br>${stationsHtml}</span>\n                </div>`;\n                first = false;\n            }\n            html += `</div>`;\n        }\n    } else {\n        // НОВЕ групування: групуємо по матеріалу (+адреса), щоб не повторювати\n        // назву матеріалу для кожного артикула окремо. Дизайн карток — як на скріншоті.\n        const grouped = {};\n        filtered.forEach(x => {\n            const matKey = x.material + \"|\" + x.address;\n            if (!grouped[matKey]) grouped[matKey] = {};\n            if (!grouped[matKey][x.article]) grouped[matKey][x.article] = new Set();\n            grouped[matKey][x.article].add(x.station);\n        });\n        for (let matKey in grouped) {\n            const [matName, matAddr] = matKey.split(\"|\");\n            const matHtml = isSpecialSearch ? escapeHtml(matName) : highlight(matName, v, isNumOnly);\n            const addrHtml = isSpecialSearch ? escapeHtml(matAddr) : highlight(matAddr, v, isNumOnly);\n\n            const mergedArticles = mergeAbbreviatedArticles(grouped[matKey]);\n\n            const articlesPlain = {};\n            for (let art in mergedArticles) articlesPlain[art] = [...mergedArticles[art]];\n            searchResultLookup[matKey] = { material: matName, address: matAddr, articles: articlesPlain };\n            const cardIdx = searchCardKeys.push(matKey) - 1;\n            const selected = isInWaitlist(matKey);\n\n            html += `<div class=\"result-card\">\n                <div class=\"result-top\">\n                    <span class=\"result-material-badge\"><span class=\"box-icon\">??</span>${matHtml}</span>\n                    <div style=\"display:flex; align-items:center; gap:8px;\">\n                        <span class=\"result-address-new\">${addrHtml}</span>\n                        <button class=\"select-btn${selected ? ' selected' : ''}\" data-idx=\"${cardIdx}\">${selected ? '?' : '?'}</button>\n                    </div>\n                </div>`;\n            for (let art in mergedArticles) {\n                const artHtml = renderArticleNumber(art, v, isNumOnly, isSpecialSearch);\n                const stationHtmlArr = [...mergedArticles[art]]\n                    .map(st => isSpecialSearch ? escapeHtml(st) : highlight(st, v, isNumOnly));\n                const stationsHtml = buildStationsHtml(stationHtmlArr);\n                html += `<div class=\"article-row\">\n                    <span class=\"article-number\">${artHtml}</span>\n                    <span class=\"article-stations\">${stationsHtml}</span>\n                </div>`;\n            }\n            html += `</div>`;\n        }\n    }\n\n    resultBox.innerHTML = html;\n}\n\n/* ---------- Дата останнього оновлення (для аркушів з групами артикулів) ---------- */\nfunction formatDate(ts) {\n    const d = new Date(parseInt(ts, 10));\n    const pad = n => String(n).padStart(2, '0');\n    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;\n}\n\n/* ---------- Навігація між сторінками (свайп) ---------- */\nfunction goToPage(n) {\n    n = Math.max(0, Math.min(TOTAL_PAGES - 1, n));\n    currentPage = n;\n    document.getElementById('pages').style.transform = `translateX(-${n * pageWidthPercent}%)`;\n    for (let i = 0; i < TOTAL_PAGES; i++) {\n        document.getElementById('dot' + i).classList.toggle('active', i === n);\n    }\n    // Крапочки показуємо лише на бічних сторінках з артикулами (n >= 2),\n    // на пошуку (n=1) і в обраному (n=0) вони приховані.\n    dotsEl.classList.toggle('visible', n >= 2);\n    if (n === SEARCH_PAGE_INDEX) {\n        kbWrapper.classList.remove('hidden');\n    } else {\n        kbWrapper.classList.add('hidden');\n        if (n === 0) {\n            renderWaitlistPage();\n        }\n        // аркуші з групами артикулів (n >= 2) вже пре-рендерені в buildArticleGroupPages()\n    }\n}\n\nlet tx = 0, moved = false;\ndocument.addEventListener('touchstart', e => { tx = e.touches[0].clientX; moved = false; }, {passive:true});\ndocument.addEventListener('touchmove', () => { moved = true; }, {passive:true});\ndocument.addEventListener('touchend', e => {\n    const dx = e.changedTouches[0].clientX - tx;\n    if (moved && Math.abs(dx) > 60) {\n        if (dx < 0) goToPage(currentPage + 1); // свайп вліво -> наступна сторінка\n        if (dx > 0) goToPage(currentPage - 1); // свайп вправо -> попередня сторінка\n    } else if (!moved && currentPage === SEARCH_PAGE_INDEX && !kbWrapper.contains(e.target) && !e.target.closest('.select-btn')) {\n        const willHide = !kbWrapper.classList.contains('hidden');\n        kbWrapper.classList.toggle('hidden');\n        if (willHide) hideCarousel();\n    }\n}, {passive:true});\n\n// Свайп вгору по знайденому тексту (результатах пошуку) — ховає клавіатуру одразу на початку руху\nconst scrollAreaEl = document.querySelector('#page0 .scroll-area');\nlet resultStartY = 0;\nscrollAreaEl.addEventListener('touchstart', (e) => {\n    resultStartY = e.touches[0].clientY;\n}, {passive:true});\nscrollAreaEl.addEventListener('touchmove', (e) => {\n    if (kbWrapper.classList.contains('hidden')) return;\n    const dy = e.touches[0].clientY - resultStartY;\n    if (dy < -8) { // рух вгору щойно почався — ховаємо клавіатуру негайно\n        kbWrapper.classList.add('hidden');\n        hideCarousel();\n    }\n}, {passive:true});\n// підстраховка: якщо контент прогорнувся програмно/інерцією без явного touchmove-тригера\nscrollAreaEl.addEventListener('scroll', () => {\n    if (scrollAreaEl.scrollTop > 4 && !kbWrapper.classList.contains('hidden')) {\n        kbWrapper.classList.add('hidden');\n        hideCarousel();\n    }\n}, {passive:true});\n<\/script>\n</body>\n</html>", "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#ffffff\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<title>Пошук</title>\n<style>\n*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}\nhtml,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,Arial,sans-serif;background:#fff;touch-action:pan-y}\n#pages{display:flex;width:200%;height:100%;transition:transform .35s cubic-bezier(.4,0,.2,1)}\n.page{width:50%;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;flex-shrink:0}\n.search-header{padding:16px 16px 8px;padding-top:calc(16px + env(safe-area-inset-top));flex-shrink:0}\ninput#input{width:100%;padding:16px 18px;font-size:22px;border-radius:14px;border:1px solid #e5e7eb;text-align:center;outline:none;background:#f9fafb;color:#111;caret-color:transparent;height:60px}\n.scroll-area{flex:1;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}\n.result-card{margin-bottom:12px;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa}\n.result-article{font-weight:700;font-size:20px;color:#111;margin-bottom:6px}\n.result-material-name{font-size:15px;color:#666;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}\n.result-address{color:#059669;font-weight:600;font-size:14px}\n.result-stations{font-size:24px;font-weight:800;color:#000;overflow-wrap:anywhere}\nmark.hl{background:#fde047;color:#111;border-radius:3px;padding:0 2px}\n.kb-container{flex-shrink:0;background:#fff;border-top:1px solid #e5e7eb;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}\n.kb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hidden{display:none!important}\n.btn{background:#fff;border:1px solid #222;border-radius:8px;color:#222;font-size:18px;font-weight:600;padding:13px 0;text-align:center
