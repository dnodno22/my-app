<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Норма — мобільна версія</title>
<style>
  /* Усі стилі обмежені блоком #norma — не зачеплять решту вашого сайту */
  #norma{--bg:#fff;--card:#f6f7f9;--text:#1c2024;--muted:#6b7280;--line:#d9dde3;--accent:#2563eb;--good:#15803d;--bad:#b91c1c;
    font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);max-width:560px;margin:0 auto;padding:6px 6px 90px;box-sizing:border-box}
  @media (prefers-color-scheme:dark){#norma{--bg:#14171a;--card:#1d2126;--text:#e8eaed;--muted:#9aa3ad;--line:#2f353c;--accent:#6ea0ff;--good:#4ade80;--bad:#f87171}}
  #norma *{box-sizing:border-box}
  #norma h2{margin:4px 0 8px;font-size:1.1rem}
  #norma .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
  #norma .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  #norma label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #norma input{width:100%;min-width:0;padding:8px 6px;min-height:40px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px}
  #norma input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  #norma table,#norma tbody{display:block;width:100%}
  #norma thead{display:none}
  #norma button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:6px 10px;min-height:38px}
  #norma button:hover{border-color:var(--accent)}
  #norma button.x{padding:0;width:32px;min-height:40px;color:var(--muted);font-size:1rem}
  /* рядок роботи: артикул | назва | норма | к-сть | ✕ — в один ряд */
  #norma tr.item{display:grid;grid-template-columns:78px minmax(0,1fr) 58px 56px 32px;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px;margin-bottom:5px}
  #norma tr.item td{display:block;padding:0;min-width:0}
  #norma tr.item td.art{grid-column:2;grid-row:1}
  #norma tr.item td.name{grid-column:1;grid-row:1}
  #norma tr.item td.f1{grid-column:3;grid-row:1}
  #norma tr.item td.f2{grid-column:4;grid-row:1}
  #norma tr.item td.del{grid-column:5;grid-row:1}
  #norma tr.item td.sg{grid-column:1 / 6;grid-row:2}
  #norma tr.item td.calc{grid-column:1 / 6;grid-row:3;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
  #norma tr.item td.calc:has(.calc-line:empty),#norma tr.item td.sg:has(.sugg:empty){display:none}
  #norma .calc-line{display:flex;gap:12px}
  /* непродуктивний час: поле + ✕ в один ряд */
  #norma tr.dn{grid-template-columns:minmax(0,1fr) 32px}
  #norma tr.dn td.f1{grid-column:1}
  #norma tr.dn td.del{grid-column:2}
  #norma .dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  #norma #n-down{display:contents}
  #norma .dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  #norma .dhead label{margin:0}
  #norma .dhead button{min-height:30px;width:40px;padding:0}
  #norma .sugg{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;max-height:96px;overflow-y:auto}
  #norma .sugg .cap{flex-basis:100%;font-size:.7rem;color:var(--muted)}
  #norma .chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--accent);color:var(--accent);background:var(--bg);border-radius:999px;padding:4px 4px 4px 10px;font-size:.85rem;cursor:pointer;user-select:none}
  #norma .chip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #norma .chip .d{color:var(--muted);padding:0 6px}
  #norma .row-actions{display:flex;gap:6px;margin-top:4px}
  #norma .row-actions button{flex:1}
  #norma .result{display:grid;grid-template-columns:1fr;gap:6px}
  #norma .stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  #norma .stat .v{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  #norma .stat .l{font-size:.7rem;color:var(--muted)}
  #norma .good{color:var(--good)} #norma .bad{color:var(--bad)}
  #norma .hint{font-size:.72rem;color:var(--muted);margin:6px 0 0}
  #norma .sticky{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #norma .sticky .stat{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  #norma .sticky .stat .v{font-size:1.25rem;order:2}
  #norma .sticky .stat .l{order:1}
</style>
</head>
<body>

<div id="norma">
  <h2>Калькулятор виконання норми</h2>

  <div class="card">
    <div class="grid">
      <div><label for="n-shift">Зміна, хв</label><input id="n-shift" type="number" min="0" step="1" value="450"></div>
      <div><label for="n-start">Початок</label><input id="n-start" type="time" value="07:00"></div>
      <div><label for="n-lunch">Обід, хв</label><input id="n-lunch" type="number" min="0" step="1" value="30"></div>
    </div>
  </div>

  <div class="card">
    <table><tbody id="n-rows"></tbody></table>
    <div class="row-actions"><button id="n-add" type="button">+ Додати рядок</button></div>
  </div>

  <div class="card">
    <div class="dhead"><label>Непродуктивний час, хв</label></div>
    <div class="dgrid"><span id="n-down"></span></div>
  </div>

  <div class="sticky">
    <div class="stat"><div class="l">За всю зміну</div><div class="v" id="r-pct">0%</div></div>
    <div class="stat"><div class="l">На зараз</div><div class="v" id="r-live">—</div></div>
  </div>

  <div class="card">
    <div class="result">
      <div class="stat"><div class="v" id="r-prod">0</div><div class="l">Продуктивний час, хв</div></div>
    </div>
    <div class="row-actions"><button id="n-clear-qty" type="button">Очистити кількість</button><button id="n-reset" type="button">Очистити все</button></div>
  </div>
</div>

<script>
(function () {
  var KEY = 'norma-calc-v1';
  var $ = function (id) { return document.getElementById(id); };
  var num = function (v) { var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
  var state = load() || { shift: 450, start: '07:00', lunch: 30,
    rows: [{ name: '', art: '', norm: '', qty: '' }], down: [{ name: '', min: '' }] };

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  state.rows.forEach(function (r) { if (r.art === undefined) r.art = ''; });
  var LIBKEY = 'norma-lib-v1';
  function loadLib() { try { return JSON.parse(localStorage.getItem(LIBKEY)) || {}; } catch (e) { return {}; } }
  var LIBMAX = 50;
  var lib = loadLib();
  function saveLib() { try { localStorage.setItem(LIBKEY, JSON.stringify(lib)); } catch (e) {} }
  function upsertLib(r) {
    if (!/^\d{7}$/.test(r.art)) return;
    if (!r.name && !r.norm) return;           // не затирати збережене порожніми полями
    lib[r.art] = { name: r.name, norm: r.norm, t: Date.now() };
    Object.keys(lib).sort(function (a, b) { return (lib[b].t || 0) - (lib[a].t || 0); })
      .slice(LIBMAX).forEach(function (k) { delete lib[k]; });   // лишаємо останні LIBMAX
    saveLib();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function fmt(n, d) { return n.toLocaleString('uk-UA', { maximumFractionDigits: d === undefined ? 1 : d }); }

  function elapsedMinutes() {
    var p = (state.start || '07:00').split(':');
    var startMin = (+p[0]) * 60 + (+p[1] || 0);
    var now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
    var diff = nowMin - startMin;
    if (diff < 0) diff += 1440;            // зміна через північ
    diff -= num(state.lunch);
    return Math.max(0, Math.min(diff, num(state.shift)));
  }

  function renderRows() {
    var tb = $('n-rows'); tb.innerHTML = '';
    state.rows.forEach(function (r, i) {
      var tr = document.createElement('tr'); tr.className = 'item';
      tr.innerHTML =
        '<td class="name"><input data-k="name" placeholder="Назва" autocomplete="off"></td>' +
        '<td class="art"><input data-k="art" inputmode="numeric" maxlength="7" pattern="[0-9]*" placeholder="Артикул" autocomplete="off"></td>' +
        '<td class="f1"><input data-k="norm" inputmode="decimal" placeholder="Норма"></td>' +
        '<td class="f2"><input data-k="qty" inputmode="decimal" placeholder="Шт"></td>' +
        '<td class="del"><button class="x" type="button" aria-label="Видалити рядок">✕</button></td>' +
        '<td class="sg"><div class="sugg"></div></td>' +
        '<td class="calc"><span class="calc-line"><span data-c="ph"></span></span></td>';
      var sugg = tr.querySelector('.sugg');
      function showSugg() {
        sugg.innerHTML = '';
        var keys = Object.keys(lib).filter(function (k) { return k.indexOf(r.art) === 0; }).sort(function (a, b) { return (lib[b].t || 0) - (lib[a].t || 0); }).slice(0, LIBMAX);
        if (!keys.length) return;
        var cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = 'Додати зі збереженого:';
        sugg.appendChild(cap);
        keys.forEach(function (k) {
          var it = lib[k], chip = document.createElement('div'); chip.className = 'chip';
          var t = document.createElement('span'); t.className = 't';
          t.textContent = k + (it.name ? ' · ' + it.name : '') + (it.norm ? ' · ' + it.norm : '');
          var d = document.createElement('span'); d.className = 'd'; d.textContent = '✕'; d.title = 'Видалити зі збереженого';
          chip.appendChild(t); chip.appendChild(d); sugg.appendChild(chip);
          chip.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            if (e.target === d) {
              if (confirm('Видалити ' + k + ' зі збереженого?')) { delete lib[k]; saveLib(); showSugg(); }
              return;
            }
            r.art = k; r.name = it.name || ''; r.norm = it.norm || '';
            tr.querySelector('[data-k="art"]').value = r.art;
            tr.querySelector('[data-k="name"]').value = r.name;
            tr.querySelector('[data-k="norm"]').value = r.norm;
            sugg.innerHTML = ''; update();
            tr.querySelector('[data-k="qty"]').focus();   // далі вводимо кількість
          });
        });
      }
      ['name', 'art', 'norm', 'qty'].forEach(function (k) {
        var inp = tr.querySelector('[data-k="' + k + '"]');
        inp.value = r[k];
        inp.addEventListener('input', function () {
          if (k === 'art') inp.value = inp.value.replace(/\D/g, '').slice(0, 7);
          r[k] = inp.value; upsertLib(r); update();
          if (k === 'art') showSugg();
        });
      });
      var artInp = tr.querySelector('[data-k="art"]');
      artInp.addEventListener('focus', showSugg);
      artInp.addEventListener('blur', function () { setTimeout(function () { sugg.innerHTML = ''; }, 150); });
      tr.querySelector('.x').addEventListener('click', function () {
        state.rows.splice(i, 1); if (!state.rows.length) state.rows.push({ name: '', art: '', norm: '', qty: '' });
        renderRows(); update();
      });
      tb.appendChild(tr);
    });
  }

  function renderDown() {
    while (state.down.length < 5) state.down.push({ name: '', min: '' });
    state.down.length = 5;
    var box = $('n-down'); box.innerHTML = '';
    state.down.forEach(function (d) {
      var inp = document.createElement('input');
      inp.setAttribute('inputmode', 'decimal'); inp.placeholder = 'хв'; inp.value = d.min;
      inp.addEventListener('input', function () { d.min = inp.value; update(); });
      box.appendChild(inp);
    });
  }

  function update() {
    var shift = num(state.shift), downtime = 0, normMin = 0;
    state.down.forEach(function (d) { downtime += num(d.min); });

    var trs = $('n-rows').children;
    state.rows.forEach(function (r, i) {
      var norm = num(r.norm), qty = num(r.qty);
      var nm = norm * qty / 100;                 // нормо-хвилини рядка
      normMin += nm;
      trs[i].querySelector('[data-c="ph"]').textContent = norm ? 'шт/год: ' + fmt(6000 / norm) : '';
    });

    var prod = Math.max(0, shift - downtime);
    var pct = prod > 0 ? normMin / prod * 100 : 0;
    var liveBase = Math.max(0, elapsedMinutes() - downtime);
    var live = liveBase > 0 ? normMin / liveBase * 100 : null;

    function paint(el, v) { el.textContent = v === null ? '—' : fmt(v) + '%'; el.className = 'v ' + (v === null ? '' : v >= 100 ? 'good' : 'bad'); }
    paint($('r-pct'), pct); paint($('r-live'), live);
    $('r-prod').textContent = fmt(prod, 0);
    save();
  }

  [['n-shift', 'shift'], ['n-start', 'start'], ['n-lunch', 'lunch']].forEach(function (p) {
    var el = $(p[0]); el.value = state[p[1]];
    el.addEventListener('input', function () { state[p[1]] = el.value; update(); });
  });
  $('n-add').addEventListener('click', function () { state.rows.push({ name: '', art: '', norm: '', qty: '' }); renderRows(); update(); });
  $('n-clear-qty').addEventListener('click', function () {
    state.rows.forEach(function (r) { r.qty = ''; });
    renderRows(); update();
  });
  var resetBtn = $('n-reset'), resetTimer = null;
  resetBtn.addEventListener('click', function () {
    if (!resetTimer) {                         // перше натискання — підтвердження (без confirm, він може бути заблокований)
      resetBtn.textContent = 'Натисніть ще раз';
      resetTimer = setTimeout(function () { resetTimer = null; resetBtn.textContent = 'Очистити все'; }, 3000);
      return;
    }
    clearTimeout(resetTimer); resetTimer = null; resetBtn.textContent = 'Очистити все';
    state.rows = [{ name: '', art: '', norm: '', qty: '' }]; state.down = [];
    renderRows(); renderDown(); update();
  });

  renderRows(); renderDown(); update();
  setInterval(update, 60000);   // оновлювати «на зараз» щохвилини
})();
</script>
</body>
</html>
